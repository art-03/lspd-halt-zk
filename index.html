.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 22%,transparent 70%,var(--bg) 100%)}
#app{max-width:640px;margin:0 auto;padding:16px 14px 40px;position:relative}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.logo{font-size:26px}
.brand{font-weight:800;letter-spacing:.04em;font-size:18px}
.brand small{display:block;font-weight:500;letter-spacing:0;font-size:12px;color:var(--muted)}
.back{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:8px 12px;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;backdrop-filter:blur(6px)}
h1{font-size:22px;margin:0 0 6px;line-height:1.2}
h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
p{margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:14px 16px;font-size:16px;cursor:pointer;margin-bottom:10px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.btn:active{transform:scale(.99)}
.btn .ic{font-size:24px}
.btn .t{font-weight:700}
.btn .s{display:block;font-size:13px;color:var(--muted);font-weight:400}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-color:transparent}
.btn.primary .s{color:rgba(255,255,255,.85)}
.btn.off{opacity:.55;cursor:default}
.btn .pill{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tcell{display:flex;align-items:center;gap:10px;min-height:58px;text-align:left;padding:10px 12px;border-radius:14px;cursor:pointer;color:var(--text);font:inherit;
  background:color-mix(in srgb,var(--blue) 12%,var(--card2));border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));transition:background .15s,border-color .15s,transform .1s}
.tcell:active{transform:scale(.98)}
.tcell.wide{grid-column:1/-1}
.tcell .ti{flex:0 0 auto;width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;background:color-mix(in srgb,var(--blue) 22%,transparent)}
.tcell .tt{display:flex;flex-direction:column;min-width:0;flex:1}
.tcell .tt b{font-size:14.5px;font-weight:700;line-height:1.2}
.tcell .tt small{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.2}
.tcell .tk{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--blue);font-weight:900;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.tcell.on{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--blue) 35%,transparent)}
.tcell.on .tt small{color:rgba(255,255,255,.85)}
.tcell.on .ti{background:rgba(255,255,255,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;margin-bottom:10px}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin-right:6px}
.tag.pop{color:var(--gold);border-color:var(--gold)}
.q{font-size:18px;font-weight:700;margin:6px 0 8px}
.sub{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;font-size:15px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:14px;font-size:15px;margin-bottom:8px;cursor:pointer;min-height:52px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card2))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card2))}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px;margin:10px 0;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card2));border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card2));border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:4px}
.stars{color:var(--gold);letter-spacing:2px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));width:0}
.row{display:flex;gap:10px}
.row .btn{margin-bottom:0;justify-content:center;text-align:center}
.flip{min-height:250px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.big{font-size:20px;font-weight:800;line-height:1.25;margin:6px 0 10px}
.res{text-align:center;padding:10px 0}
.res .score{font-size:56px;font-weight:800;line-height:1}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
a.link{color:var(--blue2)}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tags .tag{margin:0}
.tag.code{color:#fff;background:var(--blue);border-color:var(--blue);font-weight:700}
.codebar{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:var(--muted);font-size:14px}
.codebar .pill{background:var(--blue);color:#fff;font-weight:800;border-radius:10px;padding:4px 10px;letter-spacing:.04em}
.ref{font-size:15px;font-weight:800;color:var(--blue2);letter-spacing:.02em;margin:2px 0 4px}
.ttl{font-size:20px;font-weight:800;line-height:1.25;margin:0 0 12px}
.d{white-space:pre-line;font-size:15px;margin:0 0 10px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv>span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:2px;font-weight:700}
.kv:first-of-type{margin-top:4px}
.fb .ref{margin-top:0}
.fb .ttl{font-size:17px;margin-bottom:8px}
.fb .d{font-size:14px;color:var(--muted);margin:8px 0 0}
.sub.pre{white-space:pre-line}

.sub{background:color-mix(in srgb,var(--blue) 14%,var(--card2));border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-left:5px solid var(--blue);border-radius:14px;padding:12px 14px 14px;margin:6px 0 16px;font-size:16px;line-height:1.5}
.sub::before{content:attr(data-l);display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--blue2);margin-bottom:6px}
.optlabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin:2px 2px 8px}
.opt{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:14px}
.opt .ltr{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--card2);border:1.5px solid var(--line);color:var(--muted)}
.opt .ot{flex:1;padding-top:3px;white-space:pre-line}
.opt.num .ot{font-size:18px;font-weight:700;letter-spacing:.01em}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.tag.org{border-color:#f59e0b;color:#fbbf24}

.brand .sep{color:var(--blue2);margin:0 2px;font-weight:600}
.byline{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));position:relative}
body.intro-on .byline{display:none}
.intro{min-height:calc(100svh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 8px}
.ibadge{width:88px;height:88px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:46px;background:color-mix(in srgb,var(--blue) 18%,var(--card));border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));box-shadow:0 10px 40px color-mix(in srgb,var(--blue) 35%,transparent);margin-bottom:22px}
.ititle{font-size:40px;font-weight:900;letter-spacing:.06em;line-height:1}
.ititle .sep{color:var(--blue2);font-weight:500;margin:0 6px}
.isub{margin-top:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.iline{width:64px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--blue2));margin:22px auto}
.ihead{font-size:20px;font-weight:800;margin-bottom:8px}
.idesc{max-width:340px;color:var(--muted);font-size:15px;line-height:1.5;margin:0 auto 18px}
.icodes{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:26px}
.icodes span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--blue) 40%,var(--line));background:color-mix(in srgb,var(--blue) 12%,transparent)}
.istart{width:100%;max-width:340px;justify-content:center;font-size:17px;font-weight:800;padding:16px}
.istart .arr{margin-left:6px}
.isign{margin-top:26px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.row.sticky{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;padding:10px 0 4px;background:linear-gradient(180deg,transparent,var(--bg) 35%)}

/* --- читаемость --- */
.ititle,.isub,.ihead,.isign{text-shadow:0 2px 14px rgba(0,0,0,.75)}
.ipanel{width:100%;max-width:360px;padding:18px 16px 16px;margin-bottom:22px;border-radius:20px;background:rgba(7,11,22,.62);border:1px solid rgba(120,150,220,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ipanel .idesc{margin-bottom:14px}
.ipanel .icodes{margin-bottom:0}
body.intro-on .bgimg::after{background:radial-gradient(ellipse 70% 55% at 50% 55%,rgba(7,11,22,.70),rgba(7,11,22,.25) 75%),linear-gradient(180deg,var(--bg) 0%,transparent 25%,transparent 70%,var(--bg) 100%)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--card:#0f1626eb;--card2:#141d33eb;--muted:#aebbdb}
  :root:not([data-theme="light"]) .idesc{color:#d3dcf0}
  :root:not([data-theme="light"]) .isub{color:#c3cee8}
}
:root[data-theme="dark"]{--card:#0f1626eb;--card2:#141d33eb;--muted:#aebbdb}
:root[data-theme="dark"] .idesc{color:#d3dcf0}
.bgimg::after{background:linear-gradient(180deg,var(--bg) 0%,rgba(7,11,22,.30) 22%,rgba(7,11,22,.30) 70%,var(--bg) 100%)}

/* --- поиск, закладки, прогресс, сброс --- */
.btn .bx{display:flex;flex-direction:column;flex:1;min-width:0}
.prog{display:flex;align-items:center;gap:8px;margin-top:6px}
.pbar{flex:1;height:5px;border-radius:5px;background:color-mix(in srgb,var(--blue) 15%,var(--line));overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:5px}
.pl{font-size:11.5px;color:var(--muted);white-space:nowrap}
.btn.search{border-color:color-mix(in srgb,var(--blue) 45%,var(--line));background:color-mix(in srgb,var(--blue) 14%,var(--card))}
.sinput{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--blue) 45%,var(--line));background:var(--card2);color:var(--text);outline:none;margin:6px 0 10px}
.sinput:focus{border-color:var(--blue)}
.schips{display:flex;flex-wrap:wrap;gap:6px}
.schip{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--text);background:color-mix(in srgb,var(--blue) 10%,var(--card2));border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line))}
.schip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sres{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font:inherit;color:var(--text);cursor:pointer;padding:12px 14px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.sres:active{transform:scale(.99)}
.sref{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--blue2)}
.stit{font-weight:700;font-size:15px;line-height:1.3}
.ssn{font-size:13px;color:var(--muted);line-height:1.4}
.sh{margin:6px 2px 10px}
.center{text-align:center}
.favbtn{display:block;width:100%;margin:10px 0;font:inherit;font-size:14px;font-weight:700;padding:11px;border-radius:12px;cursor:pointer;color:var(--text);background:transparent;border:1px dashed color-mix(in srgb,var(--gold) 55%,var(--line))}
.favbtn.on{background:color-mix(in srgb,var(--gold) 18%,transparent);border-style:solid;color:#fbbf24}
.reptag{font-size:12px;font-weight:700;color:#fbbf24;margin-bottom:8px}
.reset{display:block;width:100%;margin:14px 0 4px;font:inherit;font-size:13px;padding:10px;border-radius:12px;cursor:pointer;color:var(--muted);background:transparent;border:1px solid var(--line)}
.reset.armed{color:#fff;background:var(--bad);border-color:var(--bad);font-weight:700}

an- Andreas и/или препятствование осуществлению его конституционных полномочий.","note":"","cat":"Права и свободы человека","pun":"3 года лишения свободы","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"10.1","part":"ч. 1","title":"Кража","desc":"Кража, то есть тайное хищение чужого имущества, стоимостью свыше $15.000.","note":"","cat":"Собственность","pun":"3 года лишения свободы или уголовный штраф в размере от 50.000$ до 70.000$","jur":"Региональная/Финансовая","starsN":3,"starsText":"★★★"},{"art":"10.1.1","part":"ст.","title":"Кража со взломом","desc":"Тайное хищение чужого имущества, совершённое с предварительным взломом хранилища, помещения, сейфа или иного запирающего устройства.","note":"","cat":"Собственность","pun":"4 года лишения свободы или уголовный штраф в размере от 70.000$ до 100.000$","jur":"Региональная/Федеральная","starsN":4,"starsText":"★★★★"},{"art":"10.2","part":"ст.","title":"Мошенничество","desc":"Хищение чужого имущества или приобретение права на чужое имущество путем обмана или злоупотребления доверием.","note":"","cat":"Собственность","pun":"3 года лишения свободы","jur":"Региональная/Финансовая","starsN":3,"starsText":"★★★"},{"art":"10.2.1","part":"ст.","title":"Вымогательство","desc":"Требование передачи чужого имущества или права на имущество или совершения других действий имущественного характера под угрозой применения насилия либо уничтожения или повреждения чужого имущества, а равно под угрозой распространения сведений, позорящих потерпевшего или его близких, либо иных сведений, которые могут причинить существенный вред правам или законным интересам потерпевшего или его близких.","note":"","cat":"Собственность","pun":"3 года лишения свободы","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"10.3","part":"ст.","title":"Грабеж","desc":"Открытое хищение чужого имущества.","note":"","cat":"Собственность","pun":"3 года лишения свободы","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★ иков на премии при отсутствии отчетности; хищение денежных средств выданных из госбюджета).","note":"","cat":"Экономика","pun":"5 лет лишения свободы","jur":"Финансовая","starsN":5,"starsText":"★★★★★"},{"art":"11.7","part":"ст.","title":"Финансирование экстремистской деятельности","desc":"Финансирование экстремистской деятельности (терроризм, а также действия, направленные на насильственное изменение или свержение конституционного строя, на захват государственной власти).","note":"","cat":"Экономика","pun":"5 лет лишения свободы","jur":"Финансовая","starsN":5,"starsText":"★★★★★"},{"art":"12.1","part":"ст.","title":"Терроризм","desc":"Совершение взрыва, поджога или иных действий, устрашающих население и создающих опасность гибели человека, причинения значительного имущественного ущерба либо наступления иных тяжких последствий, в целях дестабилизации деятельности органов власти или международных организаций либо воздействия на принятие ими решений, а также угроза совершения указанных действий в целях воздействия на принятие решений органами власти.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"12.1.1","part":"ст.","title":"Публичные призывы к терроризму и его оправдание","desc":"Публичные призывы к осуществлению террористической деятельности, публичное оправдание терроризма или пропаганда терроризма.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"12.1.2","part":"ч. 1","title":"Склонение и вербовка в терроризм","desc":"Склонение, вербовка или иное вовлечение лица в совершение террористического акта.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"12.2","part":"ч. 1","title":"Несообщение о преступлении","desc":"Несообщение в органы власти, уполномоченные рассматривать сообщения о прест тской деятельности.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"12.5","part":"ч. 2","title":"Организация экстремистской организации","desc":"Склонение, вербовка или иное вовлечение лица в деятельность экстремистской организации.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"12.5","part":"ч. 3","title":"Организация экстремистской организации","desc":"Участие в деятельности общественного или религиозного объединения либо иной организации, в отношении которых принято вступившее в законную силу решение о ликвидации или запрете деятельности в связи с осуществлением экстремистской деятельности.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"12.5","part":"ч. 4","title":"Организация экстремистской организации","desc":"Те же деяния, совершенные лицом с использованием своего служебного положения.","note":"Примечание: лицо, впервые совершившее преступление, предусмотренное настоящей статьей, и добровольно прекратившее участие в деятельности общественного или религиозного объединения либо иной организации, в отношении которых судом принято вступившее в законную силу решение о ликвидации или запрете деятельности в связи с осуществлением экстремистской деятельности, освобождается от уголовной ответственности, если в его действиях не содержится иного состава преступления.","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"12.6","part":"ч. 1","title":"Нарушение порядка собраний и митингов","desc":"Нарушение установленного порядка организации либо проведения собрания, митинга или публичного мероприятия, если это деяние совершено неоднократно.","note":"","cat":"Общественная безопасность","pun":"3 года лишения свободы","jur":"Федеральная","starsN":3,"starsText":"★★★"},{"art":"12.6","part":"ч. 2","title":"Нарушение порядка собраний и митингов","desc":"Организация либо активное участие в собрании, митинге или публичном мероприятии, если таковое повлекло за собой организацию массовых беспорядков, сопровождавшихся насилием, погромами, поджогами, уничтожением имущества, применением оружия, взрывных устройств, взрывчатых, отравляющих либо иных веществ и предметов, представляющих опасность для окружающих, а также оказание вооруженного сопротивления представителю власти, а равно подготовка лица для организации таких массовых беспорядков или участия в них.","note":"","cat":"Общественная безопасность","pun":"3 года лишения свободы","jur":"Федеральная","starsN":3,"starsText":"★★★"},{"art":"12.6.1","part":"ч. 1","title":"Массовые беспорядки","desc":"Организация массовых беспорядков, сопровождавшихся насилием, погромами, поджогами, уничтожением имущества, применением оружия, взрывных устройств, взрывчатых, отравляющих либо иных веществ и предметов, представляющих опасность для окружающих, а также оказанием вооруженного сопротивления представителю власти, а равно подготовка лица для организации таких массовых беспорядков или участия в них.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"12.7","part":"ч. 1","title":"Незаконное проникновение на закрытый объект","desc":"Незаконное проникновение и/или нахождение на охраняемом объекте в соответствие с законодательством Штата San-Andreas.","note":"","cat":"Общественная безопасность","pun":"3 года лишения свободы, либо уголовный штраф в размере от 20.000$ до 50.000$","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"12.7","part":"ч. 2","title":"Незаконное проникновение на закрытый объект","desc":"Незаконное проникновение и/или нахождение на особо охраняемом объекте в соответствии с законодательством Штата San-Andreas.","note":"","cat":"Общественная безопасность" xt":"★★★★"},{"art":"12.9","part":"ст.","title":"Незаконный оборот взрывчатых веществ","desc":"Незаконные приобретение, передача, сбыт, хранение, перевозка, изготовление или ношение взрывчатых веществ или взрывных устройств.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"12.10","part":"ст.","title":"Хищение огнестрельного оружия и боеприпасов","desc":"Хищение огнестрельного оружия, комплектующих деталей к нему, спецсредств, боеприпасов, взрывчатых веществ или взрывных устройств.","note":"","cat":"Общественная безопасность","pun":"4 года лишения свободы","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"12.10.1","part":"ст.","title":"Хищение государственного оружия и имущества","desc":"Хищение государственного имущества, совершенное сотрудниками правоохранительных органов, огнестрельного оружия, комплектующих деталей к нему, спецсредств, боеприпасов, взрывчатых веществ или взрывных устройств, изъятых в ходе служебной деятельности и (или) находящихся на складе улик (вещественных доказательств) или подлежащее уничтожению.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"12.11","part":"ст.","title":"Создание вооружённого формирования","desc":"Создание вооруженного формирования (объединения, отряда, или иной группы), не предусмотренного законом, а равно руководство таким формированием или его финансирование.","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"12.12","part":"ст.","title":"Организация преступного сообщества (преступной организации) или участие в нем (ней)","desc":"","note":"","cat":"Общественная безопасность","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"12.13","part":"ст.","title":"Получение сведений, составляющих "ст.","title":"Наркотики у сотрудников госструктур","desc":"Приобретение, хранение, перевозка, изготовление, сбор, сбыт наркотических веществ сотрудниками гос. структур. Исключения: Сотрудники отдела DEA и K-9, CID, DB и иных отделов при исполнении служебных обязанностей.","note":"Примечание: Сотрудники отделов DEA, K-9, CID, DB и иных отделов, предусмотренные уставом государственных правоохранительных структур, которые занимаются борьбой с наркотическими веществами при исполнении ими служебных обязанностей не подлежат ответственности за хранение, перевозку, изготовление, сбор наркотических веществ. Сотрудники указанных отделов освобождаются от ответственности за сбыт и приобретение наркотических веществ при проведении контрольной закупки и покупки наркотических веществ.","cat":"Наркотики и грузы","pun":"5 лет лишения свободы","jur":"ФЕДЕРАЛЬНЫЙ/РЕГИОНАЛЬНЫЙ","starsN":5,"starsText":"★★★★★"},{"art":"13.5","part":"ч. 1","title":"Перевозка грузов с поддельными документами","desc":"Перевозка грузов, подлежащих обязательному декларированию или ограниченных к обороту, с использованием заведомо поддельных накладных, счетов-фактур либо иных товаросопроводительных документов.","note":"","cat":"Наркотики и грузы","pun":"3 года лишения свободы или уголовный штраф в размере от $25.000 до $50.000","jur":"Региональная","starsN":null,"starsText":"★★★ / ★★★★"},{"art":"13.5","part":"ч. 2","title":"Перевозка грузов с поддельными документами","desc":"Те же действия, совершенные группой лиц по предварительному сговору либо с использованием служебного положения.","note":"","cat":"Наркотики и грузы","pun":"4 года лишения свободы или уголовный штраф в размере от $40.000 до $70.000","jur":"Региональная","starsN":null,"starsText":"★★★ / ★★★★"},{"art":"14.1","part":"ст.","title":"Дискредитация органов государственной власти","desc":"Публичные действия, направленные на дискредитацию исполнения государственными органами штата San-Andreas своих полномочий, которые повлекли существенное нарушение прав и законных интересов граждан, общества или государства.","note":"","cat":"Конституционный строй","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"14.2","part":"ст.","title":"Захват и удержание власти, вооружённый мятеж","desc":"Действия, направленные на насильственный захват власти или насильственное удержание власти, а равно вооруженный мятеж, в нарушение Конституции штата San-Andreas, а равно направленные на насильственное изменение конституционного строя штата San- Andreas.","note":"","cat":"Конституционный строй","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"14.2.1","part":"ст.","title":"Сепаратизм","desc":"Сепаратизм, а равно посягательство на территориальную целостность и неприкосновенность штата San-Andreas.","note":"","cat":"Конституционный строй","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"14.3","part":"ч. 1","title":"Разглашение государственной тайны","desc":"Разглашение сведений, составляющих государственную тайну, лицом, которому она была доверена или стала известна по службе, работе, учебе или в иных случаях, предусмотренных законодательством штата San-Andreas, если эти сведения стали достоянием других лиц.","note":"","cat":"Конституционный строй","pun":"4 года лишения свободы","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"14.3.1","part":"ч. 1","title":"Незаконное получение сведений, составляющих государственную тайну","desc":"Получение сведений, составляющих государственную тайну, путем похищения, обмана, шантажа, принуждения, угрозы применения насилия либо иным незаконным способом.","note":"","cat":"Конституционный строй","pun":"4 года лишения свободы","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"14.3.2","part":"ч. 1","title":"Утрата документов, содержащих государственную тайну","desc":"Нарушение лицом, имеющим допуск к государственной тайне, установленных правил обращения с содержащими государственную тайну документами, а равно с предметами, сведения о которых составляют государственную тайну, если это повлекло по неосторожности их утрату и наступление тяжких последствий.","note":"","cat":"Конституционный строй","pun":"4 года лишения свободы","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"15.1","part":"ч. 1","title":"Превышение должностных полномочий","desc":"Совершение должностным лицом действий, явно выходящих за пределы его полномочий и повлекших существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства.","note":"","cat":"Власть и должностные","pun":"4 года лишения свободы или уголовный штраф в размере от 40.000$ до 100.000$","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.1","part":"ч. 2","title":"Превышение должностных полномочий","desc":"Деяния, предусмотренные частью первой настоящей статьи, если они совершены:\nа) с применением насилия или с угрозой его применения;\nб) с применением оружия или специальных средств;\nв) с причинением тяжких последствий,\nг) группой лиц, группой лиц по предварительному сговору или организованной группой;\nд) из корыстной или иной личной заинтересованности.","note":"","cat":"Власть и должностные","pun":"5 года лишения свободы или уголовный штраф от 70.000$ до 130.000$","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"15.1.1","part":"ч. 1","title":"Злоупотребление должностными полномочиями","desc":"Использование должностным лицом своих полномочий вопреки интересам службы, если это деяние повлекло существенное нарушение прав и законных интересов граждан или организаций, либо охраняемых законом интересов общества или государства.","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы или уголовный штраф в размере от 50.000$ до 100.000$","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"15.1.1","part":"ч. 2","title":"Злоупотребление должностными полномочиями","desc":"Использование должностным лицом своих полномочий для вмешательства или воспрепятствования процессу задержания или непосредственно аресту, а также процессу разбирательства.","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы или уголовный штраф в размере от 40.000$ до 90.000$","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"15.1.1","part":"ч. 3","title":"Злоупотребление должностными полномочиями","desc":"Деяние, предусмотренные частями 1 и 2 настоящей статьи, если они совершены сотрудником органа (отдела), уполномоченного осуществлять деятельность по расследованию должностных преступлений.","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"15.2","part":"ч. 1","title":"Неисполнение сотрудником указов и приказов","desc":"Умышленное неисполнение сотрудником органа правопорядка органов государственной власти приказа начальника, отданного в установленном порядке и не противоречащего закону, причинившее существенный вред правам и законным интересам граждан или организаций либо охраняемым законом интересам общества или государства.","note":"","cat":"Власть и должностные","pun":"4 года лишения свободы. или уголовный штраф в размере от 30.000$ до 40.000$","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.2","part":"ч. 2","title":"Неисполнение сотрудником указов и приказов","desc":"Умышленное неисполнение или ненадлежащее исполнение сотрудником органов государственной власти указа, распоряжения, поручения и иного нормативного и правового акта, выпускаемого Главами департамента Штата San- Andreas, а также их заместителей и не противоречащего закону.","note":"","cat":"Власть и должностные","pun":"4 года лишения свободы или уголовный штраф в размере от 30.000$ до 40.000$","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.2","part":"ч. 3","title":"Неисполнение сотрудником указов и приказов","desc":"Неисполнение государственными служащими приказа, указа, распоряжения или иного нормативного и правового акта Губернатора штата San-Andreas.","note":"","cat":"Власть и должностные","pun":"4 года лишения свободы","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.2","part":"ч. 4","title":"Неисполнение сотрудником указов и приказов","desc":"Неисполнение или ненадлежащее исполнение государственными служащими постановления, положения или иного нормативного и правового акта Сената штата San-Andreas, если за неисполнение такового акта отдельно не установлена административная ответственность.","note":"","cat":"Власть и должностные","pun":"4 года лишения свободы","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.3","part":"ч. 1","title":"Присвоение полномочий должностного лица","desc":"Присвоение государственным служащим или муниципальным служащим, не являющимся должностным лицом, полномочий должностного лица и совершение им в связи с этим действий, которые повлекли существенное нарушение прав и законных интересов граждан или организаций.","note":"","cat":"Власть и должностные","pun":"4 года лишения свободы","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.3","part":"ч. 2","title":"Присвоение полномочий должностного лица","desc":"Присвоение гражданским лицом, не являющимся государственным или муниципальным служащим, внешних признаков, атрибутов или действий должностного лица (включая ношение форменной одежды, служебных знаков, использование служебных документов, представление себя уполномоченным лицом), а также совершение при этом действий, повлекших существенное нарушение прав и законных интересов граждан или организаций.","note":"","cat":"Власть и должностные","pun":"3 года лишения свободы либо уголовным штрафом в размере от 30 000$ до 60 000$","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.3","part":"ч. 3","title":"Присвоение полномочий должностного лица","desc":"Деяния, предусмотренные частью 2 настоящей статьи, повлекшие по неосторожности причинение тяжкого вреда здоровью или смерть человека.","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.4","part":"ст.","title":"Получение взятки","desc":"Получение должностным лицом, лично или через посредника взятки в виде денег, иного имущества, либо в виде оказания ему услуг имущественного характера, предоставления иных имущественных прав за совершение действий (бездействие) в пользу взяткодателя или представляемых им лиц.","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"15.5","part":"ст.","title":"Дача взятки должностному лицу","desc":"Дача взятки должностному лицу лично или через посредника (в том числе когда взятка по указанию должностного лица передается иному физическому лицу).","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"15.5.1","part":"ст.","title":"Посредничество во взяточничестве","desc":"Непосредственная передача взятки по поручению взяткодателя или взяткополучателя либо иное способствование взяткодателю и (или) взяткополучателю в достижении либо реализации соглашения между ними о получении и даче взятки в значительном размере.","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"15.6","part":"ч. 1","title":"Халатность","desc":"Халатность, то есть неисполнение или ненадлежащее исполнение должностным лицом своих обязанностей вследствие недобросовестного или небрежного отношения к службе либо обязанностей по должности, если это повлекло причинение крупного ущерба или существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства.","note":"","cat":"Власть и должностные","pun":"4 года лишения свободы или штраф в размере от 40.000$ до 70.000$","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"15.6","part":"ч. 2","title":"Халатность","desc":"Деяние, предусмотренное частью первой настоящей статьи, повлекшее по неосторожности причинение тяжкого вреда здоровью или смерть человека.","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"15.6","part":"ч. 3","title":"Халатность","desc":"Халатность, не повлекшая причинения крупного ущерба или существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства, совершенная лицом, неоднократно подвергнутым административному наказанию за совершение административного правонарушения, предусмотренного статьи 9.3 Административного Кодекса, в течение десяти дней или имеющим судимость за совершение преступления, предусмотренного настоящей статьей, в течение того же срока.","note":"","cat":"Власть и должностные","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"15.7","part":"ч. 1","title":"Деструктивное поведение","desc":"Совершение должностным лицом умышленных действий, явно содержащих деструктивное по своему характеру поведение, существенно нарушающее установленные законом нормы этики и морали.\nКомментарий к ст. 15.7 ч1: При квалифицировании противоправного деяния стоит учитывать все факторы и обстоятельства, при которых оно совершилось. Такими факторами могут выступать: массовость, неконтролируемость, вспыльчивость, агрессивность, резкость в общении. При избрании санкции необходимо оценивать совокупность всех фактом, которые могут каким-либо образом иметь значение для других лиц.","note":"","cat":"Власть и должностные","pun":"3 года лишения свободы или уголовный штраф в размере от 30.000$ до 70.000$","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"16.1","part":"ч. 1","title":"Воспрепятствование правосудию и расследованию","desc":"Вмешательство в какой бы то ни было форме в деятельность суда в целях воспрепятствования осуществлению правосудия.","note":"","cat":"Правосудие","pun":"3 года лишения свободы","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"16.1","part":"ч. 2","title":"Воспрепятствование правосудию и расследованию","desc":"Вмешательство в какой бы то ни было форме в деятельность прокурора, или лица, производящего следствие, в целях воспрепятствования всестороннему, полному и объективному расследованию дела.","note":"","cat":"Правосудие","pun":"3 года лишения свободы","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"16.1","part":"ч. 3","title":"Воспрепятствование правосудию и расследованию","desc":"Деяния, предусмотренные частями первой или второй настоящей статьи, совершенные лицом с использованием своего служебного положения.","note":"","cat":"Правосудие","pun":"4 года лишения свободы","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"16.1","part":"ч. 4","title":"Воспрепятствование правосудию и расследованию","desc":"Неуважение к суду, то есть совершение действий (бездействия), свидетельствующих о явном пренебрежении к установленным правилам или порядку проведения судебного разбирательства (заседания), либо неявка участника судебного заседания, вызванного на него надлежащим образом, без уважительной причины или разрешения суда.","note":"","cat":"Правосудие","pun":"от 4 до 5 лет лишения свободы или уголовный штраф в размере от 15.000$ до 70.000$","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"16.1","part":"ч. 5","title":"Воспрепятствование правосудию и расследованию","desc":"Нарушение судебной присяги, а равно дача ложных показаний под судебной присягой.","note":"","cat":"Правосудие","pun":"от 4 до 5 лет лишения свободы или уголовный штраф в размере от 40.000$ до 80.000$","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"16.1.1","part":"ч. 1","title":"Вмешательство в деятельность защитника или представителя лица","desc":"Совершение в любой форме препятствий осуществлению правомерной деятельности защитника или представителя лица по оказанию правовой помощи/ юридической помощи либо нарушение установленных законом гарантий их деятельности и профессиональной тайны.","note":"","cat":"Правосудие","pun":"от 4 лишения свободы либо от 40.000$ до 80.000$","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"16.1.1","part":"ч. 2","title":"Вмешательство в деятельность защитника или представителя лица","desc":"Те же действия, совершённые должностным лицом с использованием своего служебного положения.","note":"","cat":"Правосудие","pun":"от 4 до 5 лет лишения свободы","jur":"Федеральная","starsN":4,"starsText":"★★★★"},{"art":"16.2","part":"ст.","title":"Угроза и посягательство на участников правосудия","desc":"Угроза, а равно посягательство на жизнь судьи, или иного лица, участвующего в отправлении правосудия, прокурора, защитника, эксперта, специалиста, судебного пристава, судебного исполнителя, а равно их близких в связи с рассмотрением дел в суде, производством расследования либо исполнением приговора, решения суда или иного судебного акта, совершенное в целях воспрепятствования законной деятельности указанных лиц либо из мести за такую деятельность.","note":"","cat":"Правосудие","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"16.3","part":"ст.","title":"Привлечение заведомо невиновного к ответственности","desc":"Привлечение заведомо невиновного к уголовной или административной ответственности.","note":"","cat":"Правосудие","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"16.4","part":"ст.","title":"Заведомо незаконное задержание, заключение под стражу или содержание под стражей","desc":"","note":"","cat":"Правосудие","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"16.5","part":"ст.","title":"Фальсификация доказательств по гражданскому и административному делу","desc":"Фальсификация доказательств по гражданскому, административному делу лицом, участвующим в деле, или его представителем.","note":"","cat":"Правосудие","pun":"5 лет лишения свободы","jur":"ФЕДЕРАЛЬНЫЙ/РЕГИОНАЛЬНЫЙ","starsN":5,"starsText":"★★★★★"},{"art":"16.6","part":"ст.","title":"Фальсификация доказательств по уголовному делу","desc":"Фальсификация доказательств по уголовному делу лицом, производящим расследование, прокурором или защитником.","note":"","cat":"Правосудие","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"16.7","part":"ст.","title":"Заведомо неправомерный судебный акт","desc":"Вынесение судьей заведомо неправомерного приговора, решения или иного судебного акта.","note":"","cat":"Правосудие","pun":"5 лет лишения свободы","jur":"Федеральная","starsN":5,"starsText":"★★★★★"},{"art":"16.8","part":"ст.","title":"Ложные показания свидетеля, потерпевшего, эксперта","desc":"Заведомо ложные показания свидетеля, потерпевшего либо заключение или показание эксперта, показание специалиста в суде.","note":"","cat":"Правосудие","pun":"4 года лишения свободы","jur":"ФЕДЕРАЛЬНЫЙ/РЕГИОНАЛЬНЫЙ","starsN":4,"starsText":"★★★★"},{"art":"16.9","part":"ст.","title":"Подкуп свидетеля и эксперта","desc":"Подкуп свидетеля, потерпевшего в целях дачи ими ложных показаний либо эксперта, специалиста в целях дачи ими ложного заключения или ложных показаний.","note":"","cat":"Правосудие","pun":"4 года лишения свободы","jur":"ФЕДЕРАЛЬНЫЙ/РЕГИОНАЛЬНЫЙ","starsN":4,"starsText":"★★★★"},{"art":"16.10","part":"ч. 1","title":"Неисполнение судебных и следственных актов","desc":"Злостное неисполнение вступивших в законную силу приговора суда, решения суда или иного судебного акта, постановления Офиса Генерального Прокурора или иного органа следствия, официального адвокатского запроса или выданного ордера, а равно воспрепятствование их исполнению.","note":"","cat":"Правосудие","pun":"4 года лишения свободы или уголовный штраф от 30.000$ до 70.000$","jur":"ФЕДЕРАЛЬНЫЙ/РЕГИОНАЛЬНЫЙ","starsN":4,"starsText":"★★★★"},{"art":"16.10","part":"ч. 2","title":"Неисполнение судебных и следственных актов","desc":"Деяние, предусмотренное частью первой настоящей статьи, совершенное представителем власти, государственным служащим, муниципальным служащим, а также служащим государственного или муниципального учреждения, коммерческой или иной организации.","note":"","cat":"Правосудие","pun":"5 лет лишения свободы или уголовный штраф от 40.000$ до 80.000$","jur":"ФЕДЕРАЛЬНЫЙ/РЕГИОНАЛЬНЫЙ","starsN":5,"starsText":"★★★★★"},{"art":"16.11","part":"ст.","title":"Сокрытие улик или уничтожение улик","desc":"","note":"","cat":"Правосудие","pun":"4 года лишения свободы","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"16.12","part":"ст.","title":"Уклонение от расследования, задержания и суда","desc":"Уклонение от расследования, задержания и суда, намеренные действия, которые направлены правонарушителем на уклонение от реального уголовного срока или другой уголовной ответственности.","note":"","cat":"Правосудие","pun":"4 года лишения свободы","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"16.13","part":"ст.","title":"Ложные показания прокурору","desc":"Заведомо ложные показания и сведения данные прокурору в ходе рассмотрения дела или проведения допроса.","note":"","cat":"Правосудие","pun":"4 года лишения свободы или уголовный штраф от 30.000$ до 50.000$","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"16.13.1","part":"ст.","title":"Ложные показания на предварительном следствии","desc":"Заведомо ложные показания свидетеля, потерпевшего, эксперта, специалиста данные в ходе предварительного следствия.","note":"","cat":"Правосудие","pun":"4 года лишения свободы или уголовный штраф от 50.000$ до 80.000$","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"16.14","part":"ст.","title":"Отказ свидетеля или потерпевшего от показаний","desc":"Отказ свидетеля или потерпевшего от дачи показаний либо уклонение потерпевшего от прохождения освидетельствования, от производства в отношении его судебной экспертизы в случаях, когда не требуется его согласие, или от предоставления образцов почерка и иных образцов для сравнительного исследования.","note":"","cat":"Правосудие","pun":"3 года лишения свободы","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"16.15","part":"ст.","title":"Уклонение от отбывания ограничения свободы или лишения свободы","desc":"","note":"Примечание 1: В случае, если в розыске указана только статья 16.15, уровень розыска сохраняется в том виде, в каком он был момент задержания, и статья 16.15 применяется по этому уровню.\nПримечание 2: В случае если лицо обвиняется в совершении преступлений за исключением 16.15 УК, то уровень розыска определяется по самой тяжкой статье.\nИсключение: лица, добровольно явившиеся для оформления явки с повинной, получают 1/2, установленного настоящей статьей, наказания.","cat":"Правосудие","pun":"от 10 до 19 суток ограничения свободы в КПЗ или от 2 до 5 лет лишения свободы с отбыванием наказания в Федеральной Тюрьме штата San-Andreas","jur":"Федеральная/Региональная","starsN":null,"starsText":"★ / ★★★★★"},{"art":"17.1","part":"ст.","title":"Посягательство на жизнь сотрудника при исполнении","desc":"Посягательство на жизнь сотрудника правоохранительного органа, военнослужащего, при исполнении им своих служебных обязанностей, а равно в связи с их исполнением или из мести за их исполнение.","note":"","cat":"Порядок управления","pun":"5 лет лишения свободы","jur":"Федеральная/Региональная","starsN":5,"starsText":"★★★★★"},{"art":"17.2","part":"ст.","title":"Насилие в отношении сотрудника при исполнении","desc":"Применение насилия, не опасного для жизни или здоровья, либо угроза применения насилия в отношении сотрудника правоохранительных органов, военнослужащего, при исполнении им своих служебных обязанностей, а равно в связи с их исполнением или из мести за их исполнение.","note":"","cat":"Порядок управления","pun":"4 года лишения свободы или уголовный штраф в размере от 40.000$ до 70.000$","jur":"Федеральная/Региональная","starsN":4,"starsText":"★★★★"},{"art":"17.3","part":"ст.","title":"Оскорбление представителя власти","desc":"Оскорбление представителя власти при исполнении им своих должностных обязанностей или в связи с их исполнением.","note":"Примечание: Оскорбление — унижение чести и достоинства человека, выраженное в неприличной или иной, противоречащей общепринятым нормам морали и нравственности, форме. Оскорбление может быть нанесено в виде высказывания (устно, письменно) или в виде действия (плевок, неприличный жест).","cat":"Порядок управления","pun":"3 года лишения свободы или уголовный штраф в размере от 20.000$ до 50.000$","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"17.4","part":"ст.","title":"Ложный вызов о преступлениях против свободы личности","desc":"О наличии заложников или происходящем похищении.","note":"","cat":"Порядок управления","pun":"4 года лишения свободы","jur":"ФЕДЕРАЛЬНЫЙ/РЕГИОНАЛЬНЫЙ","starsN":4,"starsText":"★★★★"},{"art":"17.5","part":"ст.","title":"Самоуправство","desc":"Самовольное, вопреки установленному законом или иным нормативным правовым актом порядку совершение каких-либо действий, если в результате таковые повлекли существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства.","note":"Примечание к ст. 17.5: Не являются самоуправством действия сотрудников WN по ограничению свободы лиц на территории офиса, если они совершены в порядке установленном Законом о СМИ и ПК.","cat":"Порядок управления","pun":"3 года лишения свободы","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"17.6","part":"ст.","title":"Неповиновение законному требованию","desc":"Неповиновение законному распоряжению или требованию правомочного лица, либо воспрепятствование исполнению им служебных обязанностей.","note":"","cat":"Порядок управления","pun":"3 года лишения свободы или уголовный штраф в размере от 10.000$ до 50.000$","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"17.7","part":"ст.","title":"Отказ от оплаты штрафа","desc":"Отказ от оплаты штрафа, выписанного правомочным лицом, а равно отказ от возмещения ущерба согласно законодательству.","note":"Примечание: отказом от оплаты штрафа считается: Передача штрафного тикета обратно, без уплаты штрафа; Порча штрафного тикета, без уплаты штрафа; Устный или письменный отказ лица, в отношении которого выписывается штраф; Игнорирование штрафного тикета.","cat":"Порядок управления","pun":"3 года лишения свободы или уголовный штраф в размере от 20.000$ до 60.000$","jur":"Федеральная/Региональная","starsN":3,"starsText":"★★★"},{"art":"17.8","part":"ст.","title":"Поддельная лицензия или документ","desc":"Использование не зарегистрированной лицензии и(или) подделка удостоверения или иного официального документа, предоставляющего права или освобождающего от обязанностей, в целях его использования либо сбыт такого документа и(или) лицензии.","note":"","cat":"Порядок управления","pun":"4 года лишения свободы","jur":"ФЕДЕРАЛЬНЫЙ/РЕГИОНАЛЬНЫЙ","starsN":4,"starsText":"★★★★"},{"art":"18.1","part":"ст.","title":"Неисполнение приказа начальника","desc":"Неисполнение подчиненным приказа начальника, отданного в установленном порядке, причинившее существенный вред интересам службы.","note":"","cat":"Военная служба","pun":"3 года лишения свободы или штраф в размере от 10.000$ до 25.000$","jur":"Военная","starsN":3,"starsText":"★★★"},{"art":"18.2","part":"ст.","title":"Самовольное оставление части","desc":"Самовольное оставление части или места службы, а равно неявка в срок без уважительных причин на службу при увольнении из части.","note":"","cat":"Военная служба","pun":"3 года лишения свободы или штраф в размере от 10.000$ до 30.000$","jur":"Военная","starsN":3,"starsText":"★★★"},{"art":"18.3","part":"ст.","title":"Дезертирство","desc":"Самовольное оставление части или места службы в целях уклонения от прохождения военной службы, а равно неявка в тех же целях на службу.","note":"","cat":"Военная служба","pun":"4 года лишения свободы или штраф в размере от 15.000$ до 40.000$","jur":"Военная","starsN":4,"starsText":"★★★★"},{"art":"18.4","part":"ст.","title":"Нарушение правил боевого дежурства","desc":"Нарушение правил несения боевого дежурства (боевой службы) по своевременному обнаружению и отражению внезапного нападения на охраняемый объект либо по обеспечению его безопасности.","note":"","cat":"Военная служба","pun":"3 года лишения свободы или штраф в размере 20.000$","jur":"Военная","starsN":3,"starsText":"★★★"},{"art":"18.5","part":"ст.","title":"Умышленное повреждение оружия и военной техники","desc":"Умышленные уничтожение или повреждение оружия, боеприпасов или предметов военной техники.","note":"","cat":"Военная служба","pun":"3 года лишения свободы","jur":"Военная","starsN":3,"starsText":"★★★"},{"art":"18.5.1","part":"ст.","title":"Повреждение оружия и техники по неосторожности","desc":"Уничтожение или повреждение по неосторожности оружия, боеприпасов или предметов военной техники, повлекшие тяжкие последствия.","note":"","cat":"Военная служба","pun":"4 года лишения свободы или штраф в размере от 5.000$ до 15.000$","jur":"Военная","starsN":4,"starsText":"★★★★"},{"art":"18.6","part":"ст.","title":"Нарушение правил вождения боевой и специальной техники","desc":"Нарушение правил вождения или эксплуатации боевой, специальной или транспортной машины, повлекшее по неосторожности причинение тяжкого вреда здоровью человека.","note":"","cat":"Военная служба","pun":"4 года лишения свободы","jur":"Военная","starsN":4,"starsText":"★★★★"},{"art":"19.1","part":"ст.","title":"Браконьерство. Незаконная добыча и улов, охотничьих ресурсов","desc":"","note":"","cat":"Природа и животные","pun":"3 года лишения свободы или уголовный штраф в размере от 30.000$ до 60.000$","jur":"Региональная","starsN":3,"starsText":"★★★"},{"art":"19.2","part":"ч. 1","title":"Жестокое обращение с животными","desc":"Жестокое обращение с животным в целях причинения ему боли и (или) страданий, а равно из хулиганских побуждений или из корыстных побуждений, повлекшее его гибель или увечье.","note":"","cat":"Природа и животные","pun":"2 года лишения свободы или штраф в размере от 10.000$ до 40.000$","jur":"Региональная","starsN":2,"starsText":"★★"},{"art":"19.2","part":"ч. 2","title":"Жестокое обращение с животными","desc":"Деяния, предусмотренные частью первой настоящей статьи, если они совершены:\nа) группой лиц, группой лиц по предварительному сговору или организованной группой;\nб) в присутствии малолетнего;\nв) с применением садистских методов;\nг) с публичной демонстрацией, в том числе в средствах массовой информации или информационно-телекоммуникационных сетях (включая сеть \"Интернет\");\nд) в отношении нескольких животных, - Поделиться: Vies, spadyq, merkyla и еще 7 Like Жалоба.","note":"","cat":"Природа и животные","pun":"3 года лишения свободы","jur":"Региональная","starsN":3,"starsText":"★★★"},{"art":"19.3","part":"ч. 1","title":"Изнасилование животного","desc":"Изнасилование представителя фауны, то есть половое сношение с животным с применением насилия или с угрозой его применения к представителям рогатого скота с использованием беспомощного состояния животного.","note":"","cat":"Природа и животные","pun":"2 года лишения свободы","jur":"Региональная","starsN":2,"starsText":"★★"},{"art":"19.3","part":"ч. 2","title":"Изнасилование животного","desc":"Изнасилование крупного рогатого скота, то есть половое сношение с применением насилия или с угрозой его применения к представителям рогатого скота с использованием беспомощного состояния животного.","note":"","cat":"Природа и животные","pun":"2 года лишения свободы","jur":"Региональная","starsN":2,"starsText":"★★"},{"art":"19.3","part":"ч. 3","title":"Изнасилование животного","desc":"Деяния, предусмотренные частью первой и/или второй настоящей статьи, если они совершены:\nа) совершенное группой лиц, группой лиц по предварительному сговору или организованной группой;\nб) соединенное с угрозой убийством или причинением тяжкого вреда здоровью, а также совершенное с особой жестокостью по отношению к животному;\nв) повлекшее по неосторожности смерть животного.","note":"","cat":"Природа и животные","pun":"3 года лишения свободы","jur":"Региональная","starsN":3,"starsText":"★★★"}],"ak":[{"art":"5.1","part":"ч. 1","title":"Мелкое хулиганство","desc":"Действия, которые могут быть расценены хулиганскими:\nа) в общем порядке:\n– Оскорбительное приставание к гражданам;\n– Действия, несущие угрозу обществу (размахивания кулаками, ногами);\nб) в местах большого скопления людей, помещениях государственных учреждений и прилегающих к ним территориях, парках, скверах, пляжи, а также скопление людей от 7-ми человек:\n– Нецензурная брань;\n– Неприличные жесты;\nв) в помещениях государственных организациях и прилегающих к ним территориях:\n– Заниматься спортом, выполнять спортивные упражнения, танцевать;\n– Катать на спине, ползать, неоднократно свистеть, кричать;\n– Использование устройств, воспроизводящих музыку или другие звуки.","note":"Исключение: территории EMS, WN.\nг) иное поведение человека, противоречащие общепринятым нормам морали и нравственности.\nПримечание: общественные места\n– места большого скопления людей, а равно госучреждения, скверы, парки, пляжи, прилегающие территории гос организации.","cat":"Общественный порядок","fine":"штраф в размере от 3.000$ до 7.000$"},{"art":"5.1","part":"ч. 2","title":"Мелкое хулиганство","desc":"Повторное совершение административного правонарушения, предусмотренного частью 1 настоящей статьи влечет.","note":"","cat":"Общественный порядок","fine":"штраф в размере от 5.000$ до 10.000$"},{"art":"5.2","part":"ст.","title":"Транспорт внутри государственных учреждений","desc":"Использование любых видов транспорта (мопед, автомобиль, мотоцикл, велосипеды и т.п.) внутри помещений государственных учреждений.","note":"","cat":"Общественный порядок","fine":"штраф в размере 20.000$"},{"art":"5.3","part":"ч. 1","title":"Неприемлемый вид и опьянение в общественном месте","desc":"Нахождение без любого из элементов верхней одежды в местах большого скопления людей, а также в помещениях государственных организаций и прилегающим к ним территориям.","note":"Исключение: нахождение без любого из элементов верхней одежды допустимо в случае нахождения на территории пляжей, иных водоемов, зданий ЕМС в специализированных комнатах, магазинах одежды и почты, а так же в случае допустимости отсутствия таковых элементов.","cat":"Общественный порядок","fine":"штраф в размере от 5.000$ до 20.000$"},{"art":"5.3","part":"ч. 2","title":"Неприемлемый вид и опьянение в общественном месте","desc":"Потребление (распитие) алкогольной продукции либо наркотических средств или психотропных веществ, новых потенциально опасных психоактивных веществ или одурманивающих веществ в местах большого скопления людей, равно как появление в алкогольном или наркотическом опьянении.","note":"Исключение: развлекательные, увеселительные учреждения.","cat":"Общественный порядок","fine":"штраф в размере от 5.000$ до 20.000$"},{"art":"5.3","part":"ч. 3","title":"Неприемлемый вид и опьянение в общественном месте","desc":"Нахождение мужчин в беговых шортах/трусах, женщин в купальниках/трусах на территории государственных организаций.","note":"Исключение: Здания EMS и прилегающая территория.","cat":"Общественный порядок","fine":"штраф в размере от 5.000$ до 20.000$"},{"art":"5.5","part":"ст.","title":"Ношение холодного оружия в открытом виде","desc":"Ношение в открытом виде или использование не по назначению холодного оружия, инструментов и спортивного инвентаря в людном месте.","note":"","cat":"Общественный порядок","fine":"штраф в размере 20.000$"},{"art":"5.6","part":"ч. 1","title":"Нарушение порядка собрания или митинга","desc":"Нарушение организатором/участником публичного мероприятия установленного порядка организации либо проведения собрания или митинга.","note":"","cat":"Общественный порядок","fine":"штраф в размере 20.000$"},{"art":"5.7","part":"ч. 1","title":"Водителю запрещено совершать безрассудное вождение","desc":"Деяние, предусмотренное соответствующей статьей Дорожного кодекса, совершение иных действий, которые в случаях опасного вождения угрожают жизни или здоровью окружающим людям.","note":"","cat":"Общественный порядок","fine":"штраф в размере до 20.000$ с лишением водительской лицензии"},{"art":"5.8","part":"ч. 1","title":"Заведомо ложный вызов специализированных служб","desc":"Заведомо ложный вызов полиции, скорой медицинской помощи или иных специализированных служб.","note":"","cat":"Общественный порядок","fine":"влечет наложение административного штрафа в размере от 10.000$ до 20.000$"},{"art":"5.9","part":"ст.","title":"Неуважение к Сенату штата San-Andreas, в том числе оскорбление участников сената","desc":"","note":"","cat":"Общественный порядок","fine":"штраф в размере от 15.000$ до 100.000$"},{"art":"5.10","part":"ч. 1","title":"Воспрепятствование деятельности Сената штата Сан-Андреас","desc":"Отказ выполнить законное предписание Сената Сан-Андреас, выразившийся в неявке по официальной повестке для дачи показаний или предоставления документов без уважительных причин, уклонение от предоставления требуемой информации, а также предоставление заведомо ложных, искаженных или неполных сведений в ответ на запросы Сената штата Сан-Андреас или его уполномоченных органов.","note":"","cat":"Общественный порядок","fine":"влечет наложение административного штрафа в размере от 33.000$ до 130.000$"},{"art":"5.10","part":"ч. 2","title":"Воспрепятствование деятельности Сената штата Сан-Андреас","desc":"Отказ Правительства штата Сан-Андреас, Генерального Прокурора штата Сан-Андреа  имущество","fine":"штраф работодателю в размере 150.000$"},{"art":"6.1.2","part":"ст.","title":"Нарушение требований охраны труда","desc":"Нарушение государственных нормативных требований охраны труда, содержащихся в законах и иных нормативных правовых актах.","note":"","cat":"Права граждан и имущество","fine":"штраф в размере от 20.000 до 50.000$, юридическим лицам - от 50.000 до 100.000 $"},{"art":"6.2","part":"ч. 1","title":"Курение в общественных местах","desc":"Запрещено курение с использованием специальных приспособлений или без них табака, никотин содержащей продукции или кальянов, на территории общественных мест вне специально отведенных территорий, государственных организаций, на расстоянии до 10 метров от любого из входов и выходов, органах государственной власти.","note":"Исключение: объекты, находящиеся в частной собственности, клубы, пляжи и улицы.","cat":"Права граждан и имущество","fine":"штраф в размере от 5.000$ до 20.000$"},{"art":"6.3","part":"ч. 1","title":"Нанесение повреждений чужому имуществу","desc":"Неосторожное нанесение повреждений чужому имуществу.","note":"","cat":"Права граждан и имущество","fine":"штраф в размере 15.000$, с возмещением ущерба потерпевшей стороне, в зависимости от масштаба нанесенного ущерба"},{"art":"6.4","part":"ст.","title":"Нарушение работодателем прав сотрудника на обеденный перерыв или отпуск","desc":"","note":"","cat":"Права граждан и имущество","fine":"штраф работодателю в размере 50.000$"},{"art":"6.5","part":"ст.","title":"Несоответствие правил внутреннего трудового распорядка текущему законодательству","desc":"","note":"","cat":"Права граждан и имущество","fine":"штраф работодателю в размере 30.000$"},{"art":"6.6","part":"ст.","title":"Воспрепятствование работе журналистов","desc":"Воспрепятствование законной профессиональной деятельности журналистов путем незаконного ограничения права поиска, получения, передачи, производства и распространения информации любым законным способом.","note":"","cat":"Права граж ст.","title":"Злоупотребление должностными полномочиями","desc":"Использование должностным лицом своих полномочий вопреки интересам службы, если это деяние не повлекло существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства.","note":"","cat":"Правосудие и власть","fine":"штраф в размере от 10.000$ до 20.000$"},{"art":"9.3","part":"ст.","title":"Халатность","desc":"Неисполнение или ненадлежащее исполнение должностным лицом своих обязанностей вследствие недобросовестного или небрежного отношения к службе либо обязанностей по должности, если это не повлекло причинение крупного ущерба или существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства.","note":"","cat":"Правосудие и власть","fine":"штраф в размере от 10.000$ до 20.000$"},{"art":"9.4","part":"ст.","title":"Неявка на плановую проверку ОГП","desc":"Необеспечение уполномоченными представителями организации явки на плановую проверку, инициированную Офисом Генерального прокурора в установленный срок.","note":"","cat":"Правосудие и власть","fine":"штраф на организацию в размере в размере от 50.000$ до 350.000$"},{"art":"9.5","part":"ст.","title":"Нарушение территориальной юрисдикции","desc":"Нарушение территориальной юрисдикции государственным служащим без оснований, предусмотренных законом.","note":"","cat":"Правосудие и власть","fine":"штраф в размере 20.000$"},{"art":"10.1","part":"ч. 1","title":"Незаконная агитационная деятельность","desc":"Осуществление агитационной деятельности в местах большого скопления людей, адресованную неограниченному кругу лиц без согласования с Администрацией Муниципалитета (Округа).","note":"","cat":"Порядок управления","fine":"штраф в размере 20.000$"},{"art":"10.1","part":"ч. 2","title":"Незаконная агитационная деятельность","desc":"Осуществление агитационной деятельности на территории государственной структуры без согласования с непос art":"14.12","part":"ст.","title":"Неоднократный отказ или уклонение от прохождения проверки пожарной безопасности","desc":"","note":"","cat":"Здравоохранение и финансы","fine":"штраф на организацию в размере 500.000$ / штраф ответственному со стороны организации лицу в размере 15.000$"},{"art":"14.13","part":"ст.","title":"Неудовлетворительная оценка пожарной безопасности","desc":"","note":"","cat":"Здравоохранение и финансы","fine":"штраф на организацию в размере от 20.000$ до 100.000$"},{"art":"14.14","part":"ст.","title":"Отказ или уклонение от прохождения медицинской проверки","desc":"","note":"","cat":"Здравоохранение и финансы","fine":"штраф на организацию в размере 300.000$ / штраф ответственному со стороны организации лицу в размере 15.000$"},{"art":"14.15","part":"ст.","title":"Отказ или уклонение от проведения медицинской проверки","desc":"","note":"","cat":"Здравоохранение и финансы","fine":"штраф на организацию в размере 160.000$"},{"art":"14.16","part":"ст.","title":"Отказ отдела EMS от медицинской проверки","desc":"Неоднократный отказ соответствующего отдела EMS от проведения медицинской проверки.","note":"","cat":"Здравоохранение и финансы","fine":"штраф на организацию в размере 250.000$ / штраф ответственному за проведение проверок лицу в размере 20.000$"},{"art":"14.17","part":"ст.","title":"Неоднократный отказ или уклонение от прохождения медицинской проверки","desc":"","note":"","cat":"Здравоохранение и финансы","fine":"штраф на организацию в размере 600.000$ / штраф ответственному за проведение проверок лицу в размере 20.000$"},{"art":"14.18","part":"ст.","title":"Непредставление финансовой отчётности","desc":"Непредставление или несвоевременное представление отчётности о финансовой деятельности.","note":"","cat":"Здравоохранение и финансы","fine":"штраф в размере в размере от 10.000$ до 40.000$"},{"art":"14.19","part":"ст.","title":"Предоставление недостоверной или неполной информации о финансовой деятельности","desc":"","note":"","cat":"Здравоохранение и финансы","fine":"штраф в размере от 15.000$ до 50.000$"},{"art":"14.20","part":"ст.","title":"Отказ от оплаты медицинской услуги","desc":"Отказ или уклонение лица от оплаты оказанной медицинской услуги, если указанное лицо получило такую услугу, запросило, инициировало, организовало ее оказание либо согласилось на ее оплату после предварительного уведомления о стоимости услуги.","note":"Примечание 1: обязанность оплаты стоимости медицинской услуги и штрафа по настоящей статье возлагается на лицо, получившее медицинскую услугу, либо на лицо, которое запросило, инициировало, организовало ее оказание или согласилось на ее оплату.\nПримечание 2: лицо, фактически передавшее обращение сотруднику EMS по рации, телефону, межведомственной связи или иным способом, не признается обязанным к оплате процедуры только по факту такой передачи, если оно действовало по просьбе, требованию или поручению другого лица.\nПримечание 3: если обращение к сотруднику EMS было передано одним лицом по устной или письменной просьбе, требованию либо поручению другого лица, инициатором обращения признается лицо, по волеизъявлению которого такое обращение было совершено.\nПримечание 4: ответственность по настоящей статье не наступает, если медицинская услуга была оказана в экстренном порядке при наличии угрозы жизни или здоровью пациента.","cat":"Здравоохранение и финансы","fine":"штраф в размере от 10.000$ до 30.000$, а также обязанность оплатить стоимость оказанной медицинской услуги"},{"art":"14.21","part":"ст.","title":"Необоснованное отвлечение сотрудника EMS","desc":"Необоснованное отвлечение сотрудника EMS. Необоснованный вызов сотрудника EMS либо иное обращение, повлекшее выезд или отвлечение сотрудника EMS от исполнения иных служебных обязанностей, если после прибытия или начала исполнения обращения лицо, инициировавшее вызов, Community platform by XenForo © 2010-2026 XenForo Ltd. | Style by ThemeHouse Русский (RU) Обратная связь Условия и правила Политика конфиденциальности Помощь Главная Поделиться: Like Жалоба.","note":"Примечание 1: ответственность по настоящей статье несет лицо, которое своим требованием, просьбой, поручением, согласием либо иным волеизъявлением стало основанием для вызова или обращения к сотруднику EMS.\nПримечание 2: лицо, фактически передавшее вызов через рацию, телефон, межведомственную связь или иным техническим способом, не несет ответственности по настоящей статье только по факту передачи обращения, если оно действовало по просьбе, требованию или поручению другого лица и не являлось инициатором необоснованного отвлечения.\nПримечание 3: отказ от оказания платной медицинской услуги по причине несогласия с ее стоимостью не признается уважительной причиной, если стоимость такой услуги установлена утвержденным прайс-листом EMS и была предварительно сообщена лицу, обязанному оплатить услугу.","cat":"Здравоохранение и финансы","fine":"штраф в размере от 5.000$ до 20.000$"}],"dk":[{"art":"1","part":"ст.","title":"Документы водителя по требованию сотрудника","desc":"Водитель должен предъявить и передать по первому требованию сотрудника правоохранительных органов свою лицензию на управление транспортным средством с соответствующей категорией, а также документ удостоверяющий личность.","note":"","cat":"Обязанности водителя","fine":"штраф до $5.000"},{"art":"2","part":"ст.","title":"Остановка по требованию сотрудника","desc":"Водитель обязан остановиться по требованию сотрудника правоохранительных органов и покинуть транспортное средство.","note":"","cat":"Обязанности водителя","fine":"штраф до $5.000"},{"art":"4","part":"ст.","title":"Поведение при аварии","desc":"При аварии, водитель обязан остановиться и не трогаться с места. Также водитель не должен трогать и перемещать предметы связанные с происшествием.","note":"","cat":"Обязанности водителя","fine":"штраф до $10.000"},{"art":"5","part":"ст.","title":"Авария с пострадавшими","desc":"При аварии в которой погибли или ранены люди, водитель обязан оказать первую помощь и вызвать скорую помощь EMS.","note":"","cat":"Обязанности водителя","fine":"штраф до $20.000"},{"art":"6","part":"ст.","title":"Передача управления лицу без права вождения","desc":"Владельцу транспортного средства запрещено передавать управление лицам, не имеющим право на вождение автомобиля (лицу без лицензии, под алкогольным или наркотическим опьянении, находящемуся в утомленном состоянии).","note":"","cat":"Обязанности водителя","fine":"штраф до $10.000 для владельца Т/С и управляющего транспортным средством"},{"art":"7","part":"ст.","title":"Колонны и кортежи","desc":"Водителю запрещено пересекать и занимать место в организованных колоннах или кортежах.","note":"","cat":"Обязанности водителя","fine":"штраф до $20.000"},{"art":"8","part":"ст.","title":"Телефон за рулём","desc":"Водителю запрещается пользоваться во время движения телефоном.","note":"","cat":"Обязанности водителя","fine":"штраф до $5.000"},{"art":"9","part":"ст.","title":"Безрассудное вождение","desc":"Водителю запрещено совершать безрассудное вождение, которое выражается в:\nа) невыполнение требования уступить дорогу во время перестроения (подрезание);\nб) несоблюдении безопасной дистанции;\nв) резком торможении, если такое торможение не требуется для предотвращения аварии;\nг) препятствовании обгону;\nд) целенаправленном нарушении нескольких положений Дорожного Кодекса подряд.","note":"","cat":"Обязанности водителя","fine":"штраф до $10.000"},{"art":"10","part":"ст.","title":"Вождение без лицензии нужной категории","desc":"Запрещено управление транспортным средством лицом, не обладающим лицензией на вождение с категорией, соответствующей транспортному средству.","note":"Примечание: в штате San-Andreas действуют следующие категории лицензии на вождение — CDL: A (седельные тягачи), CDL: B (грузовики и пикапы), Drive: D (легковой транспорт), Drive: M (мотоциклы, квадроциклы и карты).","cat":"Обязанности водителя","fine":"штраф до $10.000"},{"art":"11","part":"ст.","title":"Спецсигналы: отступление от разметки и знаков","desc":"Сотрудники государственных структур при управлении транспортным средством со спецсигналами могут отступать от требований дорожной разметки и знаков, при условии обеспечения безопасности движения и нанесении минимального урона окружению.","note":"","cat":"Спецсигналы","fine":"штраф до $15.000 с сотрудника, не обеспечившего условия безопасности движения и нанесший максимальный, неоправданный урон при использовании спец. сигналов"},{"art":"12","part":"ст.","title":"Спецсигналы: приоритет при включённой сирене","desc":"Водители транспортного средства со спецсигналами с включенной сиреной имеют приоритет перед другими участниками дорожного движения, при условии обеспечения безопасности движения и нанесении минимального урона окружению.","note":"","cat":"Спецсигналы","fine":"штраф до $13.000 с сотрудника, не обеспечившего условия безопасности движения и нанесший максимальный, неоправданный урон при использовании спец. сигналов"},{"art":"13","part":"ст.","title":"Уступить дорогу спецтранспорту","desc":"При приближении транспортного средства с включенными проблесковым маячком синего или красного цвета и сиреной водители обязаны уступить дорогу для обеспечения беспрепятственного проезда указанного транспортного средства.","note":"","cat":"Спецсигналы","fine":"штраф до $7.000"},{"art":"14","part":"ст.","title":"Приоритет EMS среди спецтранспорта","desc":"Если два или более спец. транспорта с включенными проблесковыми маячками встретились на дороге, приоритет имеет транспорт медицинских служб скорой помощи EMS с включенным проблесковым маячком и включенной сиреной.","note":"","cat":"Спецсигналы","fine":"штраф до $10.000 с водителя спец. транспорта не пропустившего автомобиль скорой помощи EMS"},{"art":"15","part":"ст.","title":"Приближение к стоящему спецтранспорту","desc":"Приближаясь к стоящему транспортному средству с включенным проблесковым маячком синего или красного цвета, водитель должен снизить скорость, чтобы иметь возможность немедленно остановиться в случае необходимости.","note":"","cat":"Спецсигналы","fine":"штраф до $7.000"},{"art":"16","part":"ст.","title":"Пешеходы на проезжей части","desc":"Пешеходы должны двигаться по тротуару или обочине. Движение по проезжей части пешеходами запрещено.","note":"Исключение: В районе, прилегающем к территории EMS, сотрудники правоохранительных органов обязаны:\nа) В случае обнаружения пешехода, находящегося на проезжей части, сначала устно предупредить гражданина о необходимости покинуть проезжую часть и направиться на тротуар или обочину.\nб) Предоставить гражданину разумное время для выполнения данного требования.\nв) Если гражданин после предупреждения продолжает нарушать правила и находиться на проезжей части, сотрудники имеют право наложить штраф в размере, установленном статьей 16.","cat":"Пешеходы","fine":"штраф до $7.000"},{"art":"17","part":"ст.","title":"Пешеходы и спецтранспорт","desc":"При приближении транспортных средств с включенным проблесковым маячком синего или красного цвета пешеходы обязаны воздержаться от перехода дороги, а пешеходы, находящиеся на проезжей части, должны незамедлительно освободить проезжую часть.","note":"","cat":"Пешеходы","fine":"штраф до $8.000"},{"art":"18","part":"ст.","title":"Выезд с прилегающей территории","desc":"При выезде на дорогу с прилегающей территории водитель должен уступить дорогу транспортным средствам и пешеходам, движущимся по ней, а при съезде с дороги - пешеходам и велосипедистам, путь движения которых он пересекает.","note":"","cat":"Маневрирование","fine":"штраф до $8.000"},{"art":"19","part":"ст.","title":"Перестроение","desc":"При перестроении водитель должен уступить дорогу транспортным средствам, движущимся попутно без изменения направления движения.","note":"","cat":"Маневрирование","fine":"штраф до $8.000"},{"art":"20","part":"ст.","title":"Помехи военно-транспортной колонне","desc":"Запрещается создавать помехи движению военно-транспортной колонны.","note":"","cat":"Маневрирование","fine":"штраф в размере до 20.000$ с лишением прав на управление соответствующим транспортным средством (в зависимости от типа транспортного средства, на котором совершено нарушение, в том числе: CDL B класс - Грузовой, CLD A класс - Тяжёлый транспорт, CLD M класc - На мотоцикл, CLD D класс - управление легковым автомобилем)"},{"art":"21","part":"ст.","title":"Положение на дороге перед поворотом","desc":"Перед поворотом направо водитель должен заранее занять крайнее правое положение. Перед поворотом налево или разворотом водитель должен заранее занять крайнее левое положение. Также поворот может быть произведен не с крайней полосы, если имеется соответствующая разметка.","note":"","cat":"Маневрирование","fine":"штраф до $4.000"},{"art":"22","part":"ст.","title":"Разворот и левый поворот вне перекрёстка","desc":"При развороте или повороте налево вне перекрестка, водитель должен пропустить встречные транспортные средства.","note":"","cat":"Маневрирование","fine":"штраф до $6.000"},{"art":"23","part":"ст.","title":"Нерегулируемые перекрёстки","desc":"На нерегулируемых перекрестках, дорогу должен уступить водитель, к которому, транспортное средство приближается справа.","note":"","cat":"Маневрирование","fine":"штраф до $5.000"},{"art":"24","part":"ст.","title":"Запреты на разворот","desc":"Разворот запрещается:\nа) На пешеходных переходах;\nб) В тоннелях;\nв) На мостах;\nг) На железнодорожных переездах;\nд) В местах с видимостью менее 100 метров.","note":"","cat":"Маневрирование","fine":"штраф до $8.000"},{"art":"25","part":"ст.","title":"Правостороннее движение","desc":"Движение в штате является правосторонним. Транспортное средство должно двигаться по правой стороне дороги, если нет разметки.","note":"","cat":"Расположение на дороге","fine":"штраф до $8.000"},{"art":"26","part":"ст.","title":"Выезд на встречную полосу","desc":"На дорогах с двусторонним движением запрещается двигаться по полосе встречного движения.","note":"","cat":"Расположение на дороге","fine":"штраф до $
