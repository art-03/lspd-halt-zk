 иные переговоры (в том числе сообщения) подозреваемого, обвиняемого и других лиц могут содержать сведения, имеющие значение для уголовного дела, их контроль и запись допускаются при производстве по уголовным делам.\nч. 2. Контроль и запись переговоров допускается только на основании судебного решения.","note":"","cat":"Следствие"},{"art":"57","part":"ст.","title":"Допрос","desc":"ч. 1. Свидетель, потерпевший, обвиняемый, подозреваемый вызывается на допрос повесткой, в которой указываются, кто и в каком качестве вызывается, к кому и по какому адресу, дата и время явки на допрос, а также последствия неявки без уважительных причин или может быть подвергнут процедуре допроса в ходе задержания.\nч. 2. Повестка вручается лицу, вызываемому на допрос, под расписку либо передается с помощью электронных средств связи. В случае временного отсутствия лица, вызываемого на допрос, повестка вручается совершеннолетнему члену его семьи либо передается руководителю по месту его работы или по поручению следователя или прокурора иным лицам и организациям, которые обязаны передать повестку лицу, вызываемому на допрос.\nч. 3. Лицо, вызываемое на допрос, обязано явиться в назначенный срок либо заранее уведомить следователя или прокурора о причинах неявки. В случае неявки без уважительных причин лицо, вызываемое на допрос, может быть подвергнуто приводу либо к нему могут быть применены иные меры процессуального принуждения.\nч. 4. Следователь и/или прокурор, привлекая к участию в допросе истца, заявителя, свидетеля, потерпевшего, подозреваемого, обвиняемого, представителя таких лиц, удостоверяется в их личности, разъясняет им права, ответственность, а также порядок производства соответствующего следственного действия. Если в производстве следственного действия участвует специалист, эксперт или переводчик, то он также предупреждается об ответственности, предусмотренной законодательством.\nч. 5. Должностное лицо, осуществляющее допрос, обязано уведомить допрашиваемое лицо о месте и времени проведения допроса, но не позднее 12-ти часов до его проведения.\nПримечание: Допрос может быть произведен с отступлением обязательных временных рамок от настоящей части при обоюдном согласии сторон (должностного лица, осуществляющего допрос, допрашиваемого лица).\nч. 6. Если допрашиваемое лицо явилось на допрос с адвокатом, приглашенным им для оказания юридической помощи, то адвокат присутствует при допросе и пользуется правами, предусмотренными. По окончании допроса адвокат вправе делать заявления о нарушениях прав и законных интересов клиента.\nч. 7. Следователь или прокурор, в ходе допроса обязаны обеспечить проведение аудио- и (или) видеозаписи, материалы которых хранятся при уголовном деле.\nч. 8. Допрос не может длится более 1 часа. Допрос проводимый по повестке, также не может проводиться в ночное время.","note":"","cat":"Следствие"},{"art":"58","part":"ст.","title":"Очная ставка","desc":"ч. 1. Если в показаниях ранее допрошенных лиц имеются существенные противоречия, то прокурор или следователь вправе провести очную ставку.\nч. 2. Прокурор или следователь выясняет у лиц, между которыми проводится очная ставка, знают ли они друг друга и в каких отношениях находятся между собой. Допрашиваемым лицам поочередно предлагается дать показания по тем обстоятельствам, для выяснения которых проводится очная ставка. После дачи показаний прокурор или следователь может задавать вопросы каждому из допрашиваемых лиц. Лица, между которыми проводится очная ставка, могут с разрешения прокурора или следователя задавать вопросы друг другу.\nч. 3. В ходе очной ставки следователь или прокурор вправе предъявить вещественные доказательства и документы.\nч. 4. Во время производства очной ставки должен проводится аудио и (или) видео протокол.","note":"","cat":"Следствие"},{"art":"59","part":"ст.","title":"Предъявление для опознания","desc":"ч. 1. Следователь может предъявить для опознания лицо или предмет свидетелю, потерпевшему, подозреваемому или обвиняемому.\nч. 2. Опознающие предварительно допрашиваются об обстоятельствах, при которых они видели предъявленные для опознания лицо или предмет, а также о приметах и особенностях, по которым они могут его опознать.\nч. 3. Не может проводиться повторное опознание лица или предмета тем же опознающим и по тем же признакам.\nч. 4. Лицо предъявляется для опознания вместе с другими лицами, по возможности внешне сходными с ним. Общее число лиц, предъявляемых для опознания, должно быть не менее трех. Перед началом опознания опознаваемому предлагается занять любое место среди предъявляемых лиц, о чем в протоколе опознания делается соответствующая запись.\nч. 5. При невозможности предъявления лица опознание может быть проведено по его фотографии, предъявляемой одновременно с фотографиями других лиц, внешне сходных с опознаваемым лицом. Количество фотографий должно быть не менее трех.\nч. 6. Предмет предъявляется для опознания в группе однородных предметов в количестве не менее трех. При невозможности предъявления предмета его опознание проводится в порядке, установленном\nч. 5 настоящей статьи.\nч. 7. Если опознающий указал на одно из предъявленных ему лиц или один из предметов, то опознающему предлагается объяснить, по каким приметам или особенностям он опознал данные лицо или предмет. Наводящие вопросы недопустимы.\nч. 8. В целях обеспечения безопасности опознающего предъявление лица для опознания по решению следователя может быть проведено в условиях, исключающих визуальное наблюдение опознающего опознаваемым. В этом случае понятые находятся в месте нахождения опознающего.\nч. 9. Опознание лица также производится следователем на основе имеющихся фотоматериалов в совокупности с документами гражданина.","note":"","cat":"Следствие"},{"art":"60","part":"ст.","title":"Проверка показаний на месте","desc":"ч. 1. В целях установления новых обстоятельств, имеющих значение для дела, показания, ранее данные подозреваемым или обвиняемым, а также потерпевшим или свидетелем, могут быть проверены или уточнены на месте, связанном с исследуемым событием.\nч. 2. Проверка показаний на месте заключается в том, что ранее допрошенное лицо воспроизводит на месте обстановку и обстоятельства исследуемого события, указывает на предметы, документы, следы, имеющие значение для дела, демонстрирует определенные действия. Какое-либо постороннее вмешательство в ход проверки и наводящие вопросы недопустимы.\nч. 3. Не допускается одновременная проверка на месте показаний нескольких лиц.\nч. 4. Проверка показаний начинается с предложения лицу указать место, где его показания будут проверяться. Лицу, показания которого проверяются, после свободного рассказа и демонстрации действий могут быть заданы вопросы.","note":"","cat":"Следствие"},{"art":"61","part":"ст.","title":"Освидетельствование","desc":"ч. 1. Для обнаружения на теле человека особых примет, следов правонарушения, телесных повреждений, выявления признаков состояния опьянения, дезориентации, острого расстройства поведения либо иных внешне наблюдаемых состояний, имеющих значение для дела, если для этого не требуется производство судебной экспертизы, может быть произведено освидетельствование подозреваемого, обвиняемого, потерпевшего, а также свидетеля с его согласия, за исключением случаев, когда освидетельствование необходимо для оценки достоверности его показаний.\nч. 2. Решение о производстве освидетельствования принимается следователем, прокурором либо сотрудником правоохранительного органа, осуществляющим задержание, предварительное следствие, следствие или иное процессуальное действие в пределах своей компетенции. Адвокат вправе заявить о необходимости проведения освидетельствования в интересах доверителя.\nч. 3. Процессуальную организацию освидетельствования обеспечивает уполномоченный государственный служащий, в производстве которого находится задержание, предварительное следствие, следствие или иное процессуальное действие, включая вызов специалиста, обеспечение допуска, безопасности, соблюдение режима территории, фиксацию факта вызова, времени ожидания, прибытия и результата освидетельствования.\nч. 4. Если необходимость проведения освидетельствования заявлена адвокатом, уполномоченный государственный служащий обязан рассмотреть такое заявление и при наличии оснований обеспечить вызов специалиста и организацию освидетельствования в порядке, предусмотренном настоящей статьей.\nч. 5. Отказ в вызове специалиста по заявлению адвоката допускается только при отсутствии оснований для освидетельствования либо если заявленное освидетельствование явно не относится к обстоятельствам, имеющим значение для процессуального действия.\nч. 6. Освидетельствование, требующее специальных медицинских, психиатрических или иных знаний, производится сотрудником EMS в пределах его квалификации. Уполномоченное лицо, организующее освидетельствование, не вправе вмешиваться в медицинскую или иную специальную оценку специалиста.\nч. 7. Сотрудник EMS при проведении медицинского, психиатрического или иного освидетельствования отвечает исключительно за специальную оценку состояния лица в пределах своей квалификации, законодательства, клинических протоколов и внутренних регламентов EMS. Сотрудник EMS не определяет виновность лица, не квалифицирует правонарушение, не принимает решения о задержании, аресте, освобождении, наказании или допустимости доказательств.\nч. 8. По результатам освидетельствования сотрудник его проводящий вправе дать устное заключение непосредственно на месте проведения освидетельствования.\nч. 9. При освидетельствовании лица другого пола уполномоченное лицо не присутствует, если освидетельствование сопровождается обнажением данного лица. В этом случае освидетельствование производится врачом либо иным уполномоченным медицинским специалистом.\nч. 10. Сотрудник EMS либо иной специалист вправе отказаться от проведения освидетельствования либо приостановить его, если проведение процедуры небезопасно, лицо препятствует ее проведению, отсутствуют условия для корректного проведения освидетельствования, либо запрашиваемое действие выходит за пределы квалификации или компетенции специалиста.","note":"","cat":"Следствие"},{"art":"62","part":"ст.","title":"Задержание","desc":"ч. 1. Основания и порядок задержания, а также основания освобождения подозреваемого установлены в главе 4 Настоящего Кодекса.","note":"","cat":"Следствие"},{"art":"63","part":"ст.","title":"Оперативно-розыскные мероприятия","desc":"ч. 1. Оперативно-розыскные мероприятия регулируются отдельным законом “Об оперативно-розыскной деятельности”.","note":"","cat":"Следствие"},{"art":"64","part":"ст.","title":"Возбуждение дела","desc":"ч. 1. Возбуждение дела и производство по нему регулируются гл. 17 настоящего кодекса.\nч. 2. Порядок производства следственных действий в отношении лиц, имеющих статус неприкосновенности, осуществляется с учетом закона \"Об обеспечении неприкосновенности государственных служащих\".","note":"","cat":"Следствие"},{"art":"65","part":"ст.","title":"Окончание следствия","desc":"ч. 1 По окончании следствия сотрудник правоохранительных органов или иное уполномоченное лицо выносит решение:\n1) о прекращении дела - по основаниям, предусмотренным статьей ст. 73 настоящего Кодекса, а равно о признании лица не виновным в совершении правонарушения;\n2) о признании лица виновным в совершении правонарушения.\n3) о возвращении дела для производства дополнительного следствия, изменения объема обвинения либо квалификации действий обвиняемых или пересоставления обвинительного заключения и устранения выявленных недостатков со своими письменными указаниями. Задержанный подлежит освобождению. ГЛАВА XVI. Уголовное производство и Уголовное преследование.","note":"","cat":"Следствие"},{"art":"66","part":"ст.","title":"Назначение уголовного производства","desc":"ч. 1 Уголовное производство имеет своим назначением:\n1) защиту прав и законных интересов лиц и организаций, потерпевших от преступлений;\n2) защиту личности от незаконного и необоснованного обвинения, осуждения, ограничения ее прав и свобод.\n3) Уголовное преследование и назначение виновным справедливого наказания в той же мере отвечают назначению уголовного производства, что и отказ от уголовного преследования невиновных, освобождение их от наказания, реабилитация каждого, кто необоснованно подвергся уголовному преследованию.","note":"","cat":"Следствие"},{"art":"67","part":"ст.","title":"Назначение наказания в рамках уголовного дела","desc":"ч. 1. Наказания по уголовному делу в штате San-Andreas осуществляется уполномоченными государственными служащими, а также судом.\nч. 2. Никто не может быть признан виновным в совершении преступления и подвергнут уголовному наказанию иначе как в порядке, установленном действующим законодательством.\nч. 3. Лицо, которому было назначено наказание за совершенное преступление, не может быть лишено права на рассмотрение его уголовного дела в судебных органах и в праве обжаловать решения лиц, назначивших ему лицу наказание.","note":"","cat":"Следствие"},{"art":"68","part":"ст.","title":"Независимость судей","desc":"ч. 1. При осуществлении правосудия по уголовным делам судьи независимы и подчиняются только Конституции и законам штата San-Andreas.\nч. 2. Судьи рассматривают и разрешают уголовные дела в условиях, исключающих противоправное воздействие на них. Вмешательство государственных органов, органов местного самоуправления, иных органов, организаций, должностных лиц или граждан в деятельность судей по осуществлению правосудия запрещается и влечет за собой установленную законом ответственность.\nч. 3. Информация о внепроцессуальных обращениях государственных органов, органов местного самоуправления, иных органов, организаций, должностных лиц или граждан, поступивших судьям по уголовным делам, находящимся в их производстве, подлежит преданию гласности и доведению до сведения участников судебного разбирательства путем размещения данной информации и не является основанием для проведения процессуальных действий или принятия процессуальных решений по уголовным делам.","note":"","cat":"Уголовное производство"},{"art":"69","part":"ст.","title":"Состязательность сторон","desc":"ч. 1. Уголовное судопроизводство осуществляется на основе состязательности сторон.\nч. 2. Суд не является органом уголовного преследования, не выступает на стороне обвинения или стороне защиты. Суд создает необходимые условия для исполнения сторонами их процессуальных обязанностей и осуществления предоставленных им прав.\nч. 3. Стороны обвинения и защиты равноправны перед судом.","note":"","cat":"Уголовное производство"},{"art":"70","part":"ст.","title":"Обязанность осуществления уголовного преследования","desc":"ч. 1. Уголовное преследование от имени государства по уголовным делам публичного и частно-публичного обвинения осуществляют прокурор, а также следователь.\nПримечание: Прокурор осуществляя расследования по уголовным делам, в порядке предусмотренном настоящим кодексом, осуществляет функции следователя\nч. 2. В каждом случае обнаружения признаков преступления прокурор и следователь принимают предусмотренные настоящим Кодексом меры по установлению события преступления, изобличению лица или лиц, виновных в совершении преступления\nч. 3. Следователь, а также прокурор в случаях, предусмотренных\nч. 4 ст. 75 настоящего кодекса, вправе осуществлять уголовное преследование по уголовным делам независимо от волеизъявления потерпевшего.\nч. 4. Требования, поручения и запросы прокурора и/или следователя, предъявленные в рамках уголовного преследования и в пределах их компетенции, обязательны для исполнения всеми учреждениями, предприятиями, организациями, должностными лицами и гражданами.","note":"","cat":"Уголовное производство"},{"art":"71","part":"ст.","title":"Право потерпевшего на участие в уголовном преследовании","desc":"ч. 1. Потерпевший и представитель вправе участвовать в уголовном преследовании обвиняемого.","note":"","cat":"Уголовное производство"},{"art":"72","part":"ст.","title":"Поводы и основание для возбуждения дела","desc":"ч. 1. Поводами для возбуждения дела служат:\n1) заявление о правонарушении;\n2) явка с повинной;\n3) сообщение о совершенном или готовящемся правонарушении, полученное из иных источников;\n4) непосредственное обнаружение должностными лицами, уполномоченными для проведения проверки и расследования, данных, указывающих на наличие события правонарушения.\nч. 2. Основанием для возбуждения дела является наличие достаточных данных, указывающих на признаки правонарушения.\nч. 3. Сотрудники правоохранительных органов обязаны принять, проверить сообщение либо собственную информацию, полученную в ходе осуществления своей служебной деятельности, о любом совершенном, совершаемом или готовящемся правонарушении. При проверке вышеуказанные сотрудники вправе получать объяснения, образцы для сравнительного исследования, истребовать документы, вещественные доказательства и предметы, изымать их в порядке, установленном настоящим Кодексом, назначать судебную экспертизу, принимать участие в ее производстве и получать заключение эксперта в разумный срок, производить осмотр места происшествия, документов, предметов, трупов, освидетельствование, требовать производства документальных проверок, ревизий, исследований документов, предметов, трупов, привлекать к участию в этих действиях специалистов, давать правоохранительным органам обязательное для исполнения письменное поручение о проведении оперативно-розыскных мероприятий.\nч. 4. Дело считается возбужденным с момента:\n1) фиксации правонарушения сотрудником силовых государственных структур или правоохранительных органов, в том числе сотрудником прокуратуры;\n2) вынесения постановления о возбуждении дела.\nч. 4.1. При ведении дела с письменной отчетностью в порядке ст. 50 настоящего Кодекса, его возбуждение производится в соответствии с п. 2\nч. 4 настоящей статьи.\nч. 5. Принятие и проверка сообщений либо информации о любом совершенном, совершаемом или готовящемся правонарушении производится как до возбуждения дела, так и в рамках возбужденного дела, в зависимости от отсутствия либо наличия признаков состава правонарушения соответственно.","note":"","cat":"Уголовное производство"},{"art":"73","part":"ст.","title":"Основания отказа в возбуждении дела или прекращения дела","desc":"ч. 1. Дело не может быть возбуждено, а возбужденное дело подлежит прекращению по следующим основаниям:\n1) отсутствие события правонарушения;\n2) отсутствие в деянии состава правонарушения;\n3) истечение сроков давности уголовного или административного преследования;\n4) отсутствие заявления потерпевшего, если дело может быть возбуждено не иначе как по его заявлению;\nч. 2. Дело подлежит прекращению по основанию, предусмотренному пунктом 2 части первой настоящей статьи, в случае, когда до вступления приговора в законную силу противоправность и наказуемость этого деяния были устранены новым законом.\nч. 3. Прекращение дела влечет за собой одновременно прекращение уголовного или административного преследования.","note":"","cat":"Уголовное производство"},{"art":"74","part":"ст.","title":"Решения, принимаемые по результатам рассмотрения (проверки)","desc":"Сообщения либо собственной информации, полученной в ходе осуществления служебной деятельности, о правонарушении\nч. 1. По результатам рассмотрения (проверки) сообщения либо собственной информации, полученной в ходе осуществления служебной деятельности, о любом совершенном, совершаемом или готовящемся правонарушении сотрудник правоохранительных органов или иное уполномоченное лицо принимает одно из следующих решений:\n1) о возбуждении дела при наличии поводов и оснований, предусмотренных ст. 72 настоящего Кодекса;\n2) об отказе в возбуждении дела по основаниям, предусмотренным ст. 73 настоящего Кодекса;\n3) о передаче сообщения или иных данных по подследственности в порядке, предусмотренном законодательством.\nч. 2. О принятом решении в кратчайшие сроки (не более 24-х часов) сотрудник правоохранительных органов сообщает заявителю. При этом заявителю разъясняются его право обжаловать данное решение и порядок обжалования.","note":"","cat":"Уголовное производство"},{"art":"75","part":"ст.","title":"Виды уголовного преследования","desc":"ч. 1. В зависимости от характера и тяжести совершенного преступления уголовное преследование, включая обвинение в суде, осуществляется в публичном, частно-публичном и частном порядке.\nч. 2. Уголовные дела о преступлениях, предусмотренных статьей 6.6 Уголовного кодекса штата San-Andreas, считаются уголовными делами частного обвинения, возбуждаются не иначе как по заявлению потерпевшего, его законного представителя, за исключением случаев, преду смотренных частью четвертой настоящей статьи, и подлежат прекращению в связи с примирением потерпевшего с обвиняемым. Примирение сторон допускается до направления уголовного дела в суд.\nч. 3. Уголовные дела частно-публичного обвинения возбуждаются не иначе как по заявлению потерпевшего или его законного представителя, но прекращению в связи с примирением потерпевшего с обвиняемым не подлежат. К уголовным делам частно-публичного обвинения относятся уголовные дела о преступлениях, предусмотренных ст. ст. 6.1\nч.1 8.1\nч. 1, 8.2, 8.3, 10.1\nч. 1, 10.2, 10.2.1, 10.3, 10.5, 10.6, 10.7 Уголовного кодекса штата San-Andreas.\nч. 4. Следователь, прокурор возбуждают уголовное дело о любом преступлении, указанном в частях второй и третьей настоящей статьи, в том числе при отсутствии заявления потерпевшего или его законного представителя, если данное преступление совершено в отношении лица, которое в силу зависимого или беспомощного состояния либо по иным причинам не может защищать свои права и законные интересы. К иным причинам относится также случай совершения преступления лицом, данные о котором не известны.\nч. 5. Уголовные дела, за исключением уголовных дел, указанных в частях второй и третьей настоящей статьи, считаются уголовными делами публичного обвинения. Статья. 76 Обвинительное заключение\nч. 1. В обвинительном заключении следователь указывает:\nа) фамилии, имена обвиняемого или обвиняемых;\nб) данные о личности каждого из них;\nв) существо обвинения, место и время совершения преступления, его способы, мотивы, цели, последствия и другие обстоятельства, имеющие значение для данного уголовного дела;\nг) формулировку предъявленного обвинения с указанием пункта, части, статьи Уголовного кодекса штата San-Andreas, предусматривающих ответственность за данное преступление;\nд) перечень доказательств, подтверждающих обвинение, и краткое изложение их содержания;\nе) обстоятельства, смягчающие и отягчающие наказание;\nл) данные о потерпевшем, характере и размере вреда, причиненного ему преступлением;\nч. 2. Обвинительное заключение подписывается следователем с указанием места и даты его составления.\nч. 3. К обвинительному заключению прилагается список подлежащих вызову в судебное заседание лиц со стороны обвинения с указанием их места жительства.\nч. 4. После подписания следователем обвинительного заключения уголовное дело немедленно направляется Генеральному Прокурору штата San-Andreas или его заместителям или старшим прокурором.","note":"","cat":"Уголовное производство"},{"art":"77","part":"ст.","title":"Решение прокурора по уголовному делу","desc":"ч. 1 Генеральный Прокурор и(или) его заместители или старшие прокуроры рассматривают поступившее от следователя, прокурора уголовное дело с обвинительным заключением и в течение суток принимает по нему одно из следующих решений:\nа) об утверждении обвинительного заключения и о направлении уголовного дела в суд;\nб) о возвращении уголовного дела следователю для производства дополнительного следствия, изменения объема обвинения либо квалификации действий обвиняемых или пересоставления обвинительного заключения и устранения выявленных недостатков со своими письменными указаниями;\nв) об утверждении обвинительного заключения и авторизации ордера на арест.\nч. 2 В случае сложности или большого объема уголовного дела срок, установленный\nч. 1 настоящей статьи, может быть продлен до 3 суток.\nч. 3 В случае, предусмотренного пунктом б части первой, настоящей статьи, прокурор рассматривающий уголовное дело выносит мотивированное постановление. Глава XVII. Направление уголовного дела в суд.","note":"","cat":"Уголовное производство"},{"art":"78","part":"ст.","title":"Направление уголовного дела в суд","desc":"ч. 1. После утверждения обвинительного заключения, если не авторизован ордер на арест, прокурор направляет уголовное дело в суд, о чем уведомляет обвиняемого, его защитника, потерпевшего, и (или) представителей.\nч. 2. Копия обвинительного заключения с приложениями вручается прокурором обвиняемому. Копии обвинительного заключения вручаются также защитнику и потерпевшему, если они ходатайствуют об этом.","note":"","cat":"Уголовное производство"},{"art":"78.1","part":"ст.","title":"Обстоятельства, исключающие участие в производстве по уголовному делу","desc":"ч. 1. Прокурор, следователь не может участвовать в производстве по уголовному делу, если он:\n1) является потерпевшим по делам частного и частно-публичного обвинения, гражданским истцом, гражданским ответчиком по данному уголовному делу;\n2) участвовал в качестве присяжного заседателя, эксперта, специалиста, переводчика, понятого, помощника судьи, секретаря судебного заседания, защитника, законного представителя подозреваемого, обвиняемого, представителя потерпевшего, гражданского истца или гражданского ответчика;\n3) является близким родственником или родственником любого из участников производства по данному уголовному делу.\nч. 2. Лица, указанные в части первой настоящей статьи, не могут участвовать в производстве по уголовному делу также в случаях, если имеются иные обстоятельства, дающие основание полагать, что они лично, прямо или косвенно, заинтересованы в исходе данного уголовного дела.\nч. 3. Наличие информации о внепроцессуальном обращении, поступившем прокурору или следователю по уголовному делу, находящемуся в его производстве, само по себе не может рассматриваться в качестве основания для отвода.","note":"","cat":"Уголовное производство"},{"art":"78.2","part":"ст.","title":"Недопустимость участия в производстве по уголовному делу лиц, подлежащих отводу","desc":"ч. 1. При наличии оснований для отвода, предусмотренных настоящей главой, прокурор, следователь обязаны устраниться от участия в производстве по уголовному делу.\nч. 2. В случае, если лица, указанные в части первой настоящей статьи, не устранились от участия в производстве по уголовному делу, отвод им может быть заявлен подозреваемым, обвиняемым, его законным представителем, защитником, а также государственным обвинителем, потерпевшим, гражданским истцом, гражданским ответчиком или их представителями.\nч. 3. В случае отказа в удовлетворении заявления об отводе подача повторного заявления об отводе тем же лицом и по тем же основаниям не допускается.\nч. 4. Решение об отказе в удовлетворении заявления об отводе, принятое в ходе досудебного производства по уголовному делу, не является препятствием для последующей подачи заявления об отводе тем же лицом в отношении того же лица и по тем же основаниям в ходе судебного производства по уголовному делу.\nч. 5. Вопрос об отводе следователя, прокурора разрешается ими же немедленно после поступления соответствующего заявления. В случае несогласия сторон с решением об отказе в удовлетворении отвода, заявитель вправе обратиться с жалобой в суд либо в Офис Генерального Прокурора для проверки законности и обоснованности принятого решения. Глава XVIII. Досудебное соглашение о сотрудничестве.","note":"","cat":"Уголовное производство"},{"art":"79","part":"ст.","title":"Досудебное соглашение о сотрудничестве","desc":"ч. 1. Досудебное соглашение о сотрудничестве — соглашение между стороной обвинения и подозреваемым либо обвиняемым, в соответствии с которым указанное лицо принимает обязательство содействовать раскрытию и расследованию преступления.\nч. 2. Содействие может выражаться в:\nа) даче правдивых показаний;\nб) изобличении соучастников преступления;\nв) сообщении сведений, имеющих значение для уголовного дела;\nг) содействии розыску имущества, добытого преступным путём.\nч. 3. Досудебное соглашение заключается в письменной форме и приобщается к материалам уголовного дела.","note":"","cat":"Досудебное соглашение"},{"art":"80","part":"ст.","title":"Условия заключения досудебного соглашения","desc":"ч. 1. Досудебное соглашение заключается при наличии одновременно следующих условий:\nа) добровольного волеизъявления подозреваемого либо обвиняемого;\nб) согласия лица с предъявленным обвинением полностью либо частично;\nв) готовности лица оказать содействие следствию;\nг) наличия сведений, имеющих значение для уголовного дела.\nч. 2. Заключение соглашения не допускается:\nа) при отсутствии фактической возможности оказания содействия;\nб) если заключение соглашения противоречит задачам уголовного судопроизводства;\nв) если соглашение направлено исключительно на формальное снижение ответственности без фактического содействия расследованию.","note":"","cat":"Досудебное соглашение"},{"art":"81","part":"ст.","title":"Ходатайство о заключении досудебного соглашения","desc":"ч. 1. Подозреваемый либо обвиняемый вправе заявить ходатайство о заключении досудебного соглашения.\nч. 2. Ходатайство подается прокурору в письменной форме.\nч. 3. Ходатайство приобщается к материалам уголовного дела.\nч. 4. Ходатайство подается с обязательным участием защитника.","note":"","cat":"Досудебное соглашение"},{"art":"82","part":"ст.","title":"Рассмотрение ходатайства прокурором","desc":"ч. 1. Прокурор рассматривает ходатайство и принимает одно из следующих решений:\nа) о заключении соглашения;\nб) об отказе в заключении соглашения.\nч. 2. Решение оформляется постановлением прокурора.\nч. 3. Постановление приобщается к материалам уголовного дела.","note":"","cat":"Досудебное соглашение"},{"art":"83","part":"ст.","title":"Содержание досудебного соглашения","desc":"ч. 1. В досудебном соглашении указываются:\nа) сведения о сторонах соглашения;\nб) существо подозрения либо обвинения;\nв) обязательства подозреваемого либо обвиняемого;\nг) обязательства стороны обвинения;\nд) порядок исполнения соглашения;\nе) сроки исполнения соглашения;\nж) последствия неисполнения соглашения.","note":"","cat":"Досудебное соглашение"},{"art":"84","part":"ст.","title":"Обязательства подозреваемого либо обвиняемого","desc":"ч. 1. Подозреваемый либо обвиняемый обязан:\nа) давать правдивые показания;\nб) способствовать раскрытию преступления;\nв) содействовать изобличению соучастников преступления;\nг) предоставлять имеющиеся доказательства и сведения.","note":"","cat":"Досудебное соглашение"},{"art":"85","part":"ст.","title":"Обязательства стороны обвинения","desc":"ч. 1. При выполнении условий соглашения прокурор:\nа) учитывает содействие лица при формировании обвинения;\nб) вправе ходатайствовать перед судом о назначении более мягкого наказания;\nв) вправе учитывать исполнение соглашения при вынесении процессуального ордера;\nг) отражает факт заключения соглашения в обвинительном заключении либо процессуальном ордере.","note":"","cat":"Досудебное соглашение"},{"art":"86","part":"ст.","title":"Гарантии прав подозреваемого либо обвиняемого","desc":"ч. 1. Досудебное соглашение заключается с обязательным участием защитника.\nч. 2. Подозреваемому либо обвиняемому разъясняются правовые последствия заключения соглашения.\nч. 3. Подозреваемый либо обвиняемый вправе отказаться от заключения соглашения до момента его подписания сторонами.","note":"","cat":"Досудебное соглашение"},{"art":"87","part":"ст.","title":"Проверка исполнения соглашения","desc":"ч. 1. Контроль исполнения условий соглашения осуществляется прокурором.\nч. 2. Результаты исполнения соглашения отражаются в материалах уголовного дела.","note":"","cat":"Досудебное соглашение"},{"art":"88","part":"ст.","title":"Последствия исполнения соглашения","desc":"ч. 1. В случае исполнения условий досудебного соглашения суд либо прокурор учитывает содействие подозреваемого либо обвиняемого при принятии процессуального решения по уголовному делу.\nч. 2. Содействие расследованию преступления признаётся обстоятельством, смягчающим наказание.\nч. 3. Прокурор при вынесении процессуального ордера вправе:\nа) ходатайствовать о назначении более мягкого наказания;\nб) изменить объём обвинения в пределах фактических обстоятельств дела;\nв) отказаться от поддержания части обвинения при наличии достаточных оснований;\nг) указать исполнение соглашения как основание применения смягчающих процессуальных последствий.","note":"","cat":"Досудебное соглашение"},{"art":"89","part":"ст.","title":"Последствия неисполнения соглашения","desc":"ч. 1. В случае неисполнения либо ненадлежащего исполнения условий соглашения прокурор вправе принять решение о прекращении соглашения.\nч. 2. Решение о прекращении соглашения оформляется постановлением прокурора и приобщается к материалам уголовного дела.\nч. 3. Сведения, сообщённые лицом в рамках соглашения, могут использоваться в качестве доказательств по уголовному делу.","note":"","cat":"Досудебное соглашение"},{"art":"90","part":"ст.","title":"Прокурорский надзор за заключением и исполнением соглашения","desc":"ч. 1. Прокурор осуществляет надзор за законностью заключения и исполнения досудебного соглашения.\nч. 2. Начальник следственного органа либо начальник следственного подразделения вправе истребовать материалы уголовного дела, связанные с соглашением, в пределах своей компетенции.\nч. 3. Сотрудники Офиса Генерального прокурора вправе истребовать материалы уголовного дела, связанные с соглашением, на любом этапе производства.\nч. 4. Разглашение сведений досудебного соглашения не допускается, за исключением случаев их предоставления:\nа) суду;\nб) начальнику следственного органа либо начальнику следственного подразделения;\nв) сотрудникам Офиса Генерального прокурора. Глава XIX. Ознакомление с материалами уголовного дела.","note":"","cat":"Досудебное соглашение"},{"art":"91","part":"ст.","title":"Основания начала ознакомления с материалами уголовного дела","desc":"ч. 1. Ознакомление участников уголовного судопроизводства с материалами уголовного дела, оформленного в форме письменной отчётности, осуществляется после принятия уполномоченным должностным лицом следующего процессуального решения:\nа) об утверждении обвинительного заключения и направлении уголовного дела в суд.\nч. 2. Ознакомление участников уголовного судопроизводства с материалами уголовного дела также осуществляется в случае подачи участником уголовного судопроизводства административного искового заявления об обжаловании процессуального решения, предусмотренного пунктом «в» статьи 77 Процессуального кодекса штата San-Andreas.\nч. 3. После наступления одного из оснований, предусмотренных частями 1 и 2 настоящей статьи, следователь, ведущий уголовное дело, обязан:\nа) уведомить участников уголовного судопроизводства в письменной форме;\nб) разъяснить им право на ознакомление с материалами уголовного дела;\nв) обеспечить доступ к материалам уголовного дела, оформленным в виде письменных документов.\nч. 4. Ознакомление с материалами уголовного дела осуществляется в порядке, установленном настоящей главой, с обязательным документированием всех процессуальных действий.","note":"","cat":"Ознакомление с делом"},{"art":"92","part":"ст.","title":"Общие положения об ознакомлении с материалами уголовного дела","desc":"ч. 1. Ознакомление с материалами уголовного дела осуществляется в целях обеспечения права на защиту и реализации принципа состязательности сторон.\nч. 2. Материалы уголовного дела представляют собой совокупность письменных документов, процессуальных актов, доказательств и иных сведений, оформленных в установленном порядке.\nч. 3. Все материалы уголовного дела подлежат систематизации, нумерации и ведению в форме письменной отчётности.\nч. 4. Должностное лицо обязано обеспечить условия, исключающие утрату, повреждение, искажение либо несанкционированное изменение письменных материалов уголовного дела.","note":"","cat":"Ознакомление с делом"},{"art":"93","part":"ст.","title":"Ознакомление обвиняемого и его защитника","desc":"ч. 1. Обвиняемому и его защитнику предоставляется право ознакомиться со всеми письменными материалами уголовного дела без ограничения их объёма.\nч. 2. Ознакомление осуществляется:\nа) совместно обвиняемым и защитником;\nб) раздельно по их инициативе.\nч. 3. В процессе ознакомления обвиняемый и его защитник вправе:\nа) делать письменные выписки из материалов уголовного дела;\nб) изготавливать копии документов, в том числе с использованием технических средств;\nв) заявлять письменные ходатайства;\nг) представлять письменные доказательства;\nд) заявлять отводы.","note":"","cat":"Ознакомление с делом"},{"art":"94","part":"ст.","title":"Ознакомление потерпевшего и его представителя","desc":"ч. 1. Потерпевшему и его представителю предоставляется право ознакомиться с письменными материалами уголовного дела.\nч. 2. Потерпевший вправе ознакомиться со всеми материалами уголовного дела, за исключением случаев, предусмотренных законом.\nч. 3. Представитель потерпевшего пользуется теми же правами, что и представляемое лицо.\nч. 4. Потерпевший и его представитель вправе:\nа) делать письменные выписки из материалов уголовного дела;\nб) изготавливать копии документов;\nв) подавать письменные ходатайства;\nг) заявлять отводы;\nд) подавать письменные жалобы на действия (бездействие) должностных лиц.","note":"","cat":"Ознакомление с делом"},{"art":"95","part":"ст.","title":"Ознакомление иных участников уголовного судопроизводства","desc":"ч. 1. Гражданский истец, гражданский ответчик и их представители вправе ознакомиться с письменными материалами уголовного дела в части, относящейся к заявленным требованиям.\nч. 2. Указанные лица вправе:\nа) делать письменные выписки из материалов дела;\nб) изготавливать копии документов;\nв) подавать письменные ходатайства;\nг) заявлять отводы.","note":"","cat":"Ознакомление с делом"},{"art":"96","part":"ст.","title":"Сроки ознакомления с материалами уголовного дела","desc":"ч. 1. Срок ознакомления с письменными материалами уголовного дела не ограничивается, за исключением случаев злоупотребления данным правом.\nч. 2. В случае необоснованного затягивания ознакомления следователь либо прокурор вправе обратиться в суд с письменным ходатайством об установлении разумного срока ознакомления.\nч. 3. Суд, рассмотрев ходатайство, вправе установить конкретный срок ознакомления с материалами уголовного дела.","note":"","cat":"Ознакомление с делом"},{"art":"97","part":"ст.","title":"Ходатайства и заявления после ознакомления","desc":"ч. 1. После завершения ознакомления участники уголовного судопроизводства вправе подать письменные ходатайства в суд либо прокурору в пределах их компетенции.\nч. 2. Ходатайства могут касаться:\nа) проведения дополнительных следственных действий;\nб) исключения доказательств;\nв) изменения объёма обвинения или квалификации деяния;\nг) иных обстоятельств, имеющих значение для уголовного дела.","note":"","cat":"Ознакомление с делом"},{"art":"98","part":"ст.","title":"Гарантии реализации права на ознакомление","desc":"ч. 1. Отказ в предоставлении письменных материалов уголовного дела либо создание препятствий к ознакомлению не допускается.\nч. 2. Нарушение права на ознакомление является существенным нарушением процессуального законодательства.\nч. 3. Действия (бездействие) должностных лиц могут быть обжалованы в порядке, установленном законодательством штата San-Andreas.","note":"","cat":"Ознакомление с делом"},{"art":"99","part":"ст.","title":"Исключения и ограничения доступа к материалам уголовного дела","desc":"ч. 1. Сотрудники Офиса Генерального прокурора вправе затребовать материалы уголовного дела либо их копии в письменной форме на любой стадии уголовного судопроизводства независимо от этапа расследования или рассмотрения дела.\nч. 2. Прокурор и следователь не вправе разглашать материалы уголовного дела, оформленные в письменной форме, а равно предоставлять их для ознакомления третьим лицам до предъявления обвинения.\nч. 3.\nИсключение составляют случаи предоставления материалов уголовного дела:\nа) начальнику следственного органа либо начальнику следственного подразделения;\nб) сотрудникам Офиса Генерального прокурора;\nв) суду;\nг) иным лицам в случаях, прямо предусмотренных законами штата San-Andreas. Глава XX. Терминология.","note":"","cat":"Ознакомление с делом"},{"art":"100","part":"ст.","title":"Основные понятия, используемые в настоящем Кодексе","desc":"ч. 1. Если не оговорено иное, основные понятия, используемые в настоящем Кодексе, имеют следующие значения: Алиби — нахождение подозреваемого или обвиняемого в момент совершения правонарушения в другом месте; Апелляционная инстанция — суд второй инстанции, рассматривающий в апелляционном порядке дела по жалобам, приговорам, определениям и постановлениям суда; Близкие лица — иные, за исключением близких родственников и родственников, лица, состоящие в свойстве с потерпевшим, свидетелем, а также лица, жизнь, здоровье и благополучие которых дороги потерпевшему, свидетелю в силу сложившихся личных отношений; Близкие родственники — супруг, супруга, родители, дети, усыновители, усыновленные, родные братья и родные сестры, дедушка, бабушка, внуки; Вердикт — решение о виновности или невиновности подсудимого, вынесенное коллегией присяжных заседателей; Государственный обвинитель — поддерживающее от имени государства обвинение в суде по делу должностное лицо Офиса Генерального прокурора; Досудебное производство — судопроизводство с момента получения сообщения о правонарушении до направления прокурором дела в суд для рассмотрения его по существу; Жилище — индивидуальный жилой дом с входящими в него жилыми и нежилыми помещениями, жилое помещение независимо от формы собственности, входящее в жилищный фонд и используемое для постоянного или временного проживания, а равно иное помещение или строение, не входящее в жилищный фонд, но используемое для временного проживания; Законная сила — обязательность и непреложность решения, акта или нормы права. Оно подразумевает, что данное решение или акт должны исполняться и признаются действительными до тех пор, пока не будут отменены или изменены в установленном законом порядке. Решение, вступившее в законную силу, не может быть обжаловано; Задержание — мера процессуального принуждения, применяемая сотрудниками силовых структур на срок не более 1 часа с момента фактического задержания лица по подозрению в совершении правонарушения; Осмотр — это процесс визуального изучения места происшествия, местности, лиц, жилища, иных помещений, предметов и документов уполномоченным на то лицом, с целью обнаружения следов правонарушения или выяснения других обстоятельств, имеющих значение для дела. При осмотре не допускается применение физического воздействия к осматриваемым объектам и лицам; Досмотр — обследование вещей уполномоченным на то лицом, проводимое без нарушения их конструктивной целостности. Досмотр осуществляется в целях обнаружения потенциально опасных предметов (огнестрельного и иного оружия, специальных средств, колюще-режущих предметов и иных предметов, которые могут быть использованы в качестве оружия), а также в иных случаях, предусмотренных законом. При этом лицо, подвергаемое досмотру может отказаться от прохождения досмотра с условием, что оно будет выдворено с территории или не будет допущено на территорию, а в отдельно предусмотренных случаях — не будет выпущено с территории, для нахождения на которой или при пересечении границы которого прохождение досмотра является обязательным; Обыск — это следственное действие, состоящее в обследовании уполномоченным на то лицом, помещений либо лиц (личный обыск) в целях обнаружения предметов, имеющих какое-либо значение для уголовного или административного производства; Кассационная инстанция — суд третьей инстанции, рассматривающий в кассационном порядке дела по жалобам, приговорам, определениям и постановлениям апелляционного суда; Момент фактического задержания — момент производимого в порядке, установленном настоящим Кодексом, фактического лишения свободы передвижения лица, подозреваемого в совершении правонарушения; Непричастность — неустановленная причастность либо установленная непричастность лица к совершению правонарушения; Ночное время — промежуток времени с 22 до 6 часов по местному времени; Обвинение — утверждение о совершении определенным лицом деяния, запрещенного Уголовным кодексом или Кодексом об административных правонарушениях, выдвинутое в порядке, установленном настоящим Кодексом; Определение — любое решение, вынесенное судами первой и апелляционной инстанций, за исключением приговора. Постановление — любое решение, за исключением приговора, вынесенное судьей; решение прокурора, следователя; Председательствующий — судья, который руководит судебным заседанием при коллегиальном рассмотрении дела, а также судья, рассматривающий дело единолично; Приговор — решение о невиновности или виновности подсудимого и назначении ему наказания либо об освобождении его от наказания, вынесенное судом первой или апелляционной инстанции; Присяжный заседатель — лицо, привлеченное в установленном законом порядке для участия в судебном разбирательстве и вынесения вердикта; Процессуальное действие — следственное, судебное или иное действие, предусмотренное настоящим Кодексом; Промежуточное судебное решение — все определения и постановления суда, за исключением итогового судебного решения; Свидетельский иммунитет — право лица не давать показания против себя и своих близких родственников, а также в иных случаях, предусмотренных настоящим Кодексом; Следователь — служащий правоохранительных органов, уполномоченный в пределах компетенции, предусмотренной действующим законодательством, осуществлять следствие по уголовному делу или делу об административном правонарушении; Судебное заседание — процессуальная форма осуществления правосудия в ходе досудебного и судебного производства по делу; Судебное разбирательство — судебное заседание судов первой и второй инстанций; Суд первой инстанции — суд, рассматривающий дело по существу и правомочный Поделиться: Jeffrey Nihilistic, DVIGAEM PO BLATU, vedro_gudrona и еще 3 Like Жалоба Закрыто для дальнейших ответов. Законодательная база выносить приговор, а также принимать решения в ходе досудебного производства по делу; Суд второй инстанции — суд апелляционной инстанции (апелляция); Суд третьей инстанции — суд кассационной инстанции (кассация); Судебное решение — приговор, определение, постановление, вынесенные при производстве по делу в судах первой и второй инстанций; Итоговое судебное решение — приговор, иное решение суда, вынесенное в ходе судебного разбирательства, которым дело разрешается по существу; Внепроцессуальное обращение — поступившее обращение в письменной или устной форме не являющихся участниками судебного разбирательства государственного органа, органа местного самоуправления, иного органа, организации, должностного лица или гражданина, либо обращение в не предусмотренной процессуальным законодательством форме участников судебного и досудебного разбирательства; Приказ — вид акта управления, волевое властное официальное распоряжение руководителя, командира или начальника, отданное в пределах его должностных полномочий и обязательное для исполнения подчиненными; Прокурор — Генеральный прокурор, его заместители, старшие прокуроры, прокуроры, прямо наделенные процессуальными полномочиями Офиса Генерального прокурора согласно закону «О деятельности Офиса Генерального Прокурора штата San-Andreas» и Процессуальному кодексу. Последнее редактирование: Воскресенье в 02:02 Community platform by XenForo © 2010-2026 XenForo Ltd. | Style by ThemeHouse Русский (RU) Обратная связь Условия и правила Политика конфиденциальности Помощь Главная ®.","note":"","cat":"Основные понятия"}],"us":[{"art":"1","part":"ст.","title":"Что такое Устав","desc":"Устав — свод норм и правил, регулирующих деятельность и внутриведомственные отношения Полицейского департамента Лос-Сантоса (далее по тексту — департамента).","note":"","cat":"Основные положения"},{"art":"2","part":"ст.","title":"Чем регулируется деятельность сотрудников","desc":"Деятельность сотрудников департамента регулируется законодательством штата Сан-Андреас, постановлениями Сената штата Сан-Андреас, нормативными актами Губернатора, Вице-Губернатора, Главы департамента национальной безопасности и его заместителей, данным уставом.","note":"","cat":"Основные положения"},{"art":"3","part":"ст.","title":"Обязательность Устава","desc":"Данный устав является общепринятым и обязательным для исполнения всеми сотрудниками департамента.","note":"","cat":"Основные положения"},{"art":"4","part":"ст.","title":"Кто вносит изменения в Устав","desc":"Изменения и дополнения в настоящий устав вносятся Шефом полицейского департамента и подлежат обязательному утверждению Главой департамента национальной безопасности штата Сан-Андреас в установленном законом порядке.","note":"","cat":"Основные положения"},{"art":"5","part":"ст.","title":"Структура департамента","desc":"Структура департамента представляет собой иерархическую систему, основанную на принципах единоначалия и строгого соблюдения субординации. Штатное расписание и структура подразделений утверждаются Шефом полиции.","note":"","cat":"Иерархия и структура"},{"art":"6","part":"ст.","title":"Руководство департаментом","desc":"Руководство деятельностью департамента осуществляют Шеф полиции, его заместители и советники, которые определяют основные направления оперативной работы, кадровой политики и стратегического развития ведомства.","note":"","cat":"Иерархия и структура"},{"art":"7","part":"ст.","title":"Отделы департамента","desc":"Все сотрудники департамента, за исключением руководящего состава, обязаны состоять в одном из оперативных отделов.\nч. 1 В состав департамента входят следующие отделы:\nа) Air Force [AF]\nб) MED\nв) PAI\nг) INTERNAL AFFAIRS DIVISION [IAD]\nд) CENTRAL PATROL DIVISION [CPD]\nе) Department of Vehicle Deploymentp [DVD]\nж) K-9 Canine Unit [K-9]\nз) Special Weapons And Tactics [SWAT]\nи) Detective Bureau [DB]\nк) Natural Resources and Environment Division-NRED\nл) TED\nм) HALT\nн) Police Academy [PA].\nо) STRK.","note":"","cat":"Иерархия и структура"},{"art":"8","part":"ст.","title":"Система рангов","desc":"Система должностных званий (рангов) департамента устанавливает вертикаль власти и определяет объем полномочий, ответственности и денежного довольствия сотрудника.\nч. 1 Перечень рангов строится в порядке возрастания от младшего состава до высшего руководящего звена:\nа) Младший состав: Cadet Jr.Officer\nб) Основной состав: Officer Corporal Jr.Sergeant Sergeant Lieutenant Captain Major\nв) Старший состав: Dep. Head of Department Head of Department Cur. of Department Assistant Chief\nг) Руководящий состав: Advisor Chief Deputy Chief Chief\nч. 2 Сотрудники департамента, не входящие в старший состав подразделений или руководящий состав полиции, не могут занимать должность выше Major [7].\nИсключение: Сотрудники PAI могут занимать должность Recruiting Officer [8]; сотрудники AF, SWAT, IAD, DB, MCD, CTRT, Alpha могут занимать должность Commander [9].","note":"","cat":"Иерархия и структура"},{"art":"9","part":"ст.","title":"Обращение по иерархии","desc":"Сотруднику департамента запрещено обращаться не по иерархии.","note":"","cat":"Иерархия и структура"},{"art":"10","part":"ст.","title":"Подчинение приказам","desc":"Сотрудник департамента обязан подчиняться приказам старшего состава своего отдела, старшему составу IAD и руководящему составу департамента.","note":"","cat":"Иерархия и структура"},{"art":"11","part":"ст.","title":"Полномочия Шефа и заместителей","desc":"Шеф полицейского департамента, его заместители и советники действуют от имени учреждения, представляют его интересы в органах и собраниях государственной власти и местного самоуправления, коммерческих и некоммерческих организаций.","note":"","cat":"Иерархия и структура"},{"art":"12","part":"ст.","title":"Общие запреты","desc":"ч. 1 Сотрудникам Полицейского департамента Лос-Сантоса строго запрещается:\nа) Нарушать законодательную базу штата Сан-Андреас.\nб) Принимать участие в нелегальной или криминальной деятельности.\nв) Халатно относиться к своим должностным обязанностям и полномочиям.\nг) Злоупотреблять должностными полномочиями в личных, корыстных или иных целях, не связанных со службой.\nд) Использовать табельное оружие и служебные специальные средства не по прямому назначению.\nе) Принимать, требовать или вымогать взятки в любом виде.","note":"","cat":"Запреты"},{"art":"13","part":"ст.","title":"Запреты: субординация и общение","desc":"ч. 1 Сотрудникам департамента запрещается:\nа) Игнорировать входящие вызовы по рации от старшего и руководящего состава.\nб) Нарушать субординацию в коллективе и по отношению к старшему составу.\nв) Создавать, участвовать или провоцировать конфликты в коллективе.\nг) Допускать клевету, обман, намеренное введение в заблуждение коллег или руководства, а также укрывательство провинившихся сотрудников.\nд) Ругаться матом, оскорблять, хамить, унижать или неуважительно относиться к жителям штата и коллегам, независимо от их положения и социального статуса.","note":"","cat":"Запреты"},{"art":"14","part":"ст.","title":"Трудовые и дисциплинарные нарушения","desc":"ч. 1 Сотрудникам департамента запрещается:\nа) Нарушать утвержденный график работы.\nб) Прогуливать рабочий день.\nв) Отсутствовать на рабочем месте более трех дней без одобренного заявления на отпуск.\nг) Выпрашивать, намекать или иным образом добиваться получения новой должности вне установленного порядка аттестации.\nд) Злостно нарушать строевой порядок во время построений и официальных мероприятий.\nе) Игнорировать обязательные построения и брифинги, что приравнивается к прогулу рабочего дня.","note":"","cat":"Запреты"},{"art":"15","part":"ст.","title":"Состояние и внешний вид","desc":"ч. 1 Сотрудникам департамента запрещается:\nа) Находиться в состоянии алкогольного или наркотического опьянения при исполнении должностных обязанностей.\nб) Не соответствовать установленному дресс-коду. Форма одежды должна строго соответствовать рангу и отделу сотрудника.\nв) Находиться на закрытой территории департамента в личной (гражданской) одежде.\nПримечание: Разрешено следование в личной одежде от входа до раздевалки, а также до склада с целью сдачи вооружения.\nИсключение составляют сотрудники отдела DB, старший и руководящий состав.","note":"","cat":"Запреты"},{"art":"16","part":"ст.","title":"Имущество и транспорт","desc":"ч. 1 Сотрудникам департамента запрещается:\nа) Использовать служебный транспорт в личных целях, не связанных с выполнением служебных задач.\nб) Использовать транспорт департамента, находясь не при исполнении служебных обязанностей (вне смены, на перерыве или в отпуске).\nв) Передвигаться на личном транспорте по внутренней закрытой территории департамента.\nг) Использовать служебный транспорт не по назначению.","note":"","cat":"Запреты"},{"art":"17","part":"ст.","title":"Действия в нерабочее время","desc":"ч. 1 Сотрудникам департамента запрещается:\nа) Во время перерыва или отпуска пользоваться служебным положением, а также применять табельное оружие и служебные специальные средства.\nПримечание: Перед уходом на перерыв или в отпуск сотрудник обязан сдать табельное оружие и специальные средства на склад.","note":"","cat":"Запреты"},{"art":"18","part":"ст.","title":"Ограничения по видам деятельности","desc":"ч. 1 Сотрудникам департамента запрещается:\nа) Играть в азартные игры, посещать казино (включая игру в рулетку и подобные развлечения), участвовать в GunGame, посещать авторынок, аукционы и букмекерские конторы, находясь в рабочей форме либо в рабочее время.\nб) Младшему составу, а также сотрудникам, не прошедшим переаттестацию, проводить любые процессуальные действия, включая задержание, до завершения стажировки.\nв) Создавать помехи или вмешиваться в оперативную работу других отделов департамента и иных государственных фракций.\nг) Кинологам оставлять служебных собак без присмотра на длительное время.","note":"","cat":"Запреты"},{"art":"19","part":"ст.","title":"Имущество и документация","desc":"ч. 1 Сотрудникам департамента запрещается:\nа) Помещать на склад организации любые предметы, не относящиеся к служебной деятельности департамента.\nИсключение: вещественные доказательства, улики и иные предметы, полученные в результате служебной деятельности.\nб) Самовольно получать доступ к документации других отделов без соответствующего разрешения.\nв) Менять паспортные данные без предварительного уведомления старшего или руководящего состава департамента.","note":"","cat":"Запреты"},{"art":"20","part":"ст.","title":"Репутационные и процессуальные запреты","desc":"ч.1 Сотрудникам департамента запрещается:\nа) Совершать действия, подрывающие репутацию Полицейского департамента Лос- Сантоса и его руководящего состава.\nб) Нарушать установленные правила агитации.\nв) Сотрудникам младшего состава иметь хотя бы один строгий выговор.\nг) Сотрудникам младшего состава запрещено проходить стажировку более, чем 7 дней.","note":"","cat":"Запреты"},{"art":"21","part":"ст.","title":"Обязанности руководящего состава","desc":"ч. 1 Сотрудникам, занимающим руководящие должности, запрещается нарушать порядок рассмотрения дисциплинарных взысканий.\nч. 2 Старшему составу запрещено переводить сотрудников департамента не в свой отдел.\nч. 3 Старшему составу и сотрудникам PAI запрещено повышать сотрудников департамента без одобренного отчета на повышение.\nч. 4 Старшему составу и сотрудникам PAI запрещено пропускать запросы на повышение и рассматривать их вне очереди.\nч. 5 Старшему составу запрещено повышать сотрудников департамента на ранги, не соответствующие их занимаемой должности и (или) отделу.","note":"","cat":"Запреты"},{"art":"22","part":"ст.","title":"Сроки заполнения документации","desc":"ч. 1 Сотрудникам департамента запрещается нарушать сроки заполнения обязательной документации:\nа) Сотрудник обязан в срок не более двух часов заполнять всю обязательную отчетность, включая кадровый аудит, списки выданных лицензий, дисциплинарных взысканий и иную предусмотренную регламентом документацию.","note":"","cat":"Запреты"},{"art":"23","part":"ст.","title":"Права сотрудника","desc":"ч. 1 Каждый сотрудник имеет право на увольнение по собственному желанию в порядке, установленном настоящим уставом.\nч. 2 Каждый сотрудник после успешного прохождения стажировки имеет право на доступ к содержимому склада организации для использования в целях исполнения служебных обязанностей.\nч. 3 Каждый сотрудник имеет право на получение денежного поощрения (премии) по итогам еженедельного отчета о проделанной работе. Списки сотрудников, представляемых к премированию, составляются начальниками соответствующих отделов и утверждаются руководством.\nч. 4 Каждый сотрудник имеет право на перерыв в течение рабочего дня и на отпуск в соответствии с положениями Главы Ⅵ настоящего устава.\nч. 5 Для выполнения возложенных на себя должностных обязанностей, каждый сотрудник департамента имеет право:\nа) использовать в служебных целях государственные средства связи;\nб) использовать в случаях, не терпящих отлагательства, транспортные средства, принадлежащие предприятиям, учреждениям, организациям, общественным объединениям или гражданам (за исключением тех, которые освобождены законом), для предотвращения преступлений, преследования и задержания лиц, доставления граждан, нуждающихся в срочной медицинской помощи, в лечебные учреждения, а также для проезда к месту происшествия;\nв) беспрепятственно входить в жилые и иные принадлежащие гражданам помещения, на земельные участки, на территории и в помещения предприятий, учреждений и организаций независимо от форм собственности, если имеются достаточные данные полагать, что там совершается или совершено общественно опасное деяние, отнесённое к ведению департамента, а также в случае преследования подозреваемых, если промедление может поставить под угрозу жизнь и здоровье граждан (с уведомлением Генерального прокурора в течение одного часа);\nг) по решению руководящего состава департамента производить оцепление (блокирование) участков местности (объектов) при пресечении актов терроризма, массовых беспорядков, а также при розыске лиц, совершивших побег из-под стражи, преследовании подозреваемых, осуществляя при необходимости досмотр транспортных средств;\nд) временно ограничивать или запрещать передвижение граждан и транспортных средств по отдельным участкам местности (на отдельных объектах), обязывать граждан оставаться там или покинуть эти участки (объекты) в целях защиты жизни, здоровья и имущества граждан, проведения неотложных следственных действий, оперативно-розыскных и антитеррористических мероприятий;\nе) проверять у лиц документы, удостоверяющие их личность, осуществлять их личный досмотр и досмотр находящихся при них вещей, если имеются достаточные основания подозревать их в совершении административных правонарушений или преступлений, а также досмотр транспортных средств и находящихся в них грузов при подозрении, что они используются в целях совершения указанных правонарушений или преступлений;\nж) применять физическую силу, боевую технику, оружие, специальные средства, принятые на вооружение органов департамента, а также разрешать служащим департамента хранение и ношение табельного оружия и специальных средств в соответствии с законом;\nз) производить фото-, видео- и аудиозапись в процессе исполнения возложенных на служащих департамента обязанностей;\nи) направлять в письменной форме должностным лицам, а при наличии сведений о готовящихся противоправных деяниях, содержащих признаки экстремистской деятельности, руководителям общественных (религиозных) объединений и иным лицам предостережение о недопустимости нарушения закона;\nк) проводить оперативно-розыскные мероприятия по выявлению, предупреждению, пресечению и раскрытию шпионажа, организованной преступности, коррупции, незаконного оборота оружия и наркотических средств, контрабанды, представляющих угрозу безопасности штата Сан-Андреас, и преступлений, предварительное следствие по которым отнесены законодательством штата Сан-Андреас к ведению департамента, а также по выявлению, предупреждению, пресечению и раскрытию деятельности незаконных вооруженных формирований, преступных групп, отдельных лиц и общественных объединений, ставящих своей целью насильственное изменение конституционного строя штата Сан-Андреас, и в иных случаях, предусмотренных законом;\nл) осуществлять предварительное следствие без обязательной письменной отчетности по делам о преступлениях, отнесенных законодательством штата Сан-Андреас к ведению органов департамента;\nч. 6 Сотрудники отделов PAI, IAD, руководящий состав департамента осуществляют выдачу лицензий на право хранения, ношения и использования огнестрельного оружия.","note":"","cat":"Права сотрудника"},{"art":"24","part":"ст.","title":"Рабочее время отделов","desc":"ч. 1 Служебная деятельность сотрудников департамента осуществляется в соответствии с утвержденным графиком работы. Время начала и окончания рабочего дня для каждого структурного подразделения устанавливается следующим образом:\nа) Internal Affairs Division [IAD] — с 12:00 до 22:00;\nб) Alpha — с 12:00 до 00:00;\nв) Special Weapons Assault Team [SWAT] — с 12:00 до 00:00;\nг) Department of Vehicle Deployment [DVD] — с 12:00 до 00:00;\nд) Detective Bureau [DB] — с 14:00 до 02:00;\nе) Air Force [AF] — с 12:00 до 00:00;\nж) Central Patrol Division [CPD] — с 12:00 до 00:00;\nз) Canine Unit [K-9] — с 12:00 до 00:00;\nи) Police Academy Instructors [PAI] — с 14:00 до 22:00;\nк) Highway Anti-Smuggling Law Taskforce [HALT] — с 12:00 до 00:00;\nл) Major Crimes Division [MCD] — с 12:00 до 00:00;\nм) Citywide Tactical Response Team [CTRT] — с 12:00 до 00:00;\nн) Police Academy [PA] — с 14:00 до 22:00.\nч. 2 Сотрудники департамента имеют право исполнять должностные обязанности вне указанного в\nч. 1 времени.","note":"","cat":"Рабочий день и отпуск"},{"art":"25","part":"ст.","title":"Перерыв","desc":"Сотрудник имеет право на оплачиваемый перерыв длительностью до 120 минут за одну рабочую смену (день), однако обязан уведомить начальство своего отдела и получить одобрение при уходе на перерыв.","note":"","cat":"Рабочий день и отпуск"},{"art":"26","part":"ст.","title":"Вызов с перерыва","desc":"Начальство отдела имеет право вызвать своего подчиненного с перерыва на работу при наличии веской причины.","note":"","cat":"Рабочий день и отпуск"},{"art":"27","part":"ст.","title":"Отпуск","desc":"Сотрудники департамента от 3 порядкового ранга имеют право взять неоплачиваемый отпуск длительностью от 3 до 7 дней.\nч. 1 При появлении находящегося в отпуске сотрудника в штате отпуск считается аннулированным, а он обязуется выйти на рабочее место в кратчайший срок.\nч. 2 Сотруднику департамента запрещено отсутствовать на работе более 3-х дней без одобренного отпуска.","note":"","cat":"Рабочий день и отпуск"},{"art":"28","part":"ст.","title":"Жетон, бейдж и бодикамера","desc":"На службе у сотрудника всегда должны быть жетон, бейдж или нашивка с личным номерным знаком, а также удостоверение и прикрепленная на видном месте боди-камера.","note":"","cat":"Внешний вид"},{"art":"29","part":"ст.","title":"Форма отдела","desc":"На рабочем месте каждый сотрудник младшего и среднего состава обязан носить форму своего отдела.","note":"","cat":"Внешний вид"},{"art":"30","part":"ст.","title":"Кто собирает общий строй","desc":"Общий строй имеет право собрать старший состав отделов SWAT, AF, IAD и руководящий состав департамента.","note":"","cat":"Строй"},{"art":"31","part":"ст.","title":"Кто собирает строй отдела","desc":"Ассистенты шефа полиции, начальники отделов и их заместители имеют право собрать строй конкретно своего отдела.","note":"","cat":"Строй"},{"art":"32","part":"ст.","title":"Помехи строю другого отдела","desc":"Запрещено препятствовать проведению строя другого отдела.","note":"","cat":"Строй"},{"art":"33","part":"ст.","title":"Запреты в строю","desc":"Разговаривать без разрешения старшего состава, активно жестикулировать, использовать телефон, звонить или отправлять с него сообщения, держать оружие в руках без указания старшего состава, выходить или покидать строй без приказа, стрелять из строя без приказа руководства, перебивать старшего по должности, задавать вопросы, спать, употреблять различного рода пищу (за исключением случаев, когда отсутствие пищи может принести вред здоровью и жизни), курить, принимать неестественную позу для офицера, танцевать.","note":"","cat":"Строй"},{"art":"34","part":"ст.","title":"Отметки присутствующих в строю","desc":"Старший по званию, собирающий строй, обязан вносить отметки присутствующих и отсутствующих в строю и применять меры необходимого реагирования.","note":"","cat":"Строй"},{"art":"35","part":"ст.","title":"Стойка смирно в строю","desc":"По прибытию в строй сотрудник обязан встать по стойке смирно, а также не брать никакие предметы в руки до конца строя или соответствующего приказа старшего по званию, собирающего строй.","note":"","cat":"Строй"},{"art":"36","part":"ст.","title":"Комплектование снаряжения","desc":"Начальники отделов и их заместители ответственны за укомплектование личного снаряжения членов своего подразделения.","note":"","cat":"Строй"},{"art":"37","part":"ст.","title":"Вызов на работу в нерабочее время","desc":"Сотрудник может быть вызван на работу в не рабочее время по приказу руководящего состава департамента, за исключением случаев, когда имеется уважительная и безотлагательная причина отсутствовать в строю.\nч. 1 Сотрудники отдела DB не обязаны являться в общие построения.","note":"","cat":"Строй"},{"art":"38","part":"ст.","title":"Обжалование выговора за неявку","desc":"При наличии уважительной причины для неявки в строй, получившему выговор сотруднику необходимо подать обжалование через канал специальной связи.","note":"","cat":"Строй"},{"art":"39","part":"ст.","title":"Взыскания стажёрам","desc":"Сотрудники отдела PAI имеют право выдавать дисциплинарные взыскания стажерам.","note":"","cat":"Дисциплинарные взыскания"},{"art":"40","part":"ст.","title":"Взыскания IAD младшему и среднему составу","desc":"Сотрудники IAD имеют право выдавать дисциплинарные взыскания младшему и среднему составу других отделов.","note":"","cat":"Дисциплинарные взыскания"},{"art":"41","part":"ст.","title":"Взыскания IAD старшему составу","desc":"Старший состав IAD имеет право выдавать дисциплинарные взыскания старшему составу других отделов.","note":"","cat":"Дисциплинарные взыскания"},{"art":"42","part":"ст.","title":"Взыскания внутри своего отдела","desc":"Старший состав имеет право выдавать дисциплинарные взыскания сотрудникам своих отделов.","note":"","cat":"Дисциплинарные взыскания"},{"art":"43","part":"ст.","title":"Взыскания руководящего состава и чёрный список","desc":"Руководящий состав департамента имеет право выдавать дисциплинарное взыскание любому работнику и осуществлять внесение определенных лиц в черный список организации.","note":"","cat":"Дисциплинарные взыскания"},{"art":"44","part":"ст.","title":"Санкции за неявку в строй","desc":"Любое лицо, имеющее право на осуществление дисциплинарного производства, имеет право применять санкции к сотрудникам любых отделов за неявку в строй.","note":"","cat":"Дисциплинарные взыскания"},{"art":"45","part":"ст.","title":"Снятие взыскания","desc":"Снять активное дисциплинарное взыскание может лишь сотрудник, который его выдал, сотрудники отдела IAD или руководящий состав департамента.","note":"","cat":"Дисциплинарные взыскания"},{"art":"46","part":"ст.","title":"Виды взысканий","desc":"ч. 1 Дисциплинарные взыскания в департаменте подразделяются на следующие виды:\nа) предупреждение;\nб) выговор;\nв) переаттестация;\nг) понижение в должности;\nд) увольнение.","note":"","cat":"Дисциплинарные взыскания"},{"art":"47","part":"ст.","title":"Основание для взыскания","desc":"Сотрудник, выдающий дисциплинарное взыскание за нарушение устава, обязан указать основание — конкретный пункт (статью) устава, который был нарушен, или понятный аналог.","note":"","cat":"Дисциплинарные взыскания"},{"art":"48","part":"ст.","title":"Обжалование взысканий","desc":"ч. 1 Сотрудник департамента вправе обжаловать дисциплинарное взыскание у следующих лиц:\nа) у лица, которое выдало дисциплинарное взыскание;\nб) у сотрудников отдела IAD;\nв) у руководящего состава департамента.","note":"","cat":"Дисциплинарные взыскания"},{"art":"49","part":"ст.","title":"Контроль IAD","desc":"Сотрудники IAD и руководящий состав департамента уполномочены на контроль за актуальностью медицинских справок и лицензий, оборотом оружия, соблюдением этического и административного кодекса внутри департамента. В случае выявленных нарушений данные лица вправе проводить внутренние служебные проверки и привлекать к предусмотренной законом ответственности сотрудников департамента.","note":"","cat":"Дисциплинарные взыскания"},{"art":"50","part":"ст.","title":"Приостановка договора старшим составом","desc":"Старший состав вправе приостановить действие трудового договора с Политика конфиденциальности Помощь Главная сотрудником своего отдела при наличии оснований, предусмотренных трудовым законодательством.","note":"","cat":"Дисциплинарные взыскания"},{"art":"51","part":"ст.","title":"Приостановка договора сотрудниками IAD","desc":"Сотрудники IAD на правах работодателя вправе приостановить действие трудового договора с младшим и средним составом других отделов при наличии оснований, предусмотренных трудовым законодательством.","note":"","cat":"Дисциплинарные взыскания"},{"art":"52","part":"ст.","title":"Приостановка договора руководством","desc":"Старший состав IAD и руководящий состав департамента на правах работодателя вправе приостановить действие трудового договора с любым сотрудником департамента полиции при наличии оснований, предусмотренных трудовым законодательством.","note":"","cat":"Дисциплинарные взыскания"}],"facts":{"uk":[["Срок давности по УК (ст. 5.7)","30 лет",["10 лет","15 лет","5 лет"],"Не применяется к лицам в федеральном розыске по решению суда или ордеру Офиса Генерального Прокурора."],["Размер залога при освобождении под стражи (ст. 5.10)","25.000$ за каждый год лишения свободы",["10.000$ за каждый год","50.000$ за каждый год","100.000$ фиксированно"],"Залог возможен только по статьям, не влекущим судимость."],["Когда в протоколе ареста ставится отметка о судимости (ст. 5.8)","При аресте по статьям ★★★★ и выше либо при аресте более чем на 5 лет",["За любую статью УК","Только по статьям ★★★★★","Только при аресте от 10 лет"],"При назначении уголовного штрафа судимость не возникает."],["Что освобождает от ответственности по ст. 12.8, 12.8.1, 13.1, 13.2 (ст. 5.9)","Добровольная сдача предметов",["Явка с повинной после задержания","Оплата штрафа","Показания свидетеля"],"Изъятие при задержании, обыске или иных действиях добровольной сдачей не считается."],["Что считается отказом от оплаты штрафа (ст. 17.7)","Возврат или порча штрафного тикета, устный или письменный отказ, игнорирование тикета",["Только письменный отказ","Просрочка оплаты на сутки","Обжалование штрафа в суде"],"Наказание по ст. 17.7: 3 года лишения свободы или уголовный штраф 20.000$–60.000$."],["Можно ли применять уголовный закон по аналогии (ст. 1.2)","Нет, не допускается",["Да, если закон не содержит нужной статьи","Да, по решению суда","Только для статей ★★★★★"],"Преступность и наказуемость деяния определяются только самим Кодексом."],["Допускается ли ответственность за невиновное причинение вреда (ст. 1.4)","Нет, объективное вменение не допускается",["Да, если вред причинён должностному лицу","Да, при тяжких последствиях","Только по решению суда"],"Лицо отвечает только за те действия и последствия, в отношении которых установлена его вина."],["Сколько раз можно нести ответственность за одно и то же преступление (ст. 1.5 ч.2)","Только один раз",["Дважды","Столько раз, сколько было эпизодов","Не ограничено"],""],["Возникает ли судимость при назначении уголовного штрафа (ст. 1.9 ч.3)","Нет, не
