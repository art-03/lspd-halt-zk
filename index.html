15.000"},{"art":"27","part":"ст.","title":"Медленный транспорт в правой полосе","desc":"Транспортные средства которые не могут двигаться со скоростью более чем 60 км/ч должны двигаться по правой полосе, кроме случаев перестроения в полосу для совершения левого поворота или разворота.","note":"","cat":"Расположение на дороге","fine":"штраф до $8.000"},{"art":"28","part":"ст.","title":"Езда по обочине, тротуару и велодорожке","desc":"Запрещается двигаться транспортным средством по обочинам, тротуарам, пешеходным и велодорожкам.","note":"","cat":"Расположение на дороге","fine":"штраф до $15.000"},{"art":"29","part":"ст.","title":"Скоростные лимиты","desc":"Скоростной лимит настоящим Кодексом установлен для всех водителей транспортных средств:a) В населенных пунктах движение транспортных средств разрешается со скоростью не более 100 км/ч.б) На автодорогах за пределами населенных пунктов разрешается ехать 120 км/ч.в) Если дорога за городом имеет разделительную полосу\n– 160 км/чг) На автомагистралях допустимая скорость\n– 200 км/ч.","note":"Примечание: Штрафы могут выписываться при помощи видеонаблюдения, а также сотрудниками LSPD, LSCSD.","cat":"Скоростные лимиты","fine":"штраф до $15.000"},{"art":"30","part":"ст.","title":"Скорость при буксировке","desc":"Транспортным средствам, производящим буксировку разрешается двигаться со скоростью не более 50 км/ч.","note":"","cat":"Скоростные лимиты","fine":"штраф до $5.000"},{"art":"31","part":"ст.","title":"Помехи слишком медленной ездой","desc":"Водителю запрещается создавать помехи другим транспортным средствам, двигаясь без необходимости со слишком малой скоростью.","note":"","cat":"Скоростные лимиты","fine":"штраф до $5.000"},{"art":"32","part":"ст.","title":"Безопасность перед обгоном","desc":"Перед обгоном водитель должен убедиться в безопасности маневра.","note":"","cat":"Обгон","fine":"штраф до $8.000"},{"art":"33","part":"ст.","title":"Запреты на обгон","desc":"Обгон запрещен:\nа) когда обгоняемое транспортное средство совершает поворот налево;\nб) на пешеходных переходах;\nв) на железнодорожных переездах и ближе чем за 100 метров перед ними;\nг) на мостах и под ними, а также в тоннелях;\nд) в конце подъема, на опасных поворотах и на других участках с ограниченной видимостью.","note":"","cat":"Обгон","fine":"штраф до $8.000"},{"art":"34","part":"ст.","title":"Уступить автобусу с остановки","desc":"Водитель должен пропустить автобус, который выезжает с автобусной остановки.","note":"","cat":"Обгон","fine":"штраф до $5.000"},{"art":"37","part":"ст.","title":"Запрет остановки и парковки","desc":"Остановка и парковка запрещается:\nа) параллельно красному бордюру.","note":"Исключение: Водители автобусов во время остановок.\nб) на пешеходных переходах и тротуаре;\nв) на ж/д переездах, трамвайных путях, мостах, в тоннелях;\nг) на крутых и опасных поворотах;\nд) на перекрестках;\nе) на служебных стоянках государственных учреждений.\nИсключение: Сотрудник государственной структуры на автомобиле с государственными номерами. К данным парковкам относятся парковки при государственных учреждений общего доступа (Передняя парковка LSPD, Передняя парковка Капитолия и т.д)\nж) в помещениях государственных учреждений;\nз) в случае нарушения иных требований настоящего Дорожного Кодекса, а также несоблюдения дорожной и парковочной разметки.\nи) в иных местах, где парковка и остановка запрещены в соответствии с положениями настоящего Дорожного Кодекса.","cat":"Остановка и парковка","fine":"штраф до $5.000 и эвакуация транспортного средства на штрафстоянку"},{"art":"38","part":"ст.","title":"Остановка на автомагистралях и дорогах общего пользования","desc":"Остановка запрещена на автомагистралях (хайвеях), а также дорогах общего пользования, кроме случаев чрезвычайной остановки.","note":"","cat":"Остановка и парковка","fine":"штраф до $9.000 и эвакуация транспортного средства на штрафстоянку"},{"art":"39","part":"ст.","title":"Запреты на автомагистралях","desc":"На автомагистралях запрещается:\nа) движение пешеходов, мопедов, велосипедов, тракторов, иных транспортных средств скорость которых по техническим характеристикам менее 40 км/ч;\nб) движение задним ходом;\nв) движение грузовиков вне крайней правой полосы;\nг) разворот и выезд на разделительную полосу.","note":"","cat":"Автомагистрали","fine":"штраф до $9.000 и эвакуация транспортного средства на штрафстоянку"},{"art":"40","part":"ст.","title":"Включение фар","desc":"В темное время суток или в условиях плохой погоды, а также в тоннелях транспортные средства должны использовать ближний или дальний свет фар.","note":"","cat":"Фары и сигналы","fine":"штраф до $3.000"},{"art":"41","part":"ст.","title":"Дальний свет в населённых пунктах","desc":"В населенных пунктах где дорога освещена, дальний свет должен быть переключен на ближний.","note":"","cat":"Фары и сигналы","fine":"штраф до $3.000"},{"art":"42","part":"ст.","title":"Звуковой сигнал","desc":"Звуковой сигнал разрешается подавать для предупреждения других водителей о намерении обгона вне населенных пунктов, а также в других случаях, когда это необходимо только для предотвращение дорожной аварии.","note":"","cat":"Фары и сигналы","fine":"штраф до $5.000"},{"art":"43","part":"ст.","title":"Двойная жёлтая сплошная","desc":"Пересекать желтую двойную сплошную линию для совершения обгона запрещено. Пересекать такую разметку разрешается для разворота или въезда/ выезда с прилегающей территории или дворов, убедившись в безопасности такого маневра.","note":"","cat":"Разметка и знаки","fine":"штраф до $10.000"},{"art":"44","part":"ст.","title":"Одинарная жёлтая сплошная","desc":"Одиночная желтая сплошная линия предупреждает о встречном движении, совершать обгон запрещено. Совершать разворот и поворот для въезда/ выезда с прилегающей территории или дворов - разрешается, убедившись в безопасности такого маневра. Обгон можно совершать пересекая только пунктирную разметку на дороге.","note":"","cat":"Разметка и знаки","fine":"штраф до $10.000"},{"art":"45","part":"ст.","title":"Белая сплошная линия","desc":"Белая сплошная линия у правого края дороги обозначает край проезжей части и начало обочины\n– пересекать такую разметку разрешено.","note":"Примечание: в тоже время белая сплошная линия нанесенная в пределах проезжей части, обозначает границы полос движения в опасных местах на дороге, такую разметку не рекомендуется пересекать для перестроения.","cat":"Разметка и знаки","fine":"штраф до $8.000. (если пересекая линию разметки, водитель создал опасные условия для других транспортных средств)"},{"art":"46","part":"ст.","title":"Стрелки на полосах","desc":"Стрелки нанесенные на дорогу для каждой полосы, указывают направления движения по полосам, с какой полосы можно совершать тот или иной маневр.","note":"","cat":"Разметка и знаки","fine":"штраф до $3.000"},{"art":"47","part":"ст.","title":"Стрелки сужения проезжей части","desc":"Разметка в виде стрелок налево (направо) под углом указывает о сужении проезжей части, водитель должен будет пропустить транспорт чтобы выехать на главную полосу.","note":"","cat":"Разметка и знаки","fine":"штраф до $5.000. (если водитель не пропустил транспорт при перестроении из сужающейся полосы)"},{"art":"48","part":"ст.","title":"Стоп-линия","desc":"Стоп-линия указывает место где нужно остановиться для того чтобы пропустить движущийся транспорт на перекрестке, если транспорта нет, то следует снизить скорость и притормозить.","note":"Примечание: может использоваться надпись STOP на дороге без самой линии. Также данная разметка может действовать совместно со знаком STOP (в данном случае нарушения не суммируются).","cat":"Разметка и знаки","fine":"штраф до $4.000"},{"art":"49","part":"ст.","title":"Пешеходный переход","desc":"Требуется останавливаться перед пешеходным переходом, если пешеходы пересекают дорогу:\nа) Пешеходный переход обозначается двумя продольными параллельными линиями в пределах которых пешеходы совершают переход дороги;\nб) Пешеходный переход обозначается разметкой-зеброй по которой пешеходы совершают переход дороги.","note":"","cat":"Разметка и знаки","fine":"штраф до $5.000"},{"art":"50","part":"ст.","title":"Двойная сплошная, переходящая в пунктирную","desc":"Двойная сплошная линия переходящая в сплошную линию с пунктирной, разрешает пересекать ее для обгона только со стороны пунктирной линии.","note":"","cat":"Разметка и знаки","fine":"штраф до $10.000"},{"art":"51","part":"ст.","title":"Полоса Bus Lane","desc":"Разметка Bus Lane обозначает специальную полосу для автобусов. Водители “не автобусов” могут двигаться по этой полосе, если не создают помеху автобусам, в тоже время водители автобусов обязаны двигаться только по этой полосе, если такая имеется.","note":"","cat":"Разметка и знаки","fine":"штраф до $5.000"},{"art":"52","part":"ст.","title":"Разметка No Parking и Keep Clear","desc":"Разметка надписями No Parking и Keep Clear запрещает постановку любого транспорта в пределах разметки, кроме транспорта экстренных служб.","note":"Примечание: Цвет разметки может быть как желтый, так и белой.","cat":"Разметка и знаки","fine":"штраф до $9.000"},{"art":"53","part":"ст.","title":"Разделительная полоса","desc":"Разделительная полоса. Может выделятся конструктивно: бордюром и зелеными насаждениями, а также может выделяется желтой сплошной линией по контуру. Пересекать и двигаться по разделительной полосе запрещено.","note":"Примечание: разделительная полоса может выделяться одинарной желтой сплошной, двойной желтой сплошной и белой сплошной линиями.","cat":"Разметка и знаки","fine":"штраф до $8.000"},{"art":"55","part":"ст.","title":"Использование ТС без регистрации","desc":"Запрещается использование транспортного средства не прошедшее процедуру Государственного учета (актуальную регистрацию).","note":"","cat":"Регистрация ТС","fine":"штраф до 20.000$, лишение прав на управление соответствующим транспортным средством (в зависимости от типа транспортного средства, на котором совершено нарушение, в том числе: CDL B класс - Грузовой, CLD A класс - Тяжёлый транспорт, CLD M класc - На мотоцикл, CLD D класс - управление легковым автомобилем)"},{"art":"56","part":"ст.","title":"Управление без номерного знака","desc":"Управление транспортным средством без государственного регистрационного знака (номерного знака).","note":"Примечание: Управление транспортным средством без установленного государственного регистрационного знака (номерного знака), а равно с нечитаемыми, скрытыми или установленными с нарушением требований законодательства номерными знаками.","cat":"Регистрация ТС","fine":"штраф в размере от 10.000$ до 20.000$ с лишением прав на управление соответствующим транспортным средством (в зависимости от типа транспортного средства, на котором совершено нарушение, в том числе: CDL B класс - Грузовой, CLD A класс - Тяжёлый транспорт, CLD M класc - На мотоцикл, CLD D класс - управление легковым автомобилем)"},{"art":"65","part":"ст.","title":"Управление неисправным ТС","desc":"Водителю запрещено управлять транспортным средством в неисправном состоянии.","note":"","cat":"Техническое состояние","fine":"штраф до $4.000 и эвакуация транспортного средства на штрафстоянку"},{"art":"71","part":"ч. 1","title":"Непредъявление накладной на груз","desc":"Непредъявление накладной при перевозке коммерческого груза.","note":"","cat":"Грузовые перевозки","fine":"штраф от 30.000$ до 60.000$"}],"pk":[{"art":"1","part":"ст.","title":"Цели Процессуального кодекса","desc":"ч. 1. Защита прав и законных интересов лиц и организаций, потерпевших от правонарушений.\nч. 2. Защита личности от незаконного и необоснованного обвинения, осуждения, ограничения ее прав и свобод.","note":"","cat":"Общие принципы и доказательства"},{"art":"2","part":"ст.","title":"Законность при производстве по уголовным, административным, гражданским и иным делам","desc":"ч. 1. Суд, прокурор, сотрудники правоохранительных органов, а также другие лица, наделенные определенными правами и обязанностями, предусмотренными настоящим Кодексом, не вправе применять закон, противоречащий настоящему Кодексу.\nч. 2. Суд, прокурор, сотрудники правоохранительных органов, а также другие лица, наделенные определенными правами и обязанностями, предусмотренными настоящим Кодексом, установив в ходе производства по делу несоответствие закона или иного нормативного правового акта настоящему Кодексу, принимают решение в соответствии с настоящим Кодексом.\nч. 3. Определения суда, постановления судьи, следователя, прокурора должны быть законными, обоснованными и мотивированными.\nч. 4. Суд, прокурор, следователь обязаны мотивировать свои доводы. Так официальные ответы об отказе в принятии жалоб, заявлений, ходатайств, обращений, прошений должны содержать причины отказа. Официальные ответы уведомительного характера о ходе производства также должны содержать мотивированную часть о дальнейшем ходе дела.","note":"","cat":"Общие принципы и доказательства"},{"art":"3","part":"ст.","title":"Уважение чести и достоинства личности","desc":"ч. 1. Запрещаются осуществление действий и принятие решений, унижающих честь человека, а также обращение, унижающее его человеческое достоинство либо создающее опасность для его жизни и здоровья.\nч. 2. Никто не может подвергаться насилию, пыткам, другому жестокому или унижающему человеческое достоинство обращению.","note":"","cat":"Общие принципы и доказательства"},{"art":"4","part":"ст.","title":"Неприкосновенность жилища","desc":"ч. 1. Осмотр жилища производится только с согласия проживающих в нем лиц или на основании судебного акта.\nч. 2. Обыск жилища производится также при наличии судебного решения, судебного ордера, ордера Генерального Прокурора и его Заместителей. В исключительных случаях, когда обыск жилища не терпит отлагательства, указанные следственные действия могут быть произведены на основании решения сотрудника правоохранительных органов без ордера Генерального Прокурора, решения суда или судебного ордера. В этом случае сотрудники правоохранительных органов не позднее 1 часа с момента начала производства следственного действия уведомляет прокурора о производстве следственного действия.\nч. 3. Выдача ордеров на обыск нежилого помещения, является исключительной компетенцией суда, генерального прокурора, заместителя генерального прокурора. Обыск нежилого помещения и находящегося в нем имущества может быть произведен на основании ордера.","note":"","cat":"Общие принципы и доказательства"},{"art":"5","part":"ст.","title":"Тайна переписки, телефонных и иных переговоров, почтовых, телеграфных и иных сообщений","desc":"ч. 1. Ограничение права гражданина на тайну переписки, телефонных и иных переговоров, почтовых, телеграфных и иных сообщений допускается только на основании судебного акта.","note":"","cat":"Общие принципы и доказательства"},{"art":"6","part":"ст.","title":"Презумпция невиновности","desc":"ч. 1. Обвиняемый считается невиновным, пока его виновность в совершении правонарушения не будет доказана в предусмотренном настоящим Кодексом.\nч. 2. Подозреваемый или обвиняемый не обязан доказывать свою невиновность. Бремя доказывания обвинения и опровержения доводов, приводимых в защиту подозреваемого или обвиняемого, лежит на стороне обвинения.\nч. 3. Все сомнения в виновности обвиняемого, которые не могут быть устранены в порядке, установленном настоящим Кодексом, толкуются в пользу обвиняемого.\nч. 4. Обвинительный приговор не может быть основан на предположениях.\nПримечание: автоматически выданная запись в боло-розыске в полном объеме доказывает вину разыскиваемого. В данном случае обвиняемому необходимо будет доказать свою невиновность.","note":"","cat":"Общие принципы и доказательства"},{"art":"7","part":"ст.","title":"Свобода оценки доказательств","desc":"ч. 1. Судья, присяжные заседатели, прокурор, а также государственные служащие оценивают доказательства по своему внутреннему убеждению, основанному на совокупности имеющихся в деле доказательств, руководствуясь при этом законом и совестью.\nч. 2. Никакие доказательства не имеют заранее установленной силы.\nИсключение: автоматически выданная запись в боло-розыске.","note":"","cat":"Общие принципы и доказательства"},{"art":"8","part":"ст.","title":"Охрана прав и свобод человека и гражданина","desc":"ч. 1. Суд, прокурор, государственные служащие обязаны разъяснять подозреваемому, обвиняемому, потерпевшему, а также другим участникам расследования или судопроизводства, обязанности и ответственность и обеспечивать возможность осуществления этих прав.\nч. 2. При наличии достаточных данных о том, что потерпевшему, свидетелю или иным участникам расследования или судопроизводства, а также их близким родственникам угрожают убийством, применением насилия, правоохранительные органы принимают в пределах своей компетенции в отношении указанных лиц все меры безопасности которые возможно.\nч. 3. Суд, прокурор, государственные служащие обязаны немедленно освободить всякого незаконно задержанного, или лишенного свободы человека.\nч. 4. Лицо, в отношении которого в качестве меры пресечения избрано заключение под стражу, а также лицо, которое задержано по подозрению в совершении правонарушения, должно содержаться в условиях, исключающих угрозу его жизни и здоровью.\nч. 5. Органы государственной власти, должностные лица обязаны обеспечить каждому возможность ознакомления с документами и материалами, непосредственно затрагивающими его права и свободы, если иное не предусмотрено законом.","note":"","cat":"Общие принципы и доказательства"},{"art":"9","part":"ст.","title":"Право на обжалование процессуальных действий и решений","desc":"ч. 1. Действия (бездействие) и решения суда, прокурора могут быть обжалованы в порядке, установленном законодательством.\nч. 2. Каждый осужденный имеет право на пересмотр приговора вышестоящим судом.\nч. 3. Гражданин вправе обжаловать действия государственного служащего подав жалобу на сотрудника руководителю соответствующего ведомства. Руководитель вправе взыскать дисциплинарную, административную и уголовную ответственность со своего сотрудника и отменить решения вынесенные таким сотрудником.\nч. 4. Гражданин вправе обратиться с жалобой на государственного служащего в Офис Генерального прокурора, после чего инициируется прокурорская проверка в отношении сотрудника.\nч. 5. Гражданам дается 48 часа с момента задержания или вынесения наказания для обжалования действий государственного служащего, после чего решения вынесенные сотрудником правоохранительных органов вступают в законную силу.","note":"","cat":"Общие принципы и доказательства"},{"art":"10","part":"ст.","title":"Неприкосновенность личности","desc":"ч. 1. Никто не может быть задержан по подозрению в совершении правонарушения, арестован или заключен под стражу при отсутствии на то законных оснований, предусмотренных настоящим Кодексом. Раздел II. Доказательства и доказывание Глава II. Доказательства.","note":"","cat":"Общие принципы и доказательства"},{"art":"11","part":"ст.","title":"Доказательства","desc":"ч. 1. Доказательствами по делу являются любые сведения, на основе которых суд, прокурор в порядке, определенном настоящим Кодексом, устанавливает наличие или отсутствие обстоятельств, подлежащих доказыванию при производстве по делу, а также иных обстоятельств, имеющих значение для дела.\nч. 2 В качестве доказательств допускаются:\nа) показания подозреваемого, обвиняемого;\nб) показания потерпевшего, свидетеля;\nв) заключение и показания эксперта или специалиста;\nг) вещественные доказательства;\nд) протоколы следственных и судебных действий;\nе) иные документы;\nж) автоматически выданная запись в боло-розыске.","note":"","cat":"Общие принципы и доказательства"},{"art":"12","part":"ст.","title":"Недопустимые доказательства","desc":"ч. 1. Доказательства, полученные с нарушением требований настоящего Кодекса, являются недопустимыми. Недопустимые доказательства не имеют юридической силы и не могут быть положены в основу обвинения, а также использоваться для доказывания любого из обстоятельств.\nч. 2. К недопустимым доказательствам относятся:\nа) любая информация, полученная от задержанного в ходе допроса до того, как ему были зачитаны его права, даже если есть звуко или видеозапись где обвиняемый дает показания против себя.\nб) показания потерпевшего, свидетеля, основанные на догадке, предположении, слухе, а также показания свидетеля, который не может указать источник своей осведомленности;\nв) улики добытые незаконным путем, когда были нарушены положения действующих нормативно-правовых актов (изъятие орудия без ордера на обыск личного транспорта, изъятие незаконных вещей у лица с неприкосновенностью без судебного решения или ордера Генерального Прокурора о снятии неприкосновенности, информация, которая получена с нарушением порядка проведения конфиденциальной встречи и т.д.).","note":"","cat":"Общие принципы и доказательства"},{"art":"13","part":"ст.","title":"Доказывание","desc":"ч. 1. Доказывание состоит в собирании, проверке и оценке доказательств в целях установления всех обстоятельств по делу.","note":"","cat":"Общие принципы и доказательства"},{"art":"13.1","part":"ст.","title":"Обстоятельства, подлежащие доказыванию","desc":"ч. 1. В рамках расследования подлежат доказыванию:\nа) событие правонарушения (время, место, способ и другие обстоятельства совершения правонарушения);\nб) виновность лица в совершении правонарушения, форма его вины и мотивы;\nв) характер и размер вреда, причиненного правонарушением;\nг) обстоятельства, исключающие противоправность и наказуемость деяния;\nд) обстоятельства, смягчающие и отягчающие наказание;\nе) обстоятельства, которые могут повлечь за собой освобождение от ответственности и наказания;\nч. 2 Подлежат выявлению также обстоятельства, способствовавшие совершению правонарушения.","note":"","cat":"Общие принципы и доказательства"},{"art":"14","part":"ст.","title":"Правила оценки доказательств","desc":"ч. 1. Каждое доказательство подлежит оценке с точки зрения относимости, допустимости, достоверности, а все собранные доказательства в совокупности - достаточности для разрешения дела. Раздел III. Меры процессуального принуждения Глава III. Процесс задержания.","note":"","cat":"Общие принципы и доказательства"},{"art":"15","part":"ст.","title":"Задержание","desc":"ч. 1. Задержание - это мера кратковременного (на срок до 1 часа) лишения человека права на свободу, осуществляемая сотрудниками правоохранительных органов, сотрудниками специальных подразделений Национальной Гвардии, а также сотрудниками Weazel News в случаях, предусмотренных законом.\nПримечание к ст. 15: Ограничение свободы сотрудниками Weazel News не может превышать 15 минут до момента передачи сотрудникам силовых структур.","note":"","cat":"Задержание"},{"art":"16","part":"ст.","title":"Задержание подозреваемого","desc":"ч. 1. Лицо может быть задержано по подозрению в совершении правонарушения, за которое может быть назначено наказание в виде лишения свободы или иных санкций, предусмотренных законом.\nч. 2. Лицо может быть задержано при наличии хотя бы одного из следующих оснований:\nа) Когда лицо застигнуто в момент совершения правонарушения или непосредственно после его совершения, государственным служащим;\nб) Когда на подозреваемом или его одежде, при нем или в его жилище будут обнаружены явные следы правонарушения;\nв) Если имеется ордер, изданный в установленном законом порядке, указывающий на необходимость задержания этого лица;\nг) В соответствии с требованием, отданным Губернатором, вице-губернатором, генеральным прокурором, его заместителями или старшего прокурора;\nд) В соответствии с приказом, отданным Главой департамента национальной безопасности, его заместителями;\nе) Когда имеется ориентировка на транспортное средство или данное лицо;\nж) Если лицо находится в боло-розыске.\nч. 3. Если лицо находится в маске, капюшоне, шлеме либо ином предмете, скрывающем лицо, то уполномоченное должностное лицо имеет право потребовать снятия такого предмета с целью визуального установления личности. Отказ выполнить данное требование или отказ предъявить документы, удостоверяющие личность, влечёт за собой необходимость инициирования процедуры установления личности, порядок которой описан ниже:\nа) Надеть наручники на задержанного\nб) Разъяснить задержанному основания для установления личности\nв) Предпринять все законные меры для оперативного установления личности задержанного, включая обращение к базам данных, а так же досмотреть документы задержанного.\nг) Сверить лицо задержанного с фотороботом.\nд) Провести личный обыск задержанного, в случае обнаружения нелегальных предметов - провести процесс задержания регламентированный статьей 17 настоящего Кодекса.","note":"","cat":"Задержание"},{"art":"17","part":"ст.","title":"Порядок задержания правомочным лицом","desc":"ч. 1. Задержание лица при ведении следствия производится в следующей последовательности:\nа) Надеть наручники на подозреваемого;\nб) Предъявить свой документ удостоверяющий служебное положение, нашивку, жетон, служебный бейджик или иной идентификационный знак, подтверждающий принадлежность к органам государственной власти;\nв) На усмотрение сотрудника, проводящего задержание, провести первичный обыск;\nг) Разъяснить квалификацию правонарушения, инкриминируемой задержанному и зачитать правило Миранды для ознакомления задержанного со своими правами согласно\nч. 3 ст. 17, ст. 22 настоящего Кодекса;\nд) Провести идентификацию личности задержанного, проверку на предмет наличия его данных в базе федерального розыска и проверку на принадлежность задержанного к государственным органам;\nе) Доставить подозреваемого в полицейский участок, департамент шерифа, штаб-квартиру FIB или иное место следствия при необходимости (для проведения допроса, экспертизы и пр.);\nж) Реализовать права задержанного. В случае, если задержанный является государственным служащим, сотрудником Weazel News, уведомить уполномоченные органы о задержании согласно ст. 19 настоящего Кодекса; При необходимости посмотреть видеофиксацию задержанного, опровергающую законность выданного в автоматическом режиме боло-розыска, согласно обязанностям и нормам настоящего Кодекса;\nз) Произвести следственные действия (допрос, экспертиза и т.д.), если есть необходимость;\nи) Доставить задержанного в полицейский участок, департамент шерифа, штаб-квартиру FIB;\nч. 2. Задержание лица на основании ордеров производится в следующей последовательности:\nа) Надеть наручники на подозреваемого;\nб) Предъявить свой документ удостоверяющий служебное положение, нашивку, жетон, служебный бейджик или иной идентификационный знак, подтверждающий принадлежность к органам государственной власти;\nв) На усмотрение сотрудника, проводящего задержание, провести первичный обыск;\nг) Разъяснить основания задержания и зачитать правило Миранды для ознакомления задержанного со своими правами согласно\nч. 3 ст. 17, ст. 22 настоящего Кодекса;\nд) Разъяснить задержанному номер и название документа, являющегося основанием для задержания;\nе) Доставить подозреваемого в полицейский участок, департамент шерифа или штаб-квартиру FIB;\nж) Провести идентификацию личности задержанного и проверку на принадлежность задержанного к государственным органам;\nз) В случае, если задержанный является государственным служащим, сотрудником Weazel News или частным адвокатом с действительной лицензией частного адвоката, согласно ст. 19 вызвать его руководство, которое обязуется по первому требованию сотрудника, производящего задержание, прекратить с ним трудовые отношения.\nч. 3. Правило Миранды: \"Вы имеете право хранить молчание. Всё, что вы скажете, может и будет использовано против Вас в суде. Вы имеете право на один телефонный звонок. Также Вы имеете право на адвоката. Если вам необходим адвокат, он будет для Вас запрошен. Вы понимаете свои права?\" Примечание: После оглашения прав инициатор обязан удостовериться в их понимании задержанным. В случае получения утвердительного ответа повторное разъяснение не требуется. При отсутствии четкого подтверждения (молчание, уклончивый ответ или прямое заявление о непонимании) права разъясняются вторично, после чего инициатор обязан уведомить задержанного, что дальнейшее разъяснение производиться не будет.\nПримечание: допускается незначительное отклонение от шаблона, если обращение сохраняет все обязательные элементы в строгом порядке: - Право на хранение молчания; - Предупреждение о том, что всё сказанное может и будет использовано против задержанного в суде; - Право на один телефонный звонок; - Право на адвоката - Уведомление о том, что при необходимости адвокат будет запрошен.\nПримечание: в случае нарушения установленной процедуры оглашения прав Миранды, все показания, данные задержанным после такого оглашения, признаются недопустимыми доказательствами.\nч. 4. В случае если задержанный требует государственного адвоката, сотрудник обязан вызвать такового с помощью звонка на горячую линию Правительства. В случае принятия вызова адвокатом, процессуальный час замораживается до приезда адвоката. Если адвокат не приехал в течение 10 минут, то процедура задержания продолжается и право на адвоката считается реализованным.\nч. 4.1. В случае, если задержанный требует самостоятельно вызвать частного адвоката, сотрудник обязан предоставить ему возможность самостоятельно воспользоваться телефоном для вызова частного адвоката через приложение \"Адвокаты\" или раздел \"Контакты\".\nПримечание 1: В случае с частным адвокатом, процессуальный час замораживается до приезда адвоката. Если частный адвокат не приехал в течение 10 минут с момента окончания телефонного звонка, то процедура задержания продолжается и право на частного адвоката считается реализованным.\nПримечание 2: Если в течение 3 минут с момента обращения, осуществленного путем телефонного звонка, заявки через приложение \"Адвокаты\" либо вызова на горячую линию Правительства, не последовало ответа от адвоката, процедура задержания продолжается, а право на адвоката считается реализованным. Данное правило распространяется как в отношении вызова государственных, так и частных адвокатов.\nч. 5. Сотрудник обязан предоставить телефонный звонок длительностью не более 3-х минут, при этом сам сотрудник либо его напарник, обязан находится с человеком в непосредственной близости, дабы проконтролировать ход телефонного разговора и не допустить нежелательных последствий.\nПримечание: Первичный обыск производится с целью идентификации колющих, режущих орудий, огнестрельного оружия, наркотических веществ, взрывчатых элементов. Первичный обыск позволяет изымать огнестрельное оружие, колющие, режущие орудия, наркотические вещества, взрывчатые элементы. При необходимости разрешается смотреть документы задержанного.\nПримечание: Телефонный звонок, предоставляемый задержанному в соответствии с положениями части 5 настоящей статьи, предназначен исключительно для связи с его частным адвокатом, с которым задержанный заключил действительный устный договор в приложении на оказание юридических услуг. Предоставление телефонного звонка для иных целей или звонок лицам, не обладающим статусом адвоката, не допускается. В случае если задержанный заявляет о необходимости связаться с адвокатом, сотрудник обязан дать задержанному возможность реализовать данное право, путем предоставления возможности воспользоваться телефоном для вызова Адвоката через приложение \"Адвокаты\". Запрос задержанного на использование телефонного звонка для иных целей, неописанных в данном примечании, является основанием для отказа в предоставлении телефонного звонка.\nПримечание: В пунктах\nа) и\nб)\nч. 1 и\nч. 2 настоящей статьи, на усмотрение сотрудника, проводящего задержание, разрешено изменение последовательности.\nПримечание: В пунктах\nв) и\nг)\nч. 1 и пунктах в),\nг) и\nд)\nч. 2 настоящей статьи, на усмотрение сотрудника, проводящего задержание, разрешено изменение последовательности.","note":"","cat":"Задержание"},{"art":"17.1","part":"ст.","title":"Порядок действий сотрудников Weazel News при задержании","desc":"1. Ограничить свободу (наручники); 2. Вызвать сотрудника силовой структуры; 3. Передать задержанного и видеофиксацию нарушения.","note":"","cat":"Задержание"},{"art":"17.2","part":"ст.","title":"Передача задержанного сотрудниками Weazel News","desc":"При вызове по факту задержания на территории WN, прибывшие сотрудники силовых структур обязаны принять задержанного, изучить доказательства и продолжить процедуру задержания согласно ст. 17 ПК.","note":"","cat":"Задержание"},{"art":"18","part":"ст.","title":"Субъекты задержания","desc":"ч. 1. В процессе задержания участвуют:\nа) Сотрудник либо сотрудники правоохранительных органов при исполнении, которые осуществляют задержание и/или проявляют содействие задержанию при условии гласного волеизъявления инициатора задержания, подтверждающего согласие на участие каждого такого лица в качестве субъекта задержания;\nб) Задержанный, в отношении которого проводится задержание;\nв) Один прокурор - согласно принятому вызову или по собственной инициативе;\nг) Один адвокат - в случае необходимости оказания юридической помощи. Адвокат имеет право, на правах субъекта задержания, задать задержанному краткий вопрос о наличии такой необходимости;\nд) Руководство задержанного сотрудника государственных органов в соответствии со ст. 19 ч 1 настоящего Кодекса;\nе) До двух сотрудников USSS или FIB, если один из субъектов задержания обладает статусом неприкосновенности;\nж) Один сотрудник IB для проведения надзора;\nз) Сотрудники следующих отделов: Detective Bureau (Los Santos Police Department, Los Santos County Sheriff Department) и Criminal Investigation Department (Federal Investigation Bureau), с согласия упомянутых в пункте\nа) лиц, имеют право провести допрос задержанному. Указанные сотрудники могут, на правах субъекта задержания, запросить информацию о статьях, по которым было задержано лицо, и получить разрешение на проведение допроса-передачи задержания от упомянутых в пункте а лиц. В случае отказа сотрудники обязаны покинуть место проведения процессуальных действий.\nи) Один представитель руководства сотрудника либо сотрудников правоохранительных органов при исполнении, которые осуществляют задержание. В положении настоящего пункта в качестве представителя руководства понимается руководитель организации, в которой трудоустроен сотрудник инициирующий процесс задержания, а так же его заместители.\nк) До трех юристов (стажеров) Коллегии адвокатов, находящихся в сопровождении государственного адвоката, исключительно в целях наблюдения за ходом процессуальных действий и прохождения профессиональной практики.\nл) один уполномоченный сотрудник Emergency Medical Service при исполнении должностных обязанностей: по вызову посредством рации департамента от субъектов задержания, с целью проведения освидетельствования либо с целью оказания неотложной помощи.\nч. 2. Государственные служащие, в лице сотрудника либо сотрудников, проводящих процесс задержания, прокурора, адвоката и руководства, вправе потребовать от граждан и должностных лиц покинуть и/или отойти от места проведения задержания в случаях, предусмотренных настоящим кодексом. Лицо, которому выдвинуто такое требование, обязано исполнить его. Перечень ситуаций при которых сотрудник, проводящий задержание, прокурор, адвокат или руководство может выдвинуть данное требование: - Когда действия граждан или сотрудников государственных структур, не участвующих в задержании, могут воспрепятствовать ходу проведения процессуальных действий или отвлекать субъектов задержания; - Когда в ходе нахождения граждан или сотрудников государственных структур может стать известна информация, составляющая государственную или иную охраняемую законом тайну; - Когда разбирательства по задержанию проводятся в маленьком узком закрытом помещении.\nИсключение: норма неприменима к сотрудникам Офиса Генерального Прокурора, осуществляющих надзорную деятельность.\nПримечание: присутствие без совершения каких-либо активных действий не признается деянием, препятствующим производству расследования и задержанию.\nч. 3. В случае проведения государственным служащим задержания в закрытом помещении (комнате), именно то лицо которое изначально начало задержание в вышеуказанной комнате/помещении - имеет право распоряжаться ей до конца своего процесса задержания.\nч. 4. Юристы (стажеры), указанные в п. «к»\nч. 1 настоящей статьи, не имеют права активно вмешиваться в процессуальные действия, подавать ходатайства или перебивать участников процесса. В случае нарушения порядка или создания помех следствию, сотрудник, проводящий задержание, вправе потребовать от юристов покинуть место проведения задержания.\nПримечание: к участию в процессе задержания допускают лишь один адвокат, а также при необходимости лишь один прокурор и один представитель руководства задержанного.\nПримечание: не допускается замена субъектов задержания, указанных в пункте (В) настоящей статьи, за исключением случаев, когда ввиду особых обстоятельств не является возможным продолжение их деятельности.","note":"","cat":"Задержание"},{"art":"19","part":"ст.","title":"Уведомление о задержании","desc":"ч. 1. В случае если в процессе задержания установлено, что задержанный является государственным служащим, сотрудником Weazel News или частным адвокатом с действительной лицензией частного адвоката, сотрудник, проводивший задержание, обязан вызвать руководство задержанного (в случае с частным адвокатом Главу Коллегии Адвокатов или его заместителей) и сотрудника Офиса Генерального прокурора Штата San-Andreas. На время ожидания ответа указанных лиц, время задержания замораживается, но не более, чем на 15 минут. В случае ответа прокурора, время задержания замораживается до его приезда.\nПримечание 1: в случае если сотрудник Офиса Генерального прокурора не ответил на вызов в течение 15 минут с момента его направления, равно как и в случае невозможности прибытия, задержанный государственный служащий или сотрудником Weazel News, или частный адвокат с действительной лицензией частного адвоката, подлежит освобождению, а сотрудники, проводящие задержание обязаны обратиться в Офис Генерального прокурора в отношении задержанного лица в течении часа.\nПримечание 2: в случае невозможности прибытия руководителя задержанного, прокурор или лицо, производящее задержание, обязано в кратчайшее сроки уведомить руководство задержанного (в случае с частным адвокатом Главу Коллегии Адвокатов или его заместителей) о задержании подчинённого. В случае подтверждения вины подчинённого, руководство по первому требованию обязуется прекратить с ним трудовые отношения.\nПримечание 3: признание факта принадлежности задержанного к государственным органам может быть только путем идентификация его отношения к государственным органам через наличие бейджика, удостоверения, иного идентификационного знака, подтверждающего принадлежность к государственным органам, или подтверждения его личности через базу данных штата San-Andreas.\nПримечание 4: В случае, если у сотрудника, который проводит задержание нет доступа к рации департамента, он обязан запросить начальство, используя служебную рацию, и дождаться подтверждения запроса от сотрудников, имеющих доступ к рации департамента. На время ожидания ответа от сотрудников время ожидания замораживается, но не более, чем на 15 минут, включая время на ответ от сотрудника Офиса Генерального Прокурора.\nч. 2. По приезде руководства задержанного и сотрудника Офиса Генерального прокурора Штата San-Andreas, сотрудником, осуществившим задержание, должны быть представлены доказательства совершения правонарушения задержанным сотруднику Офиса Генерального прокурора и руководству задержанного. Сотрудник Офиса Генерального прокурора дает оценку правомерности задержания, устанавливает наличие противоправного деяния в действии (или противоправного бездействия) задержанного, а также избирает меру наказания по отношению к действиям задержанного. В случае, если сотрудник Офиса Генерального прокурора не признает наличия противоправного деяния в действии (или противоправного бездействии) задержанного или не согласен с решением сотрудника, осуществляющего задержание, задержанный сотрудник подлежит освобождению. Сотрудник, проводивший задержание, имеет право подать обращение в Офис Генерального прокурора.\nч. 3. В случае, если сотрудник Офиса Генерального прокурора признает наличие преступного деяния в действии (или преступном бездействии) задержанного и если в качестве наказания определено лишение свободы, руководство задержанного обязано прекратить с задержанным трудовые отношения. В случае назначения наказания в виде штрафа, прекращение трудовых отношений с задержанным не является обязательным, и решение об увольнении остается на усмотрение работодателя или сотрудника ОГП.\nч.4. Если задержанный был уволен из государственной организации во время задержания, вызов прокурора так же является обязательным.","note":"","cat":"Задержание"},{"art":"20","part":"ст.","title":"Основания освобождения подозреваемого","desc":"ч. 1. Подозреваемый подлежит освобождению по решению сотрудника проводившего задержание, допрос и(или) иного уполномоченного в соответствии с настоящим Кодексом лица, если:\nа) не подтвердилось подозрение в совершении правонарушения;\nб) за нарушение не предусмотрено меры наказания в виде лишения свободы;\nв) задержание признано незаконным, в том числе вследствие отсутствия предусмотренных\nч.2 ст. 16 настоящего кодекса оснований для его инициации;\nг) прошло больше 1 часа с момента задержания и не была избрана мера наказания;\nд) подозреваемый обладает статусом неприкосновенности;\nе) отсутствие допустимых и достаточных доказательств виновности лица, невозможность их представления, либо признание таковых недопустимыми.\nИсключение: пункту\nд) - за исключением случаев, когда незаконные действия несут непосредственную угрозу жизни и здоровья окружающим людям.\nч. 2. Течение срока, указанного в п. \"г\" приостанавливается в случаях:\nа) проведения допроса и экспертизы;\nб) вызова и разбирательства с адвокатом;\nв) вызова и разбирательства с Офисом Генерального прокурора и/или руководством задержанного в случае, если задержанный является сотрудником государственного органа, сотрудником Weazel News или частным адвокатом;\nг) вызова, ожидания и проведения освидетельствования сотрудником EMS;\nд) при обыске имущества задержанного;\nе) при просмотре видеофиксации от задержанного, в случае если лицо было задержано на основании пункта 3\nч.2 ст. 16 настоящего кодекса. Течение срока на просмотр таковой записи приостанавливается максимум на 10 минут.","note":"","cat":"Задержание"},{"art":"21","part":"ст.","title":"Порядок исполнения штрафных санкций","desc":"ч. 1. В случае назначения административного или уголовного штрафа, лицо обязано произвести его оплату в порядке, установленном законодательством штата.\nч. 2. В случае если у лица, в отношении которого вынесено решение о мере наказания в виде штрафа, отсутствует при себе достаточная сумма денежных средств, сотрудник, вынесший решение о мере наказания в виде штрафа, обязан:\nа) сопроводить гражданина к ближайшему банкомату или банковскому отделению для снятия наличных средств с личного счета для оплаты штрафа;\nб) удостовериться, что гражданин произвел оплату штрафа и зафиксировать факт оплаты в установленном порядке.","note":"","cat":"Задержание"},{"art":"22","part":"ст.","title":"Права задерживаемого","desc":"ч. 1. У подозреваемого имеются следующие права:\nа) Подозреваемый имеет право на один телефонный звонок в присутствии сотрудника до начала процесса ареста, сотрудник обязан предоставить телефонный звонок задержанному по его запросу. Длительность звонка не должна превышать 3-х минут;\nб) Подозреваемый имеет право на адвоката;\nв) Подозреваемый имеет право сохранять молчание;\nг) Подозреваемый имеет право возбуждать ходатайства, а также заявлять отводы;\nд) Подозреваемый вправе требовать конфиденциальной встречи с адвокатом, длительность которой не превышает 10 минут.","note":"","cat":"Задержание"},{"art":"23","part":"ст.","title":"Обязанности государственного служащего выполняющего задержание","desc":"ч. 1. Государственный служащий, выполняющий задержание обязан:\nа) Вести видеозапись задержания;\nб) Разъяснить адвокату, прокурору причины задержания;\nв) Разъяснить адвокату и, в случае, предусмотренном ст. 19 настоящего Кодекса, руководству причины задержания, а также по требованию - предоставить доказательства совершенного правонарушения;\nг) В случае задержания лица по автоматически созданной записи в боло-розыске, сотрудник обязан приобщить к делу доказательства задержанного, если последний заявляет о наличии материалов, которые, по его утверждению, подтверждают невиновность в совершении преступления, зафиксированного в базе.\nИсключение: В случаях, если видеофиксация хранится на удаленных серверах и в связи с этим нет возможности ее незамедлительного предоставления, процесс предоставления видеофиксации может занимать до 1 часа. ГЛАВА IV. Меры административного принуждения.","note":"","cat":"Задержание"},{"art":"24","part":"ст.","title":"Меры процессуального принуждения при административных правонарушениях","desc":"ч. 1. К мерам процессуального принуждения, применяемым в отношении лица и (или) его имущества при производстве по делу об административном правонарушении, относятся:\nа) доставление лица;\nб) задержание;\nв) изъятие вещей и документов;\nг) помещение транспортного средства на специализированную стоянку (эвакуация);\nд) административный арест;\nе) иные меры, предусмотренные настоящим Кодексом и Административным кодексом штата San-Andreas;\nч. 2. Административный арест\n– это разновидность административного наказания, заключающаяся в содержании лица, совершившего административное правонарушение, которое предусматривает лишение свободы не более 20 суток (20 минут), в условиях изоляции от общества. Административному аресту подвергаются лица, совершившие правонарушения, предусмотренные Административным кодексом, если в качестве меры наказания избрано ограничение свободы.","note":"","cat":"Административные меры и арест"},{"art":"25","part":"ст.","title":"Порядок взаимодействия с лицом при привлечении к административной ответственности","desc":"ч. 1. При взаимодействии с лицом, привлекаемым к административной ответственности, сотрудник правоохранительных органов обязан:\nа) Представиться;\nб) Объяснить причину кратковременного ограничения свободы действий;\nв) Потребовать любой документ, удостоверяющий личность, а также иные необходимые документы.\nПримечание: За отказ предоставить документы или отсутствие реакции на их требование лицо подвергается процессу установки личности.\nг) При необходимости доставить лицо до ближайшего банкомата;\nд) Применить штрафные санкции и (или) иные меры, предусмотренные действующим законодательством.\nч. 2. Если в ходе следственных действий будет доказана вина задержанного, то сотрудником правоохранительных органов после задержания должен быть произведен арест лица в следующей последовательности:\nа) Совершить вторичный обыск;\nб) Изъять все нелегальные предметы у гражданина, подвергнутого аресту;\nв) Установить соответствующий уровень боло-розыска в соотношении 10 суток к 1 уровню;\nг) Разъяснить задержанному причину ареста;\nд) Поместить его в КПЗ на срок, установленный кодексом об административных правонарушениях.\nч. 3. Сотрудники правоохранительных органов, находящиеся под прикрытием (оперативное внедрение), после задержания подозреваемого обязаны передать его уполномоченным лицам.\nч. 4. Лицо, в отношении которого применяются меры процессуального принуждения, обязано подчиняться законным требованиям сотрудника. В случае оказания сопротивления допускается применение мер, предусмотренных настоящим Кодексом. Глава V. Процесс ареста.","note":"","cat":"Административные меры и арест"},{"art":"26","part":"ст.","title":"Арест","desc":"ч. 1. Арест\n– это разновидность уголовного наказания, при котором лицо лишается права на свободу на срок от 1 года. Аресту подвергаются лица, совершившие преступление, предусмотренное особенной частью Уголовного Кодекса - статьями региональной, федеральной, финансовой или военной юрисдикции.\nч. 2. В случае, если гражданину вменяется несколько преступлений, наказание в виде лишения свободы назначается в соответствии со статьей 5.2 УК СА.","note":"","cat":"Административные меры и арест"},{"art":"27","part":"ст.","title":"Порядок ареста","desc":"ч. 1. Порядок ареста проводится строго в следующем порядке:\nа) Совершить вторичный обыск;\nб) Изъять все нелегальные предметы у гражданина, подвергнутого аресту;\nв) Установить соответствующий уровень боло-розыска в соотношении 1 год к 1 уровню;\nг) Разъяснить задержанному причину ареста;\nд) Поместить его в КПЗ на срок, установленный уголовным кодексом\nч. 2. Сотрудники правоохранительных органов, находящиеся под прикрытием (оперативное внедрение), после задержания подозреваемого, обязаны передать его уполномоченным лицам. Глава VI. Обыск.","note":"","cat":"Административные меры и арест"},{"art":"29","part":"ст.","title":"Личный обыск и личный досмотр","desc":"ч. 1. Подозреваемый может быть подвергнут личному обыску только во время задержания и (или) ареста, либо в случае, если у уполномоченного лица имеется подозрение о наличии у гражданина запрещенных предметов, веществ, опасных для окружающих при нахождении на территории государственного органа.\nч. 2. Граждане могут быть подвергнуты личному досмотру при пересечении границы (контрольно-пропускных пунктов) мест дислокации войск национальной гвардии.\nч. 3. Граждане могут быть подвергнуты личному досмотру по требованию сотрудников Секретной Службы при посещении здания Капитолия и зала Суда г.Лос-Сантос, а также в случае нахождения в непосредственной близости к охраняемому сотрудниками Секретной Службы лицу.\nПримечание: Сотрудники Секретной Службы не вправе требовать у государственных служащих при исполнении ими должностных обязанностей, а также неприкосновенных лиц прохождения личного досмотра при посещении здания Капитолия и зала Суда г.Лос-Сантос.\nч. 4. Подозреваемый может быть подвергнут личному обыску сотрудниками правоохранительных и военных органов в случае, если он находится в боло-розыске.\nч. 5. Требования прохождения личного досмотра в иных случаях, чем предусмотрены настоящей статьёй, являются незаконными.\nч. 6. Вторичный обыск - это урегулированное уголовно-процессуальным правом, обеспеченное государственным принуждением действие, заключающееся в непосредственном обследовании тела обыскиваемого, в том числе находящейся на нем одежды и при нем — ручной поклажи в целях нахождения и изъятия предметов, имеющих значение для уголовного дела, а также свидетельств их принадлежности конкретному лицу. В процессе ареста при вторичном обыске должны быть изъяты все нелегальные предметы, нелегальные биоресурсы, найденные в ходе вторичного обыска у задержанного, а также колющие, режущие предметы, огнестрельное оружие, спец. средства, боеприпасы, независимо от законности хранения данных предметов.\nч. 7. Если служебная собака среагировала на гражданина, указав на возможное наличие при нём запрещённых веществ или предметов (в том числе посредством поведенческой реакции на запах), это является самостоятельным законным основанием для проведения личного обыска.","note":"","cat":"Обыск, видеофиксация, залог"},{"art":"30","part":"ст.","title":"Обыск и осмотр транспортного средства","desc":"ч. 1. Осмотр транспортного средства — визуальное обследование транспортного средства, его внешних поверхностей, регистрационных знаков, пломб и доступной для наблюдения части груза без вскрытия закрытых отсеков, перемещения вещей и проникновения внутрь транспортного средства.\nч. 2. Осмотр транспортного средства допускается:\nа) при наличии ориентировки или иной официальной информации об использовании транспортного средства либо груза в противоправных целях;\nб) при выявлении признаков административного правонарушения или преступления;\nв) при проведении контрольной проверки коммерческого грузового транспортного средства в соответствии с Дорожным кодексом;\nг) при дорожно-транспортном происшествии.\nч. 3. Осмотр не предоставляет права вскрывать закрытые грузовые отсеки, багажники, контейнеры, упаковки и иные места хранения.\nч. 4. Обыск транспортного средства — процессуальное действие, включающее обследование салона, багажника, грузового отсека, перевозимого груза и иных мест хранения, в том числе с открытием запирающих устройств и перемещением предметов.\nч. 5. Обыск транспортного средства допускается:\nа) при выявлении конкретных и объективно зафиксированных признаков нарушения Уголовного кодекса, связанного с транспортным средством, водителем или перевозимым грузом;\nб) на основании ордера, решения суда, постановления Генерального прокурора или его заместителя в пределах их полномочий;\nв) в отношении транспортного средства, прямо указанного в материалах дела, делопроизводстве, судебном акте или законно авторизованном ордере;\nг) при наличии непосредственной угрозы жизни и здоровью людей, если промедление создает опасность наступления тяжких последствий.\nч. 6. До начала обыска сотрудник обязан назвать водителю основание обыска и зафиксировать его на непрерывной видеозаписи.\nч. 7. При обыске сотрудник обязан ограничиться местами, в которых с учетом характера предполагаемого нарушения могут находиться разыскиваемые предметы, документы или груз.\nч. 8. Обнаруженные и изъятые предметы должны быть перечислены на видеозаписи. По требованию владельца ему предоставляется возможность ознакомиться с перечнем изъятого.\nч. 9. Вскрытие транспортного средства с повреждением запирающих устройств допускается только при отказе предоставить доступ, отсутствии владельца либо наличии неотложной угрозы. Причина и причиненные повреждения подлежат фиксации.\nч. 10. Доказательства, полученные при отсутствии предусмотренного настоящей статьей основания либо без обязательной видеофиксации, признаются недопустимыми в соответствии со статьей 12 настоящего Кодекса. Глава VII. Иные меры процессуального принуждения.","note":"","cat":"Обыск, видеофиксация, залог"},{"art":"31","part":"ст.","title":"Основания применения иных мер процессуального принуждения","desc":"ч. 1. В целях обеспечения установленного настоящим Кодексом порядка судопроизводства, надлежащего исполнения приговора прокурор или суд вправе применить к подозреваемому или обвиняемому следующие меры процессуального принуждения:\nа) обязательство о явке;\nб) привод;\nв) временное отстранение от должности;\nч. 2. В случаях, предусмотренных настоящим Кодексом, прокурор или суд вправе применить к потерпевшему, свидетелю, гражданскому истцу, гражданскому ответчику, эксперту, специалисту, переводчику и (или) понятому следующие меры процессуального принуждения:\nа) обязательство о явке;\nб) привод;\nв) денежное взыскание. Раздел IV. Иные положения Глава VIII. Фото и видео фиксация.","note":"","cat":"Обыск, видеофиксация, залог"},{"art":"32","part":"ст.","title":"Ведение фото- и видеофиксации при пресечении правонарушений и производстве процессуальных действий","desc":"ч. 1. При пресечении правонарушений, а равно при производстве процессуальных действий по фактам таких правонарушений, уполномоченный государственный служащий и его напарник обязаны осуществлять непрерывную видеозапись действий участников, фактических обстоятельств происходящего и иных сведений, имеющих значение для производства по делу или любых других процессуальных действий.\nч. 2. Видеозапись осуществляется техническими средствами, обеспечивающими возможность последующего воспроизведения изображения и звука, а также установления последовательности действий и лиц, участвующих в событии.\nч. 3. Сотрудник Офиса Генерального прокурора ведет видеозапись процессуальных действий, совершаемых при рассмотрении материалов дела при задержании государственного служащего.","note":"","cat":"Обыск, видеофиксация, залог"},{"art":"33","part":"ст.","title":"Хранение материалов фото- и видеофиксации","desc":"ч. 1. Материалы фото и видеофиксации, полученные при пресечении правонарушений либо в ходе процессуальных действий, подлежат хранению на защищенных серверах государственного органа, в котором служит уполномоченный сотрудник, либо на ином носителе информации в течение 48 часов с момента окончания записи, если иные сроки хранения не установлены настоящим Кодексом.\nч. 2. В случае поступления искового заявления в суд, обращения в Офис Генерального прокурора, заявления о преступлении или о правонарушении государственный служащий не вправе уничтожать, изменять, удалять или иным способом ограничивать сохранность или доступ к материалам фото- и видеофиксации, относящимся к проверяемому событию, на весь период производства по обращению в Офис Генерального прокурора, проведения проверки сообщения о правонарушении, предварительного расследования либо судебного разбирательства.\nч. 3. После принятия обращения к производству, начала проверки сообщения о правонарушении, либо возбуждения уголовного дела, дела об административном правонарушении уполномоченный сотрудник правоохранительного органа уведомляет об этом государственного служащего, в отношении которого подано такое обращение, сообщение или возбуждено дело, любыми предусмотренными законом способами.\nч. 4. После принятия искового заявления в отношении государственного служащего к производству, суд уведомляет об этом государственного служащего любыми предусмотренными законом способами. Глава IX. Выпуск граждан под залог.","note":"","cat":"Обыск, видеофиксация, залог"},{"art":"34","part":"ст.","title":"Выпуск под залог","desc":"ч. 1. Граждане имеют право выйти под залог, сумма которого регулируется сотрудниками правоохранительных органов, но не менее 25.000$.\nч. 2. За каждый уровень розыска стоимость выхода под залог увеличивается на 25.000$ ((+25.000$ за каждую ★)) Глава X. Подследственность и Компетенция.","note":"","cat":"Обыск, видеофиксация, залог"},{"art":"35","part":"ст.","title":"Компетенция","desc":"Компетенция — это установленный законом, нормативным актом или внутренним регламентом объём прав, обязанностей и полномочий, предоставленных конкретному органу, должностному лицу или организации в рамках определённых правоотношений.\nч. 1 Компетенция определяет: - Место органа или должностного лица в системе государственной и административной власти; - Круг вопросов, по которым орган или должностное лицо вправе действовать; - Пределы полномочий в рамках допустимых процедур и задач.\nч. 2 Процессуальные действия, совершаемые органами или должностными лицами вне их установленной компетенции, запрещаются, если иное не предусмотрено настоящим Кодексом.\nИсключение: Одобрен запрос на предоставление компетенции от уполномоченного органа и уполномоченного лица на проведение предварительное следствия, следствия и иных процессуальных действий.\nч. 3 Получение доступа к полномочиям, выходящим за пределы установленной компетенции: 1. Сотрудники региональных правоохранительных органов вправе на отработку статей, относящихся к федеральной компетенции, только по одобрению запроса старшим составом Федерального Расследовательского Бюро. 2. Сотрудники федеральных ведомств вправе на отработку статей региональной компетенции только по одобрению запроса старшим составом регионального органа. 3. Сотрудники федеральных и региональных ведомств вправе на отработку статей военной компетенции только по одобрению запроса старшим составом военного органа. 5. Сотрудники федеральных и региональных ведомств вправе на отработку статей финансовой компетенции только по одобрению запроса старшим составом Секретной Службы Соединенных Штатов Америки.\nч. 4 Сотрудники ведомств, не обладающих установленной компетенцией по конкретным статьям, обязаны направить запрос на проведение процессуальных действий в уполномоченный орган либо уполномоченному должностному лицу, обладающему правом делегирования компетенции.\nч. 5 Такой запрос может быть направлен до начала предварительного следствия, следствия и иных процессуальных действий или в процессе их осуществления, при условии обязательного уведомления и последующего получения разрешения в установленном порядке.\nПримечание: отсутствие предварительного либо последующего разрешения исключает возможность проведения процессуальных действий по статье, находящейся вне компетенции запрашивающего ведомства. Такие действия являются недопустимыми.\nч. 6 Сотрудники Офиса Генерального Прокурора имеют право на проведение предварительного следствия, следственных и иных процессуальных действий на территории всего штата San-Andreas, вне зависимости от категории уголовной или административной статьи в рамках своих полномочий.\nПримечание: Сотрудникам Офиса Генерального Прокурора недопустимо использование наручников и иных специальных средств при проведении процессуальных действий, а равно самостоятельно инициировать задержание с использованием силы или специальных средств.","note":"","cat":"Компетенция и применение силы"},{"art":"36","part":"ст.","title":"Компетенция ведомств","desc":"ч. 1. Предварительное следствие, следствие и иные процессуальные действия органов исполнительной власти осуществляются в зависимости от категории статьи, установленной уголовным кодексом, и разделяются по ведомственной компетенции: [Региональная] — осуществляется региональными правоохранительными органами штата San-Andreas при расследовании преступлений, не затрагивающих интересы федерального уровня. [Федеральная] — осуществляется Федеральным Расследовательским Бюро и Секретной Службой США по делам, отнесённым к юрисдикции федеральных органов. [Финансовая] — осуществляется Секретной Службой США по делам, связанным с финансовыми преступлениями, нарушениями в банковской сфере, подделкой валюты и операциями, представляющими угрозу финансовой стабильности штата. [Военная] — осуществляется Национальной Гвардией штата San-Andreas по делам, связанным с военнослужащими, военными объектами либо в пределах территории военного значения.\nПримечание: В случае наличия смешанной компетенции, сотрудники соответствующих ведомств вправе осуществлять совместное предварительное следствие, следствие и иные процессуальные действия в пределах предоставленных полномочий.\nИсключение: Секретная Служба Соединённых Штатов Америки обладает исключительным правом доступа к компетенции любого ведомства.\nИсключение: При отсутствии лица на должности действующего Директора Федерального Расследовательского Бюро, сотрудники региональных правоохранительных органов вправе самостоятельно осуществлять предварительное следствие, следствие и процессуальные действия по статье 7.1 Уголовного Кодекс без необходимости получения разрешения от федеральных органов. Глава XI. Стадии применения силы.","note":"","cat":"Компетенция и применение силы"},{"art":"37","part":"ст.","title":"Стадии применения силы","desc":"ч. 1. Стадии применения силы - стандарты, классифицирующие допустимый уровень применения силы в отношении нарушителей законодательства штата SA, со стороны государственного служащего.\nПримечание: Каждый государственный служащий обязан опираться на стадии применения силы и на процессуальный кодекс при прямом взаимодействии с лицом. Каждый сотрудник, применяющий определённую стадию силы должен отдавать отчётность своим действиям, а также быть готовым к тому, что ненадлежащее исполнение своих обязанностей приведёт к уголовной ответственности. Все стадии применения силы должны соблюдаться в строгом иерархическом порядке от первой до пятой.\nИсключение: В случае когда государственный служащий стал свидетелем правонарушения, сотруднику разрешается игнорировать первую, вторую и третью стадии применения силы и перейти сразу к четвертой; если сотрудникам гос. структур или гражданским лицам угрожает опасность, большое скопление вооруженных людей, в таком случае можно предпринять пятую стадию без предшествующих стадий.\nч. 2. Законодательство предусматривает пять стадий применения силы:\nа) Первая стадия - Присутствие;\nб) Вторая стадия - Приказ;\nв) Третья стадия - Применение физической силы;\nг) Четвертая стадия - Применение специальных средств;\nд) Пятая стадия - Применение огнестрельного оружия.\nПримечание: Присутствие государственного служащего при исполнении своих служебных обязанностей. В некоторых ситуациях, одного присутствия будет достаточно для выполнения законных требований и прекращения мелких правонарушений. В зависимости от обстановки и количества лиц в определенном месте, этот уровень применения силы может потребовать присутствия нескольких государственных служащих для полного контроля ситуации. В некоторых ситуациях расстегивание сотрудником силовой структуры кобуры и даже извлечение им оружия или спецсредств подпадают под этот уровень применения силы. При стадии присутствия, а также при последующих стадиях, сотрудник должен иметь идентификационные знаки и предъявлять их при первом гласном обращении к лицу и если его идентификация помогает делу в котором он несёт непосредственное участие. Если первой стадии недостаточно, опираясь на ситуацию, сотрудник может применять вторую стадию.\nПримечание: Требования либо распоряжения, исходящие от государственных служащих, должны быть исполнимыми и законными, то есть их возможность должна быть предусмотрена существующими законодательными актами. Кроме того, требования государственных служащих должны иметь в качестве цели - охрану общественного порядка и обеспечение общественной безопасности. Государственный служащий имеет право дополнять свои распоряжения предупреждениями о последствиях за неисполнение законных требований. Если второй стадии недостаточно, опираясь на ситуацию, сотрудник может применять третью стадию.\nПримечание: применение физической силы считается стадией, при которой государственный служащий использует физическое воздействие в сторону лица. К этой стадии относятся заламывание рук, удержание гражданина на месте с применением силы. Также сюда же может относиться применение дубинок и слезоточивых аэрозолей. Если третьей стадии недостаточно, опираясь на ситуацию, сотрудник может применять четвертую стадию.\nПримечание: применение специальных средств считается стадией, при которой государственный служащий использует спец. средства в сторону лица. К этой стадии относится применение наручников, электрошоковых устройств, резиновых пуль. В некоторых ситуациях к этой стадии может относиться применение дубинок и слезоточивых аэрозолей. Запрещено использовать спец. средство, как меру предупреждения (предупредительные выстрелы/удары запрещены). Государственный служащий может применить специальные средства в отношении лица, способные нанести ущерб его здоровью, лишь в том случае, когда применение иных специальных средств невозможно. Если четвёртой стадии недостаточно, опираясь на ситуацию, сотрудник может применять пятую стадию.\nПримечание: применение огнестрельного оружия считается стадией, при которой государственный служащий использует оружие в сторону лица. Под этой стадией воздействия применяется огнестрельное оружие, автомобиль или любое подручное оружие, обладающее необходимыми свойствами. На этой стадии очень вероятно причинение смерти или нанесение тяжкого вреда здоровью лица. Если сотрудник применяет огнестрельное оружие, он обязан использовать его строго по назначению, предупредительные выстрелы запрещены. Запрещено применять огнестрельное оружие при значительном скоплении граждан, если в результате его применения могут пострадать случайные лица. Не запрещено использовать оружие для остановки транспортного средства путем его повреждения, если управляющее им лицо отказывается выполнить неоднократные требования сотрудника, а также для разрушения запирающих устройств, элементов и конструкций препятствующих проникновению в жилые и иные помещения. Глава XII. Федеральный розыск и боло-розыск.","note":"","cat":"Компетенция и применение силы"},{"art":"38","part":"ст.","title":"Федеральный розыск","desc":"ч. 1. Федеральный розыск - комплекс мер, направленный на установление местонахождения определенного человека, скрывающегося от правоохранительных органов, следствия, суда, а также без вести пропавших граждан на территории Штата San-Andreas.\nч. 2. Объявлять лицо в федеральный розыск разрешено за нарушение Уголовного кодекса Штата San-Andreas.\nч. 3. Лица объявляются в федеральный розыск на основании выданного ордера или решения суда.\nч. 4. Объявлять в федеральный розыск за нарушение УК СА имеют права следующие лица:\nа) Генеральный прокурор, Заместитель Генерального прокурора\nб) Судьи.\nч. 5. Объявлять лицо, пропавшее без вести, в федеральный розыск имеют право все лица, перечисленные в\nч.4 настоящей статьи.\nПримечание: при необходимости объявить кого-либо в Федеральный розыск государственный служащий направляет соответствующее ходатайство на имя Генерального прокурора или его заместителя.\nч. 6. Сотрудник государственных силовых органов при проведения ареста граждан, находящихся в федеральном розыске, обязаны после проведения процессуальных действий незамедлительно, в срок до 3 часов, оставить отчет об аресте лица, находившегося в фед. розыске в специализированном канале связи сотрудников государственных органов.","note":"","cat":"Розыск и реабилитация"},{"art":"39","part":"ст.","title":"Боло-розыск","desc":"ч. 1. Боло-розыск - комплекс мер, направленный на установление местонахождения определенного человека, скрывающегося от правоохранительных органов, следствия, суда на территории штата San-Andreas.\nч. 2. Выделяются 5 уровней (звезд) боло-розыска. Уровень боло-розыска устаналивается в зависимости от тяжести совершенного правонарушения или по подозрению в совершении такового, пропорционально возможной мере наказания в виде лишения свободы в соотношени 1 год к 1 звезде.\nч. 3. Для эффективности поиска лиц находящихся в федеральном розыске разрешается объявлять таковых в боло-розыск. При объявлении лица в боло-розыск находящегося в федеральном розыске, разрешается сразу устанавливать 5 уровень общественной опасности\nч. 4. Объявлять в боло-розыск за нарушение действующего законодательства могут сотрудники Полицейского Департамента г.Лос-Сантоса, Департамента Шерифа о.Блейн, Федерального Расследовательского Бюро, Секретной Службы США, Офиса Генерального Прокурора, а также Судьи всех категорий.\nч. 5. Государственным служащим уполномоченным объявлять в федеральный розыск разрешается вносить таковых в боло-розыск.\nч. 6. В случае внесения в боло-розыск лиц по ордеру/решению суда разрешается установить сразу последний уровень общественной опасности\nч. 7. Лицо может быть вынесено из боло-розыска сотрудниками Офиса Генерального Прокурора путем предоставления видеофиксации своей невиновности, сотрудниками LSPD/LSCSD/FIB/USSS в случае когда в результате проведения расследования сотрудниками государственных органов была установлена невиновность лица, а также государственным адвокатом в случае когда в результате защиты была установлена его невиновность и процессуальные действия были прекращены. Глава XIII. Юридическая реабилитация.","note":"","cat":"Розыск и реабилитация"},{"art":"40","part":"ст.","title":"Юридическая реабилитация","desc":"ч. 1. Граждане имеют право на юридическую реабилитацию, обратившись в судебные или другие уполномоченные инстанции.\nч. 2. Губернатор устанавливает перечень лиц, уполномоченных на проведение юридических реабилитаций.\nч. 3. Стоимость юридической реабилитации составляет: 150.000$\nч. 4. 50.000$ от суммы юридической реабилитации направляется на финансирование работы сотрудника, который снимает судимость.\nч. 5. 100.000$ от суммы судебной пошлины за юридическую реабилитацию направляется в казну штата San-Andreas. Глава XIV. Ходатайства и жалобы.","note":"","cat":"Розыск и реабилитация"},{"art":"41","part":"ст.","title":"Лица, имеющие право заявить ходатайство","desc":"ч. 1. Подозреваемый, обвиняемый, его защитник, потерпевший, его законный представитель и представитель, частный обвинитель, эксперт, гражданский истец, гражданский ответчик, их представители, представитель администрации организации и иное лицо, права и законные интересы которых затронуты в ходе досудебного или судебного производства, вправе заявить ходатайство о производстве процессуальных действий или принятии процессуальных решений для установления обстоятельств, имеющих значение для дела, обеспечения прав и законных интересов лица, заявившего ходатайство, либо представляемых им лица или организации.\nч. 2. Ходатайство заявляется в орган-(ы), осуществляющий следствие, либо в суд.\nч. 3. Правом заявлять ходатайство в ходе судебного разбирательства обладает также государственный обвинитель.","note":"","cat":"Ходатайства и обжалование"},{"art":"42","part":"ст.","title":"Заявление ходатайства","desc":"ч. 1. Ходатайство может быть заявлено в любой момент производства по делу.\nч. 2. Отклонение ходатайства не лишает заявителя права вновь заявить ходатайство.","note":"","cat":"Ходатайства и обжалование"},{"art":"43","part":"ст.","title":"Сроки рассмотрения и разрешение ходатайства","desc":"ч. 1. Ходатайство подлежит рассмотрению и разрешению непосредственно после его заявления. В случаях, когда немедленное принятие решения по ходатайству, заявленному в ходе предварительного расследования, невозможно, оно должно быть разрешено не позднее 3 суток со дня его заявления.\nч. 2. Об удовлетворении ходатайства либо о полном или частичном отказе в его удовлетворении уполномоченный сотрудник органа, осуществляющего следствие, судья выносят постановление. Решение по ходатайству может быть обжаловано в вышестоящую инстанцию суда или вышестоящему уполномоченному сотруднику органа, осуществляющего следствие или в Офисе Генерального Прокурора.","note":"","cat":"Ходатайства и обжалование"},{"art":"44","part":"ст.","title":"Право обжалования","desc":"ч. 1. Действия (бездействие) и решения следователя, прокурора и суда могут быть обжалованы в установленном настоящим Кодексом порядке участниками судопроизводства, а также иными лицами в той части, в которой производимые процессуальные действия и принимаемые процессуальные решения затрагивают их интересы.","note":"","cat":"Ходатайства и обжалование"},{"art":"45","part":"ст.","title":"Порядок рассмотрения обращения прокурором или следователем","desc":"ч. 1. В случае, если обжалуется действие (бездействие) и/или решения служащих, осуществляющих следствие, служащего офиса генерального прокурора, то участник судопроизводства вправе подать обращение вышестоящему сотруднику органа следствия и(или) Офиса Генерального Прокурора (во время досудебного или судебного производства) или в суд (во время судебного производства).\nч. 2. В случае подачи обращения в Офис Генерального Прокурора и(или) иной орган следствия в соответствии с\nч.1 ст.45 текущего Кодекса, сотрудник Офиса Генерального Прокурора и(или) следователь, назначенный на рассмотрение обращения, обязан рассмотреть обращение в течение 1 дня с момента начала рассмотрения такового. В исключительных случаях, когда для проверки обращения необходимо истребовать дополнительные материалы либо принять иные меры, допускается рассмотрение обращения в срок до 3 суток. По результатам рассмотрения обращения, служащий Офиса Генерального Прокурора и(или) следователь выносит постановление о полном или частичном удовлетворении требований обращения либо об отказе в его удовлетворении.\nч. 3. Если жалоба подана в суд во время судебного производства, то суд в течении 3 суток рассматривает жалобу и выносит мотивированное постановление или определение о полном или частичном удовлетворении жалобы либо об отказе в ее удовлетворении. Глава XV. Следствие.","note":"","cat":"Ходатайства и обжалование"},{"art":"46","part":"ст.","title":"Следствие","desc":"ч. 1. Следствие - это комплекс мер по выяснению обстоятельств, связанных с правонарушением, для установления обстановки и характера правонарушения, а также лиц, виновных в совершении правонарушения.","note":"","cat":"Следствие"},{"art":"47","part":"ст.","title":"Начало производства следствия","desc":"ч. 1. Если иное не оговорено, то следственные действия производятся только с момента возбуждения дела.\nч. 2. До возбуждения дела возможно проведение любого следственного действия, промедление с производством которого может привести к утрате доказательств, затруднить их обнаружение и закрепление, дать возможность лицу, совершившему правонарушение, скрыться или осложнить возмещение причиненного материального ущерба.\nч. 3. Сотрудник правоохранительных органов или иное уполномоченное лицо, установив, что дело ему не подследственно, производит следственные действия, описанные в\nч. 2 настоящей статьи, после чего передает дело лицу, подследственному вести производство по делу в порядке\nч. 1 ст. 49 настоящей главы.","note":"","cat":"Следствие"},{"art":"48","part":"ст.","title":"Принципы ведения расследования","desc":"ч. 1. Настоящим Кодексом предусмотрено два принципа ведения расследования, которые должны соблюдаться правоприменителем:\nа) Адекватность — сотрудник обязан действовать профессионально, не превышая свои должностные полномочия, и максимально точно разобраться в деле прежде чем делать умозаключения;\nб) Безотлагательность — сотрудник обязан отреагировать на правонарушение и начать действовать без необоснованных промедлений.","note":"","cat":"Следствие"},{"art":"49","part":"ст.","title":"Передача дела","desc":"ч. 1. В случае если сотрудник по объективным причинам не может или не уполномочен продолжать расследование, он обязан передать его уполномоченному сотруднику с подробным изложением всех известных ему обстоятельств дела. А также передать подозреваемого если он был задержан.","note":"","cat":"Следствие"},{"art":"50","part":"ст.","title":"Письменная отчетность","desc":"ч. 1. Дело должно вестись с письменной отчетностью в случаях предусмотренными внутренним регламентом, или в случае необходимости передачи дела в суд.\nч. 2. Процессуальные документы могут быть выполнены типографским, электронным способами. В случае отсутствия бланков процессуальных документов, выполненных типографским, электронным, они могут быть написаны от руки.","note":"","cat":"Следствие"},{"art":"51","part":"ст.","title":"Следственные действия","desc":"ч. 1. Перечень следственных действий:\nа) Допрос;\nб) Осмотр;\nв) Обыск;\nг) Выемка;\nд) Очная ставка;\nе) Опознание;\nё) Освидетельствование;\nж) Проверка показаний;\nз) Производство судебной экспертизы;\nи) Контроль и запись переговоров;\nй) Следственный эксперимент;\nк) Возбуждение дела (принятие заявления или фиксация нарушения);\nл) Оперативно-розыскные мероприятия;\nм) Задержание.","note":"","cat":"Следствие"},{"art":"52","part":"ст.","title":"Осмотр","desc":"ч. 1. Осмотр места происшествия, местности, жилища, иного помещения, предметов и документов производится в целях обнаружения следов правонарушения, выяснения других обстоятельств, имеющих значение для дела.\nч. 2. Осмотр места происшествия, документов и предметов может быть произведен до возбуждения дела.","note":"","cat":"Следствие"},{"art":"53","part":"ст.","title":"Следственный эксперимент","desc":"ч. 1. В целях проверки и уточнения данных, имеющих значение для дела, прокурор вправе произвести следственный эксперимент путем воспроизведения действий, а также обстановки или иных обстоятельств определенного события. При этом проверяется возможность восприятия каких-либо фактов, совершения определенных действий, наступления какого-либо события, а также выявляются последовательность происшедшего события и механизм образования следов. Производство следственного эксперимента допускается, если не создается опасность для здоровья участвующих в нем лиц.","note":"","cat":"Следствие"},{"art":"54","part":"ст.","title":"Обыск","desc":"ч. 1. Основания и порядок производства обыска, предусмотрены главой VI настоящего Кодекса.","note":"","cat":"Следствие"},{"art":"55","part":"ст.","title":"Выемка","desc":"ч. 1. При необходимости изъятия определенных предметов и документов, имеющих значение для дела, и если точно известно, где и у кого они находятся, производится их выемка.\nч. 2. Выемка производится на основании постановления прокурора, следователя или решения суда.","note":"","cat":"Следствие"},{"art":"56","part":"ст.","title":"Контроль и запись переговоров","desc":"ч. 1. При наличии достаточных оснований полагать, что телефонные и
